<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTRPG Generator - Version 120</title>
  <!-- Add extractContext polyfill script first - IMPORTANT! -->
  <script src="/js/extractContext.js"></script>
  <!-- REMOVE Choices.js dependency since we're using buttons instead -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Theme variables - Light and Dark mode */
    :root {
      /* Default light theme variables */
      --bg-primary: #ffffff;
      --bg-tertiary: #e0e0e0;
      --bg-card: #e8e8e8;
      --bg-content: #f9f9f9;
      --border-color: #ccc;
      --border-dark: #bbb;
      --shadow-color: rgba(0,0,0,0.1);
      --title-bg: #390249;
      --text-primary: #333;
      --text-secondary: #555;
      --text-muted: #666;
      --text-title: #fff;
      --filter-btn-default: #ccc;
      --filter-btn-unselected: #f0f0f0;
      --filter-btn-selected: #888;
      --filter-btn-border: #390249;
      --btn-hover-bg: #e0e0e0;
      --link-color: #007bff;
      --content-cell-bg: #ffffff;
      --description-bg: #f5f5f5;
      --description-border: #ddd;
      --description-text: #555;
    }

    /* Dark theme variables */
    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-tertiary: #2d2d2d;
      --bg-card: #2a2a2a;
      --bg-content: #333333;
      --border-color: #444;
      --border-dark: #555;
      --shadow-color: rgba(0,0,0,0.3);
      --title-bg: #4a0263;
      --text-primary: #e0e0e0;
      --text-secondary: #bbbbbb;
      --text-muted: #999;
      --text-title: #fff;
      --filter-btn-default: #444;
      --filter-btn-unselected: #2a2a2a;
      --filter-btn-selected: #6a467c;
      --filter-btn-border: #8a2be2;
      --btn-hover-bg: #3a3a3a;
      --link-color: #90caf9;
      --content-cell-bg: #2c2c2c;
      --description-bg: #2d2d2d;
      --description-border: #444;
      --description-text: #aaa;
    }
    
    /* Base styles */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
      font-size: 14px; /* Reduced base font size */
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
    
    /* Theme toggle button */
    #themeToggle {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-title);
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #themeToggle:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    /* Header containers - REDUCED SIZE */
    #titleContainer {
      text-align: center;
      padding: 5px; /* Reduced from 10px */
      background-color: var(--title-bg);
      color: var(--text-title);
      position: relative; /* For positioning theme toggle */
    }
    #titleContainer h1 {
      margin: 5px 0; /* Smaller margin for h1 */
      font-size: 1.4em; /* Smaller title */
    }
    #searchContainer {
      display: flex;
      padding: 8px; /* Reduced from 15px */
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color); /* Thinner border */
    }
    #searchInput {
      flex: 1;
      padding: 5px 8px; /* Reduced padding */
      font-size: 0.9em; /* Smaller font */
      border: 1px solid var(--border-color);
      border-radius: 3px; /* Smaller radius */
      height: 22px; /* Explicit height */
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
    
    /* Filter styles - MODIFIED for horizontal layout */
    #filtersContainer {
      display: flex;
      padding: 4px; /* Reduced from 6px */
      background-color: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-color); /* Thinner border */
      gap: 8px; /* Reduced gap from 15px */
      margin-bottom: 20px; /* Increased to accommodate expand buttons */
      position: relative;
    }
    .filter-container {
      display: flex;
      flex-direction: row; /* Changed from column to row for horizontal layout */
      position: relative;
      flex: 1;
      align-items: flex-start; /* Changed to allow proper expansion */
      gap: 8px; /* Gap between header and buttons */
    }
    .filter-header {
      display: flex;
      flex-shrink: 0; /* Don't shrink header */
      width: 75px; /* Fixed width for header */
      justify-content: space-between;
      align-items: center;
    }
    .filter-title {
      font-weight: bold;
      color: var(--text-primary);
      font-size: 0.9em; /* Smaller title */
      white-space: nowrap; /* Prevent wrapping */
    }
    .filter-clear {
      background: none;
      border: none;
      color: var(--link-color);
      cursor: pointer;
      font-size: 1em; /* Slightly smaller */
      padding: 0;
      width: 20px; /* Smaller button */
      height: 20px; /* Smaller button */
      line-height: 18px; /* Adjusted line height */
      text-align: center;
      margin-left: 4px; /* Add a small space between title and clear button */
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      flex: 1; /* Take remaining space */
      gap: 4px; /* Reduced from 6px */
      max-height: 28px; /* Reduced from 56px for single row */
      overflow: hidden;
      position: relative;
      transition: max-height 0.3s ease-out;
      align-content: flex-start;
    }
    .filter-buttons::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px; /* Thinner gradient */
      background: linear-gradient(to bottom, transparent, var(--bg-tertiary));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .filter-buttons.has-overflow::after {
      opacity: 1;
    }
    .filter-buttons.expanded {
      max-height: 200px; /* Reduced from 200px */
      overflow-y: auto;
      padding-bottom: 10px; /* Better spacing at bottom */
    }
    .filter-buttons.expanded::after {
      opacity: 0;
    }
    .filter-btn {
      background-color: var(--filter-btn-default); /* DefaultState */
      border: 1px solid transparent; /* Thinner border */
      border-radius: 3px; /* Smaller radius */
      padding: 2px 6px; /* Less padding */
      cursor: pointer;
      font-size: 0.85em; /* Smaller text */
      white-space: nowrap;
      transition: all 0.2s;
      color: var(--text-primary);
    }
    .filter-btn.unselected {
      background-color: var(--filter-btn-unselected); /* UnSelectedState */
    }
    .filter-btn.selected {
      background-color: var(--filter-btn-selected); /* SelectedState */
      border-color: var(--filter-btn-border); /* Highlighted border */
      color: white;
    }

    /* Add styles for unavailable filter options */
    .filter-btn.unavailable {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: var(--bg-secondary);
      color: var(--text-muted);
      pointer-events: none;  /* Disable interaction */
    }
    .expand-btn {
      position: absolute; /* Position absolute to place it below */
      bottom: -18px; /* Position below the filter */
      left: 50%; /* Center horizontally */
      transform: translateX(-50%);
      width: 24px; /* Fixed width */
      height: 18px;
      border: 1px solid var(--border-color);
      border-top: none;
      background-color: var(--bg-tertiary);
      cursor: pointer;
      padding: 0;
      text-align: center;
      font-size: 0.85em; /* Smaller text */
      color: var(--text-secondary);
      font-weight: bold;
      display: none; /* Hide by default */
      z-index: 15; /* Ensure it appears above content */
      border-radius: 0 0 3px 3px; /* Rounded bottom corners */
    }
    .filter-container.has-significant-overflow .expand-btn,
    .filter-container .filter-buttons.expanded + .expand-btn {
      display: block;
    }
    .expand-btn:hover {
      background-color: var(--btn-hover-bg);
    }
    #resetButton {
      margin-left: 10px; /* Reduced from 20px */
      font-size: 0.85em; /* Smaller text */
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      border-radius: 3px; /* Smaller radius */
      height: 24px; /* Reduced height */
      align-self: center;
      padding: 0 8px; /* Added horizontal padding */
      color: var(--text-primary);
    }
    
    /* Add extra space below filters for expand buttons */
    #filtersContainer {
      margin-bottom: 26px; /* Space for expand buttons */
      position: relative; /* For absolute positioning of children */
    }
    
    /* Content layout */
    #contentWrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #leftColumn {
      width: 20%; /* Reduced from 25% */
      padding: 3px; /* Reduced padding */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color); /* Thinner border */
      overflow-y: auto;
      background-color: var(--bg-secondary);
    }
    .matching-table-button {
      width: 100%;
      padding: 4px; /* Reduced padding */
      margin-bottom: 3px; /* Reduced margin */
      font-size: 0.85em; /* Smaller font */
      background-color: var(--bg-secondary);
      border: none;
      border-radius: 3px; /* Smaller radius */
      text-align: center;
      cursor: pointer;
      transition: background-color 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .matching-table-button:hover {
      background-color: var(--btn-hover-bg);
    }
    #mainContent {
      flex: 1;
      padding: 10px; /* Reduced padding */
      box-sizing: border-box;
      overflow-y: auto;
      background-color: var(--bg-primary);
    }
    
    /* Card styles */
    .generation-container,
    #savedGenerations .generation-container {
      margin: 10px 0; /* Reduced from 15px */
      padding: 8px; /* Reduced padding */
      border-radius: 6px; /* Smaller radius */
      background-color: var(--bg-card) !important;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 3px var(--shadow-color); /* Lighter shadow */
      position: relative;
    }
    .generation-object {
      margin: 8px; /* Reduced margin */
      padding: 8px; /* Reduced padding */
      border: 1px solid var(--border-color);
      border-radius: 3px; /* Smaller radius */
      background-color: var(--bg-content);
      cursor: grab;
      color: var(--text-primary);
    }
    
    /* Fixed style for result rows to prevent stacking */
    .result-row {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: flex-start !important;
      position: relative !important;
      width: 100% !important;
      overflow-x: auto !important;
      background-color: transparent !important;
      padding: 1px 0 !important; /* Reduced padding */
      margin-bottom: 3px !important; /* Reduced margin */
      min-height: 24px !important; /* Smaller height */
      max-height: 30px !important; /* Smaller max height */
      border: none !important;
      box-sizing: border-box !important;
    }
    
    /* Hide WebKit scrollbars */
    .result-row::-webkit-scrollbar {
      display: none;
    }
    
    /* Make content cells more compact */
    .result-row .result-content {
      flex: 0 0 auto !important;
      min-width: 180px !important; /* Smaller min-width */
      max-width: 400px !important; /* Smaller max-width */
      height: 22px !important; /* Shorter height */
      line-height: 22px !important; /* Adjusted line height */
      margin-right: 6px !important; /* Less margin */
      padding: 0 6px !important; /* Less padding */
      border: 1px solid var(--border-color) !important;
      background-color: var(--content-cell-bg) !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      border-radius: 2px !important; /* Smaller radius */
      position: relative !important;
      z-index: 1 !important;
      font-size: 0.9em !important; /* Smaller text */
      color: var(--text-primary) !important;
    }
    
    /* Keep header at single line height */
    .result-row .result-header {
      flex: 0 0 180px !important; /* Reduced from 240px */
      min-width: 180px !important;
      max-width: 180px !important;
      height: 22px !important; /* Shorter height */
      line-height: 22px !important; /* Adjusted line height */
      margin-right: 6px !important; /* Less margin */
      padding: 0 4px !important; /* Less padding */
      border: 1px solid var(--border-color) !important;
      font-weight: bold !important;
      background-color: var(--content-cell-bg) !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      border-radius: 2px !important; /* Smaller radius */
      position: relative !important;
      z-index: 1 !important;
      font-size: 0.9em !important; /* Smaller text */
      color: var(--text-primary) !important;
    }
    
    /* Ensure reroll button stays at end */
    .result-row .reroll-btn {
      margin-left: auto !important;
      flex-shrink: 0 !important;
      position: sticky !important;
      right: 0 !important;
      background-color: var(--content-cell-bg) !important;
      border-radius: 50% !important;
      z-index: 2 !important;
      width: 22px !important; /* Smaller button */
      height: 22px !important; /* Smaller button */
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    
    /* Make sure the reroll button has a white background when content scrolls under it */
    .result-row .reroll-btn::before {
      content: '';
      position: absolute;
      top: -3px; /* Less padding */
      right: -3px; /* Less padding */
      bottom: -3px; /* Less padding */
      left: -3px; /* Less padding */
      z-index: -1;
      border-radius: 50%;
    }
    
    /* Remove tooltip hover effect */
    .result-content:hover::after {
      display: none !important;
    }
    
    /* Button hover effect */
    .reroll-btn:hover {
      transform: scale(1.15); /* Slightly reduced scale */
    }
    
    /* Card title and button styles */
    .card-title {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 1em;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
    }
    .card-title:active {
      cursor: grabbing;
    }
    .card-title-text {
      flex: 1 1 auto; /* Allow the title to grow and shrink as needed */
      min-width: 0; /* Critical for text-overflow to work properly */
      color: var(--text-primary) !important;
      font-weight: bold;
      font-size: 0.95em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }
    .card-actions {
      flex: 0 0 auto; /* Don't grow or shrink, use natural width */
      display: flex;
      gap: 4px; /* Reduced from 8px to save space */
      align-items: center;
    }
    
    /* Make buttons more compact by removing text */
    .copy-btn, .reroll-all-btn, .delete-card-btn {
      background: none;
      border: none;
      padding: 0;
      width: 24px;
      height: 24px; /* Preserving original button height */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
    }
    
    .reroll-all-btn:hover, .copy-btn:hover {
      transform: scale(1.05);
      color: var(--text-primary);
    }
    .delete-card-btn:hover {
      transform: scale(1.05);
      color: #ff3333;
    }
    .reroll-all-btn img, .copy-btn img, .delete-card-btn img {
      width: 18px; /* Slightly larger icons since we removed text */
      height: 18px;
      border-radius: 2px;
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.15));
    }
    
    /* Toast notification */
    .toast-message {
      position: fixed;
      bottom: 15px; /* Moved up slightly */
      left: 50%;
      font-size: 0.7em;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      padding: 0;
      transition: transform 0.2s, color 0.2s;
    }
    .reroll-all-btn:hover, .copy-btn:hover {
      transform: scale(1.05);
      color: var(--text-primary);
    }
    .delete-card-btn:hover {
      transform: scale(1.05);
      color: #ff3333;
    }
    .reroll-all-btn img, .copy-btn img, .delete-card-btn img {
      width: 16px; /* Smaller icons */
      height: 16px; /* Smaller icons */
      margin-left: 4px; /* Reduced margin */
      border-radius: 2px; /* Smaller radius */
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.15));
    }
    .reroll-btn img {
      width: 18px; /* Smaller icon */
      height: 18px; /* Smaller icon */
      border-radius: 3px; /* Smaller radius */      
    }
    
    /* Toast notification */
    .toast-message {
      position: fixed;
      bottom: 15px; /* Moved up slightly */
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 15px; /* Less padding */
      border-radius: 3px; /* Smaller radius */
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.9em; /* Smaller text */
    }
    .toast-visible {
      opacity: 1;
    }
    
    /* Saved cards section */
    .saved-cards {
      width: 20%; /* Reduced from 25% */
      padding: 8px; /* Reduced padding */
      background-color: var(--bg-secondary);
      border-left: 1px solid var(--border-color); /* Thinner border */
      overflow-y: auto;
    }
    #savedGenerations h2 {
      margin-top: 0;
      margin-bottom: 8px; /* Added specific bottom margin */
      padding-bottom: 6px; /* Reduced padding */
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary) !important;
      font-weight: bold;
      font-size: 1.1em; /* Smaller heading */
    }
    #savedGenerations .generation-container {
      margin-bottom: 12px; /* Reduced margin */
      box-shadow: 0 2px 3px var(--shadow-color); /* Lighter shadow */
    }
    
    /* Drag and drop styles */
    .card-being-dragged {
      opacity: 0.6;
      transform: scale(0.98);
      box-shadow: 0 3px 6px var(--shadow-color); /* Lighter shadow */
    }
    .drop-target-highlight {
      background-color: var(--bg-tertiary);
      border: 1px dashed var(--link-color); /* Thinner border */
    }
    .dragging {
      opacity: 0.5;
    }
    .delete-btn {
      display: none;
    }
    
    /* Force consistent styling for all cards */
    .generation-container {
      margin: 10px 0; /* Reduced margin */
      padding: 10px; /* Reduced padding */
      border-radius: 6px; /* Smaller radius */
      background-color: var(--bg-card) !important;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 3px var(--shadow-color); /* Lighter shadow */
      position: relative;
    }
    .result-header, .result-content {
      background-color: var(--content-cell-bg) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-color) !important;
    }
    
    /* Saved cards special styling */
    .saved-cards .generation-container {
      background-color: var(--bg-card) !important;
      border: 1px solid var(--border-dark) !important;
    }
    
    /* IMPORTANT: Reset any potential filters that could cause graying out */
    .saved-cards,
    .saved-cards *,
    #savedGenerations,
    #savedGenerations * {
      filter: none !important;
      -webkit-filter: none !important;
      opacity: 1 !important;
      color-filter: none !important;
      -webkit-font-smoothing: antialiased !important;
      font-smooth: always !important;
      color-interpolation-filters: auto !important;
      color-adjust: exact !important;
    }
    
    /* Force all text to be proper color for maximum contrast in saved cards */
    .saved-cards .result-header, 
    .saved-cards .result-content,
    .saved-cards .card-title-text {
      color: var(--text-primary) !important;
    }
    
    /* Ensure images are displayed at full brightness and contrast */
    .saved-cards img,
    .saved-cards .reroll-btn img,
    .saved-cards .reroll-all-btn img,
    .saved-cards .copy-btn img,
    .saved-cards .delete-card-btn img {
      filter: contrast(1.1) brightness(1.1) !important;
      -webkit-filter: contrast(1.1) brightness(1.1) !important;
      opacity: 1 !important;
      background: transparent !important;
    }
    
    /* Set a crisp border on all elements to ensure they're distinct */
    .saved-cards .result-row,
    .saved-cards .result-header,
    .saved-cards .result-content {
      border: 1px solid var(--border-dark) !important;
      background-color: var(--content-cell-bg) !important;
    }
    
    /* Additional fix for card container background */
    .saved-cards .generation-container {
      background-color: var(--bg-card) !important;
      border: 1px solid var(--border-dark) !important;
    }
    
    /* Force fix for result row borders - override all other styles */
    .result-row,
    #savedGenerations .result-row,
    .saved-cards .result-row,
    div.result-row {
      border: none !important;
      background-color: transparent !important;
      box-shadow: none !important;
      outline: none !important;
    }
    
    /* Collapse/expand functionality - UPDATED FOR BOTTOM POSITIONING */
    .collapse-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px; /* Smaller button */
      height: 18px; /* Smaller button */
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 12px; /* Smaller text */
      color: var(--text-secondary);
      transition: transform 0.2s, color 0.2s;
      position: absolute;
      bottom: 3px; /* Position at bottom */
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      border-radius: 50%;
      background-color: var(--content-cell-bg) !important;
      box-shadow: 0 1px 2px var(--shadow-color); /* Lighter shadow */
    }
    .collapse-btn:hover {
      color: var (--text-primary);
      background-color: var(--btn-hover-bg);
    }
    .card-title {
      padding-top: 3px; /* Reduced padding */
      position: relative;
    }
    .generation-container.collapsed .card-content {
      display: none;
    }
    .generation-container.collapsed {
      padding-bottom: 16px; /* Space for collapse button at bottom */
    }
    .generation-container:not(.collapsed) {
      padding-bottom: 16px; /* Space for collapse button at bottom */
    }
    
    /* FIX: Reverse the arrow logic - previously was backward */
    .generation-container.collapsed .collapse-btn .up-arrow {
      display: none;
    }
    .generation-container:not(.collapsed) .collapse-btn .down-arrow {
      display: none;
    }
    
    .card-content {
      transition: max-height 0.3s ease-out;
      overflow: hidden;
      margin-bottom: 10px; /* Space above collapse button */
    }
    
    /* Add to your existing styles */
    #clearBtn {
      margin-top: 5px; /* Reduced margin */
      margin-left: 5px; /* Reduced margin */
      padding: 1px 6px;
      font-size: 0.9em; /* Smaller text */
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var (--border-color);
    }

<body>
  <div id="titleContainer">

  </div>

  <div id="searchContainer">

  </div>

  <!-- REPLACE the filter section with our new button-based UI in horizontal layout -->
  <div id="filtersContainer">
    <div class="filter-container">
      <div class="filter-header">
        <span class="filter-title">Game</span>
        <!-- Commented out individual clear button
        <button class="filter-clear" onclick="clearFilter('game')">&times;</button>

    <button id="filterExpandBtn" onclick="toggleAllFilters()" aria-label="Show more filters">▼</button>
  </div>

  <div id="contentWrapper">
    <div id="leftColumn">
      <div id="matchingTablesContainer">
        <!-- Matching table buttons will be dynamically populated here -->
      </div>
    </div>

    <div id="mainContent">
      <div id="tableHeaders">
        <!-- Table name and details will be displayed here -->
      </div>
      <div id="generationControls" class="slider-container" style="display: none;">
        <label for="generationSlider">Number of Generations: <span id="generationValue">1</span></label><br>
        <input type="range" id="generationSlider" min="1" max="100" value="1" oninput="updateGenerationValue()">
        <button id="generateBtn" style="margin-top: 10px;" onclick="generateContent()">Generate</button>
        <button id="showTableBtn" style="margin-top: 10px; margin-left: 10px;" onclick="showTableContent()">Show Table</button>
        <button id="clearBtn" style="margin-top: 10px; margin-left: 10px;" onclick="clearGeneratedList()">Clear All</button>
      </div>

        <!-- Generation List goes here, each generation being its own object in the list. -->

    </div>

  <script>
    let tablesData = [];
    let currentSelectedTable = null;
    let generationContexts = {};

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        const response = await fetch('/api/tables');
        tablesData = await response.json();
        console.log('Tables Data:', tablesData);
        populateFilterButtons(tablesData); // New function to populate filter buttons
        applyFilters();
      } catch (error) {
        console.error('Error fetching tables:', error);
      }

      // Set up drag and drop for saved cards
      const savedArea = document.getElementById('savedGenerations');
      
      savedArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('drop-target-highlight');
        e.dataTransfer.dropEffect = 'copy';
      });
      
      savedArea.addEventListener('dragleave', function(e) {
        this.classList.remove('drop-target-highlight');
      });
      
      savedArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('drop-target-highlight');
        const cardIndex = e.dataTransfer.getData('text/plain');
        const originalCard = document.querySelector(`.generation-container[data-index="${cardIndex}"]`);
        
        if (!originalCard) return;
        
        // Check if this card already exists in the saved area by comparing content
        const cardTitle = originalCard.querySelector('.card-title-text').textContent;
        
        // Get all headers and contents from the original card to create a unique signature
        const originalHeaders = Array.from(originalCard.querySelectorAll('.result-header')).map(h => h.textContent);
        const originalContents = Array.from(originalCard.querySelectorAll('.result-content')).map(c => c.textContent);
        const cardSignature = JSON.stringify({ title: cardTitle, headers: originalHeaders, contents: originalContents });
        
        // Check if a card with the same signature already exists
        let isDuplicate = false;
        const savedCards = savedArea.querySelectorAll('.generation-container');
        savedCards.forEach(savedCard => {
          const savedHeaders = Array.from(savedCard.querySelectorAll('.result-header')).map(h => h.textContent);
          const savedContents = Array.from(savedCard.querySelectorAll('.result-content')).map(c => c.textContent);
          const savedSignature = JSON.stringify({ 
            title: savedCard.querySelector('.card-title-text').textContent, 
            headers: savedHeaders, 
            contents: savedContents });
          
          if (savedSignature === cardSignature) {
            isDuplicate = true;
          }
        });
        
        if (isDuplicate) {
          showToast('Card already exists in Saved Cards');
          return;
        }
        
        // Clone the card and add to saved area
        const cardClone = originalCard.cloneNode(true);
        const newIndex = `saved-${Date.now()}`;
        cardClone.dataset.index = newIndex;
        
        // Reattach event handlers for all buttons in the cloned card
        cardClone.querySelector('.copy-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToMarkdown(cardClone);
        });
        
        cardClone.querySelector('.reroll-all-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          rerollAllContent(cardClone);
        });
        
        cardClone.querySelector('.delete-card-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteCard(cardClone);
        });
        
        // Make the clone draggable too, but it won't actually be draggable due to our check in handleCardDragStart
        cardClone.addEventListener('dragstart', handleCardDragStart);
        cardClone.addEventListener('dragend', handleCardDragEnd);
        
        // Update collapse button handlers
        cardClone.querySelector('.collapse-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCardCollapse(e.currentTarget);
        });
        
        // Add the card to the saved area
        this.appendChild(cardClone);
        
        // Show confirmation
        showToast('Card saved!');
      });
    });

    // New function to populate filter buttons
    function populateFilterButtons(tables) {
      const gameSet = new Set();
      const typeSet = new Set();
      const settingSet = new Set();

      tables.forEach(table => {
        if (table.game) gameSet.add(table.game);
        
        // Handle type as either an array or string
        if (Array.isArray(table.type)) {
          table.type.forEach(t => {
            if (t) typeSet.add(t);
          });
        } else if (table.type) {
          typeSet.add(table.type);
        }
        
        if (table.setting) settingSet.add(table.setting);
      });

      createFilterButtons('gameFilter', Array.from(gameSet));
      createFilterButtons('typeFilter', Array.from(typeSet));
      createFilterButtons('settingFilter', Array.from(settingSet));
    }

    // Helper function to create filter buttons
    function createFilterButtons(filterId, options) {
      const filterContainer = document.getElementById(filterId);
      filterContainer.innerHTML = '';
      
      options.sort().forEach(option => {
        const button = document.createElement('button');
        button.className = 'filter-btn';
        button.textContent = option;
        button.dataset.value = option;
        button.onclick = function() {
          toggleFilterButton(this, filterId);
        };
        filterContainer.appendChild(button);
      });
      
      // Check if the container has overflow and add indicator class
      setTimeout(() => {
        checkFilterOverflow(filterId);
      }, 0);
    }
    
    // New function to check if filter container has significant overflow content
    function checkFilterOverflow(filterId) {
      const container = document.getElementById(filterId);
      const significantOverflowThreshold = 10; // Show "More" when we have this much overflow
      
      if (container.scrollHeight > container.clientHeight || container.scrollWidth > container.clientWidth) {
        // Add has-overflow class for any overflow
        container.classList.add('has-overflow');
        
        // Check if overflow is significant enough to show controls
        const hasSignificantOverflow = 
          container.scrollHeight - container.clientHeight > significantOverflowThreshold || 
          container.scrollWidth - container.clientWidth > 20; // Higher threshold for horizontal
        
        if (hasSignificantOverflow) {
          container.closest('.filter-container').classList.add('has-significant-overflow');
        } else {
          container.closest('.filter-container').classList.remove('has-significant-overflow');
        }
      } else {
        container.classList.remove('has-overflow');
        container.closest('.filter-container').classList.remove('has-significant-overflow');
      }
    }

    // Toggle filter button states
    function toggleFilterButton(button, filterId) {
      const filterContainer = document.getElementById(filterId);
      const currentMode = filterContainer.dataset.mode;
      
      if (currentMode === 'all-selected') {
        // Switching from AllSelectedMode to ChoiceMode
        filterContainer.dataset.mode = 'choice';
        
        // Set all buttons to unselected state
        const buttons = filterContainer.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
          btn.classList.add('unselected');
          btn.classList.remove('selected');
        });
        
        // Set the clicked button to selected
        button.classList.remove('unselected');
        button.classList.add('selected');
      } else {
        // Already in ChoiceMode, toggle this button
        button.classList.toggle('unselected');
        button.classList.toggle('selected');
        
        // If no buttons are selected, switch back to all-selected mode
        const selectedButtons = filterContainer.querySelectorAll('.filter-btn.selected');
        if (selectedButtons.length === 0) {
          clearFilter(filterId.replace('Filter', ''));
        }
      }
      
      // Apply filters with the new selection
      applyFilters();
    }

    // Clear a specific filter (reset to all-selected mode)
    function clearFilter(filterType) {
      const filterId = filterType + 'Filter';
      const filterContainer = document.getElementById(filterId);
      
      filterContainer.dataset.mode = 'all-selected';
      const buttons = filterContainer.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.classList.remove('unselected', 'selected');
      });
      
      console.log('Filter cleared:', filterType);
      applyFilters();
    }

    // Toggle filter section expansion
    function toggleFilterExpand(filterId) {
      const filterContainer = document.getElementById(filterId);
      filterContainer.classList.toggle('expanded');
      
      const expandBtn = document.querySelector(`.expand-btn[onclick*="${filterId}"]`);
      if (filterContainer.classList.contains('expanded')) {
        expandBtn.textContent = '▲';
      } else {
        expandBtn.textContent = '▼';
      }
      
      // Recalculate overflow after toggling
      setTimeout(() => {
        checkFilterOverflow(filterId);
      }, 300);
    }

    // Reset all filters to default state
    function resetFilters() {
      clearFilter('game');
      clearFilter('type');
      clearFilter('setting');
      document.getElementById('searchInput').value = '';
      applyFilters();
    }

    function performSearch() {
      applyFilters();
    }

    // Updated applyFilters function to work with the new button-based UI
    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      // Get selected filter values from the new button UI
      const gameFilter = getSelectedValues('gameFilter');
      const typeFilter = getSelectedValues('typeFilter');
      const settingFilter = getSelectedValues('settingFilter');
      
      console.log('Applying filters:', { 
        search: searchQuery,
        game: gameFilter,
        type: typeFilter,
        setting: settingFilter
      });

      const matchingTablesContainer = document.getElementById('matchingTablesContainer');
      matchingTablesContainer.innerHTML = '';

      const filteredTables = tablesData.filter(table => {
        // Search by name
        const matchesSearch = searchQuery === '' || 
                            (table.tablename && table.tablename.toLowerCase().includes(searchQuery));
        
        // Filter by game
        const matchesGame = gameFilter.length === 0 || 
                          (table.game && gameFilter.includes(table.game));
        
        // Handle type filter when type is an array
        let matchesType = false;
        if (typeFilter.length === 0) {
          matchesType = true;
        } else if (Array.isArray(table.type)) {
          // Check if any type in the array matches any selected type filter
          matchesType = table.type.some(t => typeFilter.includes(t));
        } else {
          // Handle single type as before
          matchesType = table.type && typeFilter.includes(table.type);
        }
        
        // Filter by setting
        const matchesSetting = settingFilter.length === 0 || 
                             (table.setting && settingFilter.includes(table.setting));
        
        return matchesSearch && matchesGame && matchesType && matchesSetting;
      });
      
      console.log(`Found ${filteredTables.length} matching tables`);

      filteredTables.forEach(table => {
        const button = document.createElement('button');

    function rerollContent(button) {
      if (!currentSelectedTable) {
        console.error('No table currently selected');
        return;
      }
  
      // Get the row containing this button
      const resultRow = button.closest('.result-row');
      if (!resultRow) {
        console.error('Could not find parent result row');
        return;
      }
      
      // Check if the row is locked
      if (resultRow.classList.contains('locked')) {
        console.log('This row is locked and cannot be rerolled');
        return;
      }
  
      // Get the header text to know what to reroll
      const header = resultRow.querySelector('.result-header').textContent;
      
      // Find which generation this belongs to
      const generationContainer = button.closest('.generation-container');
      if (!generationContainer) {
        console.error('Could not find parent generation container');
        return;
      }
      
      const generationIndex = generationContainer.dataset.index;
      const context = generationContexts[generationIndex] || {};
      
      // Get the format of the existing row to help with re-rendering
      const rowFormat = resultRow.getAttribute('data-format') || '';
      console.log(`Rerolling ${header} in table ${currentSelectedTable.filename} (format: ${rowFormat})`);
      console.log(`Context:`, context);
      
      // Show loading indicator in the row
      resultRow.style.opacity = '0.5';
      
      // Call the server to reroll just this item
      fetch('/api/reroll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          table: currentSelectedTable,
          header: header,
          context: context
        })
      })
      .then(response => response.json())
      .then(data => {
        console.log(`Received reroll response for ${header}:`, data);
        
        // Update the context if provided
        if (data.context) {
          Object.assign(context, data.context);
        }
        
        // Make sure we have data.result
        if (!data.result) {
          throw new Error('No result data returned from server');
        }
        
        try {
          // IMPORTANT: Clear all existing content divs first
          const contentDivs = resultRow.querySelectorAll('.result-content');
          contentDivs.forEach(div => div.remove());
          
          // Get reference to header div
          const headerDiv = resultRow.querySelector('.result-header');
          
          // Variables to store the new content value for the title update
          let newTitleValue = '';
          let shouldUpdateTitle = false;
          
          // First, check if this was a career-style row (from original format or from array structure)
          const isCareerRow = rowFormat === 'career' || 
                             (Array.isArray(data.result.result) && 
                              data.result.result.length === 2 && 
                              typeof data.result.result[0] === 'string' && 
                              typeof data.result.result[1] === 'string');

          // Career-style array handling (array with exactly two string elements)
          if (isCareerRow) {
            console.log('Processing career-style array:', data.result.result);
            
            let career, items;
            // Extract the two string values from the result
            if (Array.isArray(data.result.result) && data.result.result.length === 2) {
              // Normal array of two strings
              [career, items] = data.result.result;
            } else if (typeof data.result.result === 'object' && data.result.result.career && data.result.result.items) {
              // Object with career and items properties
              career = data.result.result.career;
              items = data.result.result.items;
            } else if (typeof data.result.result === 'string') {
              // Split string result if needed (fallback)
              const parts = data.result.result.split(',');
              career = parts[0];
              items = parts.slice(1).join(',');
            } else {
              console.error('Unexpected career format:', data.result.result);
              career = "Unknown Career";
              items = "Unknown Items";
            }
            
            // Create first content div for career
            const careerDiv = document.createElement('div');
            careerDiv.className = 'result-content';
            careerDiv.textContent = career;
            careerDiv.title = career;
            headerDiv.insertAdjacentElement('afterend', careerDiv);
            
            // Create second content div for items
            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'result-content';
            itemsDiv.textContent = items;
            itemsDiv.title = items;
            careerDiv.insertAdjacentElement('afterend', itemsDiv);
            
            // Update the row's format attribute
            resultRow.setAttribute('data-format', 'career');
            
            // Update context with the array
            context[header] = [career, items];
            
            // Use career for title update if this is the first row
            if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
              newTitleValue = career;
              shouldUpdateTitle = true;
            }
          }
          // Simple string handling
          else if (typeof data.result.result === 'string' || typeof data.result.result === 'number') {
            // This handles most simple cases
            console.log('Processing simple string value:', data.result.result);
            
            const stringValue = String(data.result.result);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'result-content';
            contentDiv.textContent = stringValue;
            contentDiv.title = stringValue;
            headerDiv.insertAdjacentElement('afterend', contentDiv);
            
            // Update context
            context[header] = stringValue;
            
            // Only update title if this is the first row
            if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
              newTitleValue = stringValue;
              shouldUpdateTitle = true;
            }
          }
          // Regular array handling (non-career arrays)
          else if (Array.isArray(data.result.result)) {
            console.log('Processing array format:', data.result.result);
            
            // Special case for weighted arrays [value, weight]
            if (data.result.result.length === 2 && 
                typeof data.result.result[0] === 'string' && 
                typeof data.result.result[1] === 'number') {
              
              const value = data.result.result[0];
              const contentDiv = document.createElement('div');
              contentDiv.className = 'result-content';
              contentDiv.textContent = value;
              contentDiv.title = value;
              headerDiv.insertAdjacentElement('afterend', contentDiv);
              
              // Update context with just the value
              context[header] = value;
              
              // Check if this is the first row
              if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = value;
                shouldUpdateTitle = true;
              }
            }
            // Normal array case
            else {
              // Process each array element and create corresponding content divs
              let resultValues = [];
              let lastInsertedDiv = headerDiv;
              
              // Loop through array items (limit to max 4)
              const maxItems = Math.min(data.result.result.length, 4); 
              for (let i = 0; i < maxItems; i++) {
                let arrayValue;
                // Handle nested weighted arrays
                if (Array.isArray(data.result.result[i]) && 
                    data.result.result[i].length === 2 && 
                    typeof data.result.result[i][0] === 'string' && 
                    typeof data.result.result[i][1] === 'number') {
                  arrayValue = data.result.result[i][0]; // Just take the value
                } else {
                  arrayValue = String(data.result.result[i] || '');
                }
                
                resultValues.push(arrayValue);
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'result-content';
                contentDiv.textContent = arrayValue;
                contentDiv.title = arrayValue;
                
                lastInsertedDiv.insertAdjacentElement('afterend', contentDiv);
                lastInsertedDiv = contentDiv;
              }
              
              // Update context with the array
              context[header] = resultValues;
              
              // Use first array element for title update if this is the first row
              if (resultValues.length > 0 && resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = resultValues[0];
                shouldUpdateTitle = true;
              }
            }
          }
          // Object result handling
          else if (typeof data.result.result === 'object' && data.result.result !== null) {
            console.log('Processing object result:', data.result);
            
            let extractedValue = "";
            
            // Try to extract a usable string value from the object
            // First, look for a 'result' property in the nested result
            if (typeof data.result.result.result === 'string') {
              extractedValue = data.result.result.result;
            } 
            // Otherwise look for any string property that's not special (starts with _)
            else {
              for (const key in data.result.result) {
                if (typeof data.result.result[key] === 'string' && !key.startsWith('_')) {
                  extractedValue = data.result.result[key];
                  break;
                }
              }
            }
            
            // If nothing found in nested result, check top level
            if (!extractedValue && typeof data.result === 'object') {
              for (const key in data.result) {
                if (typeof data.result[key] === 'string' && !key.startsWith('_') && key !== 'header') {
                  extractedValue = data.result[key];
                  break;
                }
              }
            }
            
            // If still no value found, use a generic message
            if (!extractedValue) {
              extractedValue = "No string value found";
              console.warn('Could not extract string value from result:', data.result);
            }
            
            // Create the content div with the extracted value
            const contentDiv = document.createElement('div');
            contentDiv.className = 'result-content';
            contentDiv.textContent = extractedValue;
            contentDiv.title = extractedValue;
            headerDiv.insertAdjacentElement('afterend', contentDiv);
            
            // Update context with the string value
            context[header] = extractedValue;
            
            // Use extracted value for title update if this is the first row
            if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
              newTitleValue = extractedValue;
              shouldUpdateTitle = true;
            }
          }
          // Fallback for any other type
          else {
            console.log('Using fallback handling for result:', data.result);
            
            const resultStr = JSON.stringify(data.result.result);
            const contentDiv = document.createElement('div');
            contentDiv.className = 'result-content';
            contentDiv.textContent = resultStr;
            contentDiv.title = resultStr;
            headerDiv.insertAdjacentElement('afterend', contentDiv);
            
            // Only update title if this is the first row
            if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
              newTitleValue = resultStr;
              shouldUpdateTitle = true;
            }
          }
          
          // UPDATE CARD TITLE if appropriate
          if (newTitleValue && newTitleValue.trim() && shouldUpdateTitle) {
            updateCardTitle(generationContainer, newTitleValue);
          }
          
          // Always reset opacity
          resultRow.style.opacity = '1';
        } catch (error) {
          console.error('Error processing reroll result:', error);
          console.error('Data that caused error:', data);
          resultRow.style.opacity = '1';
          alert(`Error processing result: ${error.message}`);
        }
      })
      .catch(error => {
        console.error('Error rerolling content:', error);
        resultRow.style.opacity = '1';
        alert('Failed to reroll content. Please try again.');
      });
    }

        // Using the full text and letting CSS truncate
      }

    // New function to reroll an entire generation/card
    function rerollAllContent(generationContainer) {
      if (!currentSelectedTable) {
        console.error('No table currently selected');
        return;
      }
      
      // Store the collapsed state
      const wasCollapsed = generationContainer.classList.contains('collapsed');
      
      // Find all unlocked rows that need to be rerolled
      const unlockedRows = generationContainer.querySelectorAll('.result-row:not(.locked)');
      if (unlockedRows.length === 0) {
        console.log('No unlocked rows to reroll');
        showToast('No unlocked rows to reroll');
        return;
      }
      
      // Pre-process and cache all locked rows BEFORE starting any rerolls
      const lockedRowsCache = {};
      const lockedRows = generationContainer.querySelectorAll('.result-row.locked');
      lockedRows.forEach(row => {
        const header = row.querySelector('.result-header').textContent;
        const contentElements = row.querySelectorAll('.result-content');
        
        // Store content based on row format
        const format = row.getAttribute('data-format');
        if (format === 'career' && contentElements.length >= 2) {
          lockedRowsCache[header] = [
            contentElements[0].textContent,
            contentElements[1].textContent
          ];
        } else if (format === 'multi-array') {
          lockedRowsCache[header] = Array.from(contentElements).map(el => el.textContent);
        } else {
          lockedRowsCache[header] = contentElements.length > 0 ? contentElements[0].textContent : '';
        }
        
        // Also capture the DOM elements to help with restoration
        lockedRowsCache[header + '_elements'] = {
          row: row,
          format: format,
          contentElements: contentElements
        };
        
        console.log(`Cached locked row "${header}" with format ${format}`);
      });
      
      // Check if the first row is locked (to prevent title updates)
      const firstRow = generationContainer.querySelector('.result-row:first-child');
      const isFirstRowLocked = firstRow && firstRow.classList.contains('locked');
      
      console.log(`Rerolling ${unlockedRows.length} unlocked rows in card (${lockedRows.length} locked rows will be preserved)`);
      
      // Get the generation index for context access
      const generationIndex = generationContainer.dataset.index;
      
      // Track progress for sequential rerolling
      let currentIndex = 0;
      let rerollFailed = false;
      
      // Show loading indicator
      generationContainer.style.opacity = '0.6';
      
      // Process rows sequentially to maintain context between them
      function processNextRow() {
        if (currentIndex >= unlockedRows.length || rerollFailed) {
          // All rows processed or an error occurred
          generationContainer.style.opacity = '1';
          
          // Restore collapsed state if needed
          if (wasCollapsed) {
            generationContainer.classList.add('collapsed');
          }
          
          // Update the card title based on the first row's content
          // ONLY if the first row isn't locked
          if (!isFirstRowLocked) {
            updateCardTitleFromFirstRow(generationContainer);
          }
          
          return;
        }
        
        const row = unlockedRows[currentIndex];
        const rerollButton = row.querySelector('.reroll-btn');
        
        if (rerollButton) {
          // Use the existing reroll function to maintain context properly
          try {
            // Set up a one-time event listener to know when this reroll finishes
            const observer = new MutationObserver((mutations, obs) => {
              // Check if the row's opacity has been reset, signaling the reroll is complete
              if (row.style.opacity === '1') {
                obs.disconnect();
                currentIndex++;
                setTimeout(processNextRow, 50); // Small delay between rerolls for stability
              }
            });
            
            observer.observe(row, { 
              attributes: true, 
              attributeFilter: ['style']
            });
            
            // Trigger the reroll
            rerollContent(rerollButton);
          } catch (error) {
            console.error('Error rerolling row:', error);
            rerollFailed = true;
            currentIndex++;
            setTimeout(processNextRow, 50);
          }
        } else {
          // Skip this row if it doesn't have a reroll button
          currentIndex++;
          setTimeout(processNextRow, 50);
        }
      }
      
      // Start the sequential rerolling process
      processNextRow();
    }

    // Helper function to update card title from first row after rerolling
    function updateCardTitleFromFirstRow(generationContainer) {
      const firstRow = generationContainer.querySelector('.result-row:first-child');
      if (!firstRow) return;

    // Improved function to correctly detect root tables even with spaces in names
    function copyToMarkdown(generationContainer) {
      let markdown = '';
      
      // Get the main table information
      let mainTableName = '';
      let mainTableDisplayName = '';
      
      if (currentSelectedTable) {
        // Get table name from filename (without extension) for references
        if (currentSelectedTable.filename) {
          mainTableName = currentSelectedTable.filename.replace(/\.(yaml|yml)$/, '');
        }
        
        // Get the display name from the tablename property
        mainTableDisplayName = currentSelectedTable.tablename || '';
      }
      
      // Extract all the rows
      const rows = generationContainer.querySelectorAll('.result-row');
      
      // Helper function to normalize strings for comparison
      const normalize = str => str.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/gi, '');
      
      // Process each row
      rows.forEach(row => {
        const header = row.querySelector('.result-header').textContent;
        const contentCells = row.querySelectorAll('.result-content');
        
        // Start building the markdown line for this row
        let rowMd = `*${header}*: `;
        
        // Handle career format - detect by format attribute
        const rowFormat = row.getAttribute('data-format');
        
        if (rowFormat === 'career' && contentCells.length >= 2) {
          // Career format - first cell is career, second cell is items
          const career = contentCells[0].textContent.trim();
          const items = contentCells[1].textContent.trim();
          rowMd += `${career} - ${items}`;
        }
        // Handle general array format with multiple cells
        else if (contentCells.length > 1) {
          const cellTexts = Array.from(contentCells).map(cell => cell.textContent.trim());
          // Join all cells with commas
          rowMd += cellTexts.join(', ');
        } 
        else if (contentCells.length === 1) {
          // Normal case - single content cell
          rowMd += contentCells[0].textContent.trim();
        }
        
        // Check if this is a root table reference
        // Compare the normalized header with the normalized tablename
        const normalizedHeader = normalize(header);
        const normalizedTableName = normalize(mainTableDisplayName);
        const isRootTableReference = normalizedHeader === normalizedTableName;
        
        // Add table reference
        if (mainTableName) {
          if (isRootTableReference) {
            // Simplified format for root table references
            rowMd += `.:{${mainTableName}}`;
          } else {
            // Full format for subtable references
            rowMd += `.:{${mainTableName}|${header}}`;
          }
        }
        
        markdown += rowMd + '\n';
      });
      
      // Copy to clipboard
      navigator.clipboard.writeText(markdown)
        .then(() => {
          showToast('Copied to clipboard!');
        })
        .catch(err => {
          console.error('Failed to copy text: ', err);
          showToast('Failed to copy to clipboard');
        });
    }

      // Check if a toast already exists
      let toast = document.querySelector('.toast-message');
      
      // If not, create one
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast-message';
        document.body.appendChild(toast);
      }
      
      // Update the toast message
      toast.textContent = message;
      toast.classList.add('toast-visible');
      
      // Hide the toast after duration
      setTimeout(() => {
        toast.classList.remove('toast-visible');
      }, duration);
    }

    // Improved drag and drop handlers for cards
    function handleCardDragStart(e) {
      // Only allow dragging from the title area, not the buttons
      if (e.target.closest('.reroll-all-btn, .copy-btn, .delete-card-btn')) {
        e.preventDefault();
        return;
      }
      
      // Check if the card is in the saved area and prevent dragging within saved area
      const inSavedArea = this.closest('#savedGenerations');
      if (inSavedArea) {
        e.preventDefault();
        return;
      }
      
      e.dataTransfer.setData('text/plain', this.dataset.index);
      this.classList.add('card-being-dragged');
      
      // Allow the card to be copied to the saved area
      e.dataTransfer.effectAllowed = 'copy';

    function handleCardDragEnd(e) {
      this.classList.remove('card-being-dragged');

    // Add event listeners to the saved cards area
    document.addEventListener('DOMContentLoaded', function() {
      const savedArea = document.getElementById('savedGenerations');
      
      // Update handlers
      savedArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('drop-target-highlight');
        e.dataTransfer.dropEffect = 'copy';
      });
      savedArea.addEventListener('dragleave', function(e) {
        this.classList.remove('drop-target-highlight');
      });
      
      savedArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('drop-target-highlight');
        const cardIndex = e.dataTransfer.getData('text/plain');
        const originalCard = document.querySelector(`.generation-container[data-index="${cardIndex}"]`);
        
        if (!originalCard) return;
        
        // Check if this card already exists in the saved area by comparing content
        const cardTitle = originalCard.querySelector('.card-title-text').textContent;
        
        // Get all headers and contents from the original card to create a unique signature
        const originalHeaders = Array.from(originalCard.querySelectorAll('.result-header')).map(h => h.textContent);
        const originalContents = Array.from(originalCard.querySelectorAll('.result-content')).map(c => c.textContent);
        const cardSignature = JSON.stringify({ title: cardTitle, headers: originalHeaders, contents: originalContents });
        
        // Check if a card with the same signature already exists
        let isDuplicate = false;
        const savedCards = savedArea.querySelectorAll('.generation-container');
        savedCards.forEach(savedCard => {
          const savedHeaders = Array.from(savedCard.querySelectorAll('.result-header')).map(h => h.textContent);
          const savedContents = Array.from(savedCard.querySelectorAll('.result-content')).map(c => c.textContent);
          const savedSignature = JSON.stringify({ 
            title: savedCard.querySelector('.card-title-text').textContent, 
            headers: savedHeaders, 
            contents: savedContents });
          
          if (savedSignature === cardSignature) {
            isDuplicate = true;
          }
        });
        
        if (isDuplicate) {
          showToast('Card already exists in Saved Cards');
          return;
        }
        
        // Clone the card and add to saved area
        const cardClone = originalCard.cloneNode(true);
        const newIndex = `saved-${Date.now()}`;
        cardClone.dataset.index = newIndex;
        
        // Reattach event handlers for all buttons in the cloned card
        cardClone.querySelector('.copy-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToMarkdown(cardClone);
        });
        
        cardClone.querySelector('.reroll-all-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          rerollAllContent(cardClone);
        });
        
        cardClone.querySelector('.delete-card-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteCard(cardClone);
        });
        
        // Make the clone draggable too, but it won't actually be draggable due to our check in handleCardDragStart
        cardClone.addEventListener('dragstart', handleCardDragStart);
        cardClone.addEventListener('dragend', handleCardDragEnd);
        
        // Update collapse button handlers
        cardClone.querySelector('.collapse-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCardCollapse(e.currentTarget);
        });
        
        // Add the card to the saved area
        this.appendChild(cardClone);
        
        // Show confirmation
        showToast('Card saved!');
      });
      
      // Initialize expand buttons with proper text
      document.querySelectorAll('.expand-btn').forEach(btn => {
        btn.textContent = '▼ Show More';
      });
      
      // Check initial overflow for all filter containers
      ['gameFilter', 'typeFilter', 'settingFilter'].forEach(filterId => {
        checkFilterOverflow(filterId);
      });
    });

            if (wouldTablePassFilters(table, testGameFilters, currentTypeFilters, currentSettingFilters)) {
              availableGames.add(table.game);
            }
          }
        } else {
          // In all-selected mode, all games that would pass other filters are available
          if (wouldTablePassFilters(table, [], currentTypeFilters, currentSettingFilters)) {
            if (table.game) availableGames.add(table.game);
          }

        if (typeFilterMode === 'choice') {

                if (wouldTablePassFilters(table, currentGameFilters, testTypeFilters, currentSettingFilters)) {
                  availableTypes.add(t);
                }
              }
            });
          } else if (table.type && !currentTypeFilters.includes(table.type)) {
            // Would adding this type to the current selection produce results?
            const testTypeFilters = [...currentTypeFilters, table.type];
            
            if (wouldTablePassFilters(table, currentGameFilters, testTypeFilters, currentSettingFilters)) {
              availableTypes.add(table.type);
            }
          }
        } else {
          // In all-selected mode, all types that would pass other filters are available
          if (wouldTablePassFilters(table, currentGameFilters, [], currentSettingFilters)) {
            if (Array.isArray(table.type)) {
              table.type.forEach(t => {
                if (t) availableTypes.add(t);
              });
            } else if (table.type) {
              availableTypes.add(table.type);
            }
          }
        }
        
        // Test each potential Setting option
        if (settingFilterMode === 'choice') {
          if (table.setting && !currentSettingFilters.includes(table.setting)) {
            // Would adding this setting to the current selection produce results?
            const testSettingFilters = [...currentSettingFilters, table.setting];
            
            if (wouldTablePassFilters(table, currentGameFilters, currentTypeFilters, testSettingFilters)) {
              availableSettings.add(table.setting);
            }
          }
        } else {
          // In all-selected mode, all settings that would pass other filters are available
          if (wouldTablePassFilters(table, currentGameFilters, currentTypeFilters, [])) {
            if (table.setting) availableSettings.add(table.setting);
          }
        }
      });
      
      // For buttons in each category that are already selected, always mark them as available
      selectedGames.forEach(game => availableGames.add(game));
      selectedTypes.forEach(type => availableTypes.add(type));
      selectedSettings.forEach(setting => availableSettings.add(setting));
      
      // Next, in choice mode, we should keep options within the same category available for additional selection
      if (gameFilterMode === 'choice') {
        allGames.forEach(game => {
          // We never disable items in their own category in choice mode
          // If at least one item is selected, this option should be selectable too
          if (selectedGames.length > 0) {
            availableGames.add(game);
          }
        });
      }
      
      if (typeFilterMode === 'choice') {
        allTypes.forEach(type => {
          if (selectedTypes.length > 0) {
            availableTypes.add(type);
          }
        });
      }
            
      if (settingFilterMode === 'choice') {
        allSettings.forEach(setting => {
          if (selectedSettings.length > 0) {
            availableSettings.add(setting);
          }
        });
      }
      
      // Update UI for each filter
      updateFilterUI(gameFilter, availableGames, selectedGames, allGames);
      updateFilterUI(typeFilter, availableTypes, selectedTypes, allTypes);
      updateFilterUI(settingFilter, availableSettings, selectedSettings, allSettings);
    }

    // New helper function to determine if a table would pass the given filters
    function wouldTablePassFilters(table, gameFilters, typeFilters, settingFilters) {
      // Filter by game
      const passesGame = gameFilters.length === 0 || 
                        (table.game && gameFilters.includes(table.game));
      
      // Handle type filter when type is an array
      let passesType = false;
      if (typeFilters.length === 0) {
        passesType = true;
      } else if (Array.isArray(table.type)) {
        // Check if any type in the array matches any selected type filter
        passesType = table.type.some(t => typeFilters.includes(t));
      } else {
        // Handle single type as before
        passesType = table.type && typeFilters.includes(table.type);
      }
      
      // Filter by setting
      const passesSetting = settingFilters.length === 0 || 
                           (table.setting && settingFilters.includes(table.setting));
      
      return passesGame && passesType && passesSetting;
    }

    // Updated helper function to update filter UI
    function updateFilterUI(filterContainer, availableOptions, selectedOptions, allOptions) {
      const mode = filterContainer.dataset.mode;
      const buttons = filterContainer.querySelectorAll('.filter-btn');
      
      buttons.forEach(button => {
        const value = button.dataset.value;
        const isAvailable = availableOptions.has(value);
        const isSelected = selectedOptions.includes(value);
        
        // Reset all button states first
        button.classList.remove('selected', 'unselected', 'unavailable');
        button.disabled = false;
        
        if (mode === 'all-selected') {
          // In all-selected mode (no explicit filters in this category)
          if (!isAvailable) {
            // Option not available with current filters
            button.classList.add('unavailable');
            button.disabled = true;
          }
          // Otherwise leave in default state (no classes)
        } 
        else {
          // In choice mode (specific filters selected in this category)
          if (isSelected) {
            // This option is selected
            button.classList.add('selected');
          } else {
            // This option is not selected
            button.classList.add('unselected');
            
            // If it's also not available, mark as unavailable
            if (!isAvailable) {
              button.classList.add('unavailable');
              button.disabled = true;
            }
          }
        }
      });
    }
