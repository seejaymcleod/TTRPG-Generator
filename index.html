<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        #leftColumn {
            width: 25%;
            border-right: 2px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
        }

        #mainContent {
            width: 75%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #results {
            margin-top: 20px;
            white-space: pre-wrap; /* Preserve spacing and newlines */
        }

        .header {
            font-weight: bold;
            margin-top: 10px;
            text-align: left;
        }

        .generation-container {
            margin-bottom: 20px; /* Space between each generation */
        }

        .generation-title {
            font-weight: bold;
            margin-top: 20px;
        }

        .slider-container {
            margin-top: 20px;
        }

        #tableHeaders {
            margin-bottom: 20px;
        }

        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

            .dark-mode #leftColumn {
                border-right: 2px solid #444;
            }
    </style>
</head>
<body>
    <div id="leftColumn">
        <h1>TTRPG Generator</h1>
        <label for="tableSelect">Choose a Table:</label>
        <select id="tableSelect" style="width: 100%;">
            <!-- Options will be dynamically populated here -->
        </select>
        <button id="toggleDarkMode" style="margin-top: 20px;">Toggle Dark Mode</button>
    </div>
    <div id="mainContent">
        <div id="tableHeaders">
            <!-- Table name and details will be displayed here -->
        </div>
        <div id="generationControls" class="slider-container" style="display: none;">
            <label for="generationSlider">Number of Generations: <span id="generationValue">1</span></label><br>
            <input type="range" id="generationSlider" min="1" max="20" value="1">
            <button id="generateBtn" style="margin-top: 10px;">Generate</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        async function fetchTables() {
            try {
                const response = await fetch('/api/tables');
                const data = await response.json();
                const tableSelect = document.getElementById('tableSelect');

                // Clear previous options and add a default one
                tableSelect.innerHTML = '<option value="" disabled selected>Select a table...</option>';

                data.forEach(table => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify(table);
                    option.text = table.tablename;
                    tableSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching tables:', error);
            }
        }

        document.getElementById('tableSelect').addEventListener('change', (event) => {
            const selectedTable = JSON.parse(event.target.value);
            displayTableHeaders(selectedTable);
            document.getElementById('generationControls').style.display = 'block';
            document.getElementById('generationSlider').value = 1;
            document.getElementById('generationValue').textContent = 1;
        });

        function displayTableHeaders(table) {
            const tableHeadersContainer = document.getElementById('tableHeaders');
            tableHeadersContainer.innerHTML = ''; // Clear previous headers

            // Set the table name as the section title
            const tableNameTitle = document.createElement('h2');
            tableNameTitle.textContent = table.tablename;
            tableHeadersContainer.appendChild(tableNameTitle);

            // Display relevant table details
            const details = [
                { key: 'filename', label: 'File Name' },
                { key: 'game', label: 'Game' },
                { key: 'genre', label: 'Genre' },
                { key: 'type', label: 'Type' },
                { key: 'subtype', label: 'Subtype' }
            ];

            details.forEach(detail => {
                if (table[detail.key]) {
                    const detailDiv = document.createElement('div');
                    detailDiv.className = 'header';
                    detailDiv.textContent = `${detail.label}: ${table[detail.key]}`;
                    tableHeadersContainer.appendChild(detailDiv);
                }
            });
        }

        // Update the label when the slider changes
        document.getElementById('generationSlider').addEventListener('input', (event) => {
            const generationValue = event.target.value;
            document.getElementById('generationValue').textContent = generationValue;
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const tableSelect = document.getElementById('tableSelect');
            const selectedTable = tableSelect.value;
            if (!selectedTable) {
                alert("Please select a table first.");
                return;
            }

            const tableData = JSON.parse(selectedTable);
            const numberOfGenerations = parseInt(document.getElementById('generationSlider').value, 10);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table: tableData, number: numberOfGenerations })
                });
                const data = await response.json();
                displayResults(data.results);
            } catch (error) {
                console.error('Error generating adventure:', error);
            }
        });

        function displayResults(results) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = ''; // Clear previous results

            results.forEach((result, index) => {
                // Create a container for each generation
                const generationContainer = document.createElement('div');
                generationContainer.className = 'generation-container';

                // Add the generation number and result on the same line
                const generationTitle = document.createElement('div');
                generationTitle.className = 'generation-title';
                generationTitle.textContent = `(${index + 1}) `;

                if (typeof result === 'string') {
                    generationTitle.textContent += result;
                } else if (typeof result === 'object') {
                    // If there are nested headers, format them properly
                    generationTitle.textContent += `${result.header}: ${result.result}`;
                }

                generationContainer.appendChild(generationTitle);

                // Append the generation container to the results container
                resultsContainer.appendChild(generationContainer);
            });
        }

        // Toggle dark mode
        document.getElementById('toggleDarkMode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Fetch tables on page load
        fetchTables();
    </script>
</body>
</html>
