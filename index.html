<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Table Generator</title>
</head>
<body>
    <h1>RPG Table Generator</h1>
    <div>
        <label for="tableSelect">Choose a table:</label>
        <select id="tableSelect"></select>
        <input type="number" id="numberToGenerate" placeholder="Number to generate" min="1" value="1">
        <button id="generateButton">Generate</button>
    </div>
    <div id="results"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('/api/tables')
                .then(response => response.json())
                .then(tables => {
                    const tableSelect = document.getElementById('tableSelect');
                    tables.forEach(table => {
                        const option = document.createElement('option');
                        option.value = JSON.stringify(table);
                        option.textContent = table.tablename;
                        tableSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error fetching tables:', error));
        });

        document.getElementById('generateButton').addEventListener('click', function () {
            const tableSelect = document.getElementById('tableSelect');
            const selectedTable = JSON.parse(tableSelect.value);
            const numberToGenerate = parseInt(document.getElementById('numberToGenerate').value);

            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ table: selectedTable, number: numberToGenerate })
            })
                .then(response => response.json())
                .then(data => {
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = ''; // Clear previous results
                    data.results.forEach(result => {
                        const pre = document.createElement('pre');
                        pre.textContent = result;
                        resultsDiv.appendChild(pre);

                    });
                })
                .catch(error => {
                    console.error('Error generating data:', error);
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = '<p style="color: red;">Error generating data. Please try again.</p>';
                });

        });
    </script>
</body>
</html>
