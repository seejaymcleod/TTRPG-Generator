    // Check if the entire filter bar has significant overflow (3+ rows)
    function checkFilterBarOverflow() {
      const filterContainers = ['gameFilter', 'typeFilter', 'settingFilter'];
      let totalHeight = 0;
      let maxButtonHeight = 0;
      
      // Calculate total height of all buttons if not wrapped
      filterContainers.forEach(filterId => {
        const container = document.getElementById(filterId);
        const buttons = container.querySelectorAll('.filter-btn');
        
        // Find the height of the tallest button
        buttons.forEach(button => {
          const buttonHeight = button.offsetHeight;
          if (buttonHeight > maxButtonHeight) {
            maxButtonHeight = buttonHeight;
          }
        });
        
        // Calculate unwrapped width
        let rowWidth = 0;
        const containerWidth = container.clientWidth;
        const buttonGap = 4; // Gap between buttons
        let rowCount = 1;
        
        buttons.forEach(button => {
          const buttonWidth = button.offsetWidth + buttonGap;
          
          // If this button would overflow the current row, start a new row
          if (rowWidth + buttonWidth > containerWidth && rowWidth > 0) {
            rowCount++;
            rowWidth = buttonWidth;
          } else {
            rowWidth += buttonWidth;
          }
        });
        
        // Store row count as data attribute
        container.dataset.rowCount = rowCount;
          
        // If rows > 2, mark as has-overflow
        if (rowCount > 2) {
          container.classList.add('has-overflow');
        } else {
          container.classList.remove('has-overflow');
        }
      });
      
      // Calculate if any container needs 3+ rows
      const hasSignificantOverflow = filterContainers.some(filterId => {
        const container = document.getElementById(filterId);
        return parseInt(container.dataset.rowCount || '0') >= 3;
      });
            
      // Update the container class
      const filtersContainer = document.getElementById('filtersContainer');
      if (hasSignificantOverflow) {
        filtersContainer.classList.add('has-significant-overflow');
      } else {
        filtersContainer.classList.remove('has-significant-overflow');
        filtersContainer.classList.remove('filters-expanded');
      }
       
      // Update the expand button text
      const expandBtn = document.getElementById('filterExpandBtn');
      expandBtn.innerHTML = filtersContainer.classList.contains('filters-expanded') ? '▲' : '▼';
    }

    // Toggle all filters expansion state
    function toggleAllFilters() {
      const filtersContainer = document.getElementById('filtersContainer');
      filtersContainer.classList.toggle('filters-expanded');
      
      // Update button text
      const expandBtn = document.getElementById('filterExpandBtn');
      expandBtn.innerHTML = filtersContainer.classList.contains('filters-expanded') ? '▲' : '▼';
    }

    // Replace the createFilterButtons function
    function createFilterButtons(filterId, options) {
      const filterContainer = document.getElementById(filterId);
      filterContainer.innerHTML = '';
      
      options.sort().forEach(option => {
        const button = document.createElement('button');
        button.className = 'filter-btn';
        button.textContent = option;
        button.dataset.value = option;
        button.onclick = function() {
          toggleFilterButton(this, filterId);
        };
        filterContainer.appendChild(button);
      });
      
      // After adding all buttons, check filter overflow
      setTimeout(() => {
        checkFilterBarOverflow();
      }, 0);
    }

    // Add this to the document ready event
    document.addEventListener('DOMContentLoaded', function() {
      // ... existing code ...
      
      // Check filter overflow on window resize
      window.addEventListener('resize', debounce(() => {
        checkFilterBarOverflow();
      }, 250));
    });

    // Debounce function to limit how often a function runs
    function debounce(func, wait) {
      let timeout;
      return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
      };
    }

    // Replace with the original renderResultItem function (without array parsing)
    function renderResultItem(item, isTopLevel = true, generationIndex = 0, isNestedContent = false) {
      // Add support for table-level descriptions and title descriptions
      let descriptionHTML = '';
      let titleDescriptionHTML = '';
      
      if (isTopLevel) {
        // Add title description if present
        if (item && item._titleDescription) {
          titleDescriptionHTML = `<div class="title-description">${item._titleDescription}</div>`;
        }
        
        // Standard description
        if (item && item._description) {
          descriptionHTML = `<div class="table-description">${item._description}</div>`;
        }
      }
      
      // Special handling for career format flagged by the server
      if (item && typeof item === 'object' && item._isCareer === true && Array.isArray(item.result)) {
        const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
        // Store both tableName and originalSource - originalSource takes priority
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        // Include the subtable name if different from table name
        const isSubtable = item._tableName && item.header && item._tableName !== item.header;
        const subtableName = isSubtable ? ` data-subtable-name="${item.header}"` : '';
        
        // Get the career and items values
        const career = item.result[0] || '';
        const items = item.result[1] || '';
        
        // Escape values for HTML attributes
        const careerEscaped = career.replace(/"/g, '&quot;');
        const itemsEscaped = items.replace(/"/g, '&quot;');
        
        // Create a single row with both elements
        const buttonGroup = !isNestedContent ? `
          <div class="button-group">
            <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
              <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
            </button>
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>
          </div>` : '';
        
        // Add row description if present
        const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';
        
        return `
          ${isTopLevel ? titleDescriptionHTML : ''}
          ${isTopLevel ? descriptionHTML : ''}
          <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="career">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            <div class="result-content" title="${careerEscaped}">${career}</div>
            <div class="result-content" title="${itemsEscaped}">${items}</div>
            ${buttonGroup}
          </div>
          ${rowDescription}
        `;
      }
      
      // New case: Handle multi-element array format flagged by the server
      if (item && typeof item === 'object' && item._isMultiElementArray === true && Array.isArray(item.result)) {
        const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
        // Store both tableName and originalSource - originalSource takes priority
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';
        
        // Create content cells for each element in the array (max 4 elements)
        const contentCells = item.result.map(element => {
          const valueStr = String(element || '');
          const escapedValue = valueStr.replace(/"/g, '&quot;');
          return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
        }).join('');
        
        const buttonGroup = !isNestedContent ? `
          <div class="button-group">
            <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
              <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
            </button>
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>
          </div>` : '';
        
        // Add row description if present
        const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';
        
        return `
          ${isTopLevel ? titleDescriptionHTML : ''}
          ${isTopLevel ? descriptionHTML : ''}
          <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="multi-array">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            ${contentCells}
            ${buttonGroup}
          </div>
          ${rowDescription}
        `;
      }

      // Handle arrays with better weight detection
      if (Array.isArray(item.result)) {
        // Check if the last element is numeric (a weight)
        const lastIndex = item.result.length - 1;
        const lastElement = item.result[lastIndex];
        const isLastElementNumeric = 
          typeof lastElement === 'number' || 
          (typeof lastElement === 'string' && !isNaN(parseFloat(lastElement)) && 
           lastElement.trim() !== '' && !isNaN(lastElement));
        
        // If this is a weighted array, show only the value elements (exclude weight)
        if (isLastElementNumeric && item.result.length >= 2) {
          const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
          const sourceTable = item._tableName ? ` data-source-table="${item._tableName}"` : '';
          
          // Display each value element (excluding the weight)
          const contentCells = item.result.slice(0, lastIndex).map(element => {
            const valueStr = String(element || '');
            const escapedValue = valueStr.replace(/"/g, '&quot;');
            return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
          }).join('');
          
          const buttonGroup = !isNestedContent ? `
            <div class="button-group">
              <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
                <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
              </button>
              <button class="reroll-btn" onclick="rerollContent(this)">
                <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
              </button>
            </div>` : '';
          
          // Add row description if present
          const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';
          
          return `
            ${isTopLevel ? titleDescriptionHTML : ''}
            ${isTopLevel ? descriptionHTML : ''}
            <div class="result-row"${sourceTable} data-format="weighted">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              ${contentCells}
              ${buttonGroup}
            </div>
            ${rowDescription}
          `;
        }
      }

      // Standard single value
      if (item && typeof item === 'object' && "header" in item && "result" in item) {
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';
        const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
        
        // Handle different result types, starting with standard string/number
        if (typeof item.result === 'string' || typeof item.result === 'number') {
          const resultStr = String(item.result);
          const escapedResult = resultStr.replace(/"/g, '&quot;');
          
          const buttonGroup = !isNestedContent ? `
            <div class="button-group">
              <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
                <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
              </button>
              <button class="reroll-btn" onclick="rerollContent(this)">
                <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
              </button>
            </div>` : '';
          
          // Add row description if present
          const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';
          
          return `
            ${isTopLevel ? titleDescriptionHTML : ''}
            ${isTopLevel ? descriptionHTML : ''}
            <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="simple">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              <div class="result-content" title="${escapedResult}">${resultStr}</div>
              ${buttonGroup}
            </div>
            ${rowDescription}
          `;
        }
        
        // For arrays of objects (nested results)
        if (Array.isArray(item.result) && 
            item.result.some(el => typeof el === 'object' && el !== null)) {
            
          // Add the parent description if we're at the top level
          let output = isTopLevel ? titleDescriptionHTML + descriptionHTML : '';
          
          // Process each nested result item
          item.result.forEach(subItem => {
            output += renderResultItem(subItem, false, generationIndex);
          });
          
          return output;
        }
      }
      
      // For primitive values and fallback
      return item !== undefined && item !== null ? String(item) : '';
    }
    
    // Add this after your other functions
    function toggleRowLock(button) {
      const row = button.closest('.result-row');
      if (!row) return;
      
      row.classList.toggle('locked');
      
      // Update the lock icon
      const lockImage = button.querySelector('img');
      if (row.classList.contains('locked')) {
        lockImage.src = './Images/Icons/padlock.png';
        lockImage.alt = 'Locked';
        lockImage.title = 'Unlock this result';
      } else {
        lockImage.src = './Images/Icons/padlock-open.png';
        lockImage.alt = 'Unlocked';
        lockImage.title = 'Lock this result';
      }
    }
  </script>
