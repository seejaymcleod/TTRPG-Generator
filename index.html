                const entryWeight = document.createElement('div');
                entryWeight.className = 'entry-weight';
                entryWeight.textContent = `Weight: ${entry.weight}`;
                entryDiv.appendChild(entryWeight);
              } 
              else if (entry.isCareer) {
                // It's a career entry format
                const careerEntry = document.createElement('div');
                careerEntry.className = 'career-entry';
                
                const careerName = document.createElement('span');
                careerName.className = 'career-name';
                careerName.textContent = entry.career;
                careerEntry.appendChild(careerName);
                
                const careerItems = document.createElement('span');
                careerItems.className = 'career-items';
                careerItems.textContent = entry.items;
                careerEntry.appendChild(careerItems);
                
                entryContent.appendChild(careerEntry);
              }
              else if (typeof entry.value !== 'undefined') {
                // It's a simple value
                if (typeof entry.value === 'object') {
                  entryContent.textContent = JSON.stringify(entry.value);
                } else {
                  entryContent.textContent = entry.value;
                }
              }
              else {
                // It's a generic object
                entryContent.textContent = JSON.stringify(entry);
              }
              
              entryDiv.appendChild(entryContent);
              subtableContainer.appendChild(entryDiv);
            });
          } else {
            const noResults = document.createElement('div');
            noResults.className = 'table-entry';
            noResults.textContent = '(No results found)';
            subtableContainer.appendChild(noResults);
          }
          
          // Add nested subtables if present
          if (subtable.nestedSubtables && subtable.nestedSubtables.length > 0) {
            const nestedContainer = document.createElement('div');
            nestedContainer.className = 'nested-subtables';
            
            subtable.nestedSubtables.forEach(nestedTable => {
              const nestedHeader = document.createElement('div');
              nestedHeader.className = 'subtable-header';
              nestedHeader.textContent = `${nestedTable.name} (nested)`;
              nestedContainer.appendChild(nestedHeader);
              
              if (nestedTable.results && nestedTable.results.length > 0) {
                nestedTable.results.forEach((entry, index) => {
                  const entryDiv = document.createElement('div');
                  entryDiv.className = 'table-entry';
                  
                  // Add entry number
                  const entryNumber = document.createElement('div');
                  entryNumber.className = 'entry-number';
                  entryNumber.textContent = `${index + 1}.`;
                  entryDiv.appendChild(entryNumber);
                  
                  // Add content
                  const entryContent = document.createElement('div');
                  entryContent.className = 'entry-content';
                  
                  if (typeof entry.value !== 'undefined') {
                    entryContent.textContent = entry.value;
                  } else {
                    entryContent.textContent = JSON.stringify(entry);
                  }
                  
                  entryDiv.appendChild(entryContent);
                  nestedContainer.appendChild(entryDiv);
                });
              }
            });
            
            subtableContainer.appendChild(nestedContainer);
          }
          
          contentWrapper.appendChild(subtableContainer);
        });
        
        tableContainer.appendChild(contentWrapper);
        resultsContainer.appendChild(tableContainer);
      })
      .catch(error => {
        resultsContainer.innerHTML = '';
        const errorDiv = document.createElement('div');
        errorDiv.className = 'generation-object error';
        errorDiv.textContent = `Error: ${error.message}`;
        resultsContainer.appendChild(errorDiv);
      });
    }
    
    // Add function to copy table contents to markdown
    function copyTableToMarkdown(tableContainer, tableData) {
      if (!tableData) {
        // Fallback to old method if tableData isn't passed
        const title = tableContainer.querySelector('.card-title-text').textContent;
        const sourceInfo = currentSelectedTable ? `${currentSelectedTable.filename}: ${currentSelectedTable.tablename}` : '';
        
        let markdown = `# ${title}\n`;
        if (sourceInfo) {
          markdown += `*Source: ${sourceInfo}*\n`;
        }
        markdown += '\n';
        
        // Get all table entries
        const entries = tableContainer.querySelectorAll('.table-entry');
        entries.forEach(entry => {
          markdown += `- ${entry.textContent}\n`;
        });
        
        copyToClipboardWithToast(markdown);
        return;
      }
      
      // Enhanced method with structured data
      const title = tableData.name;
      const sourceInfo = `${tableData.filename}: ${tableData.game} (${tableData.type})`;
      
      let markdown = `# ${title}\n`;
      markdown += `*Source: ${sourceInfo}*\n\n`;
      
      // Process each subtable
      tableData.subtables.forEach(subtable => {
        markdown += `## ${subtable.name}\n\n`;
        
        if (subtable.customDisplay) {
          markdown += `*Custom Display: \`${subtable.customDisplay}\`*\n\n`;
        }
        
        if (subtable.results && subtable.results.length > 0) {
          subtable.results.forEach((entry, index) => {
            let entryText = '';
            
            if (entry.isWeighted) {
              const valueText = typeof entry.value === 'object' ? JSON.stringify(entry.value) : entry.value;
              entryText = `${valueText} *(Weight: ${entry.weight})*`;
            } else if (entry.isCareer) {
              entryText = `**${entry.career}** - ${entry.items}`;
            } else if (typeof entry.value !== 'undefined') {
              entryText = typeof entry.value === 'object' ? JSON.stringify(entry.value) : entry.value;
            } else {
              entryText = JSON.stringify(entry);
            }
            
            markdown += `${index + 1}. ${entryText}\n`;
          });
          markdown += '\n';
        }
        
        // Handle nested subtables
        if (subtable.nestedSubtables && subtable.nestedSubtables.length > 0) {
          subtable.nestedSubtables.forEach(nestedTable => {
            markdown += `### ${nestedTable.name} (nested)\n\n`;
            
            if (nestedTable.results && nestedTable.results.length > 0) {
              nestedTable.results.forEach((entry, index) => {
                const entryText = typeof entry.value !== 'undefined' ? 
                    entry.value : JSON.stringify(entry);
                markdown += `${index + 1}. ${entryText}\n`;
              });
              markdown += '\n';
            }
          });
        }
      });
      
      copyToClipboardWithToast(markdown);
    }
    
    function copyToClipboardWithToast(text) {
      navigator.clipboard.writeText(text)
        .then(() => {
          showToast('Copied to clipboard!');
        })
        .catch(err => {
          console.error('Failed to copy text: ', err);
          showToast('Failed to copy to clipboard');
        });
    }
  </script>
