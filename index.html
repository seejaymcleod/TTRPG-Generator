            <div class="result-header" title="${headerTitle}">${item.header}</div>
            ${contentCells}
            ${rerollButton}
          </div>
        `;
      }
      
      // Handle arrays with better weight detection
      if (Array.isArray(item.result)) {
        // Check if the last element is numeric (a weight)
        const lastIndex = item.result.length - 1;
        const lastElement = item.result[lastIndex];
        const isLastElementNumeric = 
          typeof lastElement === 'number' || 
          (typeof lastElement === 'string' && !isNaN(parseFloat(lastElement)) && 
           lastElement.trim() !== '' && !isNaN(lastElement));
        
        // If this is a weighted array, show only the value elements (exclude weight)
        if (isLastElementNumeric && item.result.length >= 2) {
          const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
          const sourceTable = item._tableName ? ` data-source-table="${item._tableName}"` : '';
          
          // Display each value element (excluding the weight)
          const contentCells = item.result.slice(0, lastIndex).map(element => {
            const valueStr = String(element || '');
            const escapedValue = valueStr.replace(/"/g, '&quot;');
            return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
          }).join('');
          
          const rerollButton = !isNestedContent ? `
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>` : '';
          
          return `
            <div class="result-row"${sourceTable} data-format="weighted">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              ${contentCells}
              ${rerollButton}
            </div>
          `;
        }
      }

      // Continue with existing logic for other cases
      // Special handling for career format flagged by the server
      if (item && typeof item === 'object' && item._isCareer === true && Array.isArray(item.result)) {
        const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
        const sourceTable = item._tableName ? ` data-source-table="${item._tableName}"` : '';
        
        // Get the career and items values
        const career = item.result[0] || '';
        const items = item.result[1] || '';
        
        // Escape values for HTML attributes
        const careerEscaped = career.replace(/"/g, '&quot;');
        const itemsEscaped = items.replace(/"/g, '&quot;');
        
        // Create a single row with both elements
        const rerollButton = !isNestedContent ? `
          <button class="reroll-btn" onclick="rerollContent(this)">
            <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
          </button>` : '';
        
        return `
          <div class="result-row"${sourceTable} data-format="career">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            <div class="result-content" title="${careerEscaped}">${career}</div>
            <div class="result-content" title="${itemsEscaped}">${items}</div>
            ${rerollButton}
          </div>
        `;
      }
      
      // Handle arrays with proper detection
      if (Array.isArray(item)) {
        // Case for arrays of simple values where each element is not an object
        if (item.every(el => typeof el !== 'object' || el === null)) {
          const contentCells = item.map(element => {
            const valueStr = String(element);
            const escapedValue = valueStr.replace(/"/g, '&quot;');
            return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
          }).join('');
          
          // Only add reroll button at top level, not in nested content
          const rerollButton = !isNestedContent ? `
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>` : '';
          
          return `
            <div class="result-row" data-format="array">
              <div class="result-header" title="Array Result">Array Result</div>
              ${contentCells}
              ${rerollButton}
            </div>
          `;
        }
        
        // For arrays of complex objects
        return item.map(i => renderResultItem(i, isTopLevel, generationIndex)).join("");
      }
      
      // Handle objects with header and result properties
      if (item && typeof item === 'object' && "header" in item && "result" in item) {
        const sourceTable = item._tableName ? ` data-source-table="${item._tableName}"` : '';
        const headerTitle = item.header ? item.header.replace(/"/g, '&quot;') : '';
        
        // Special case for Knave Careers or similar two-element string arrays
        if (Array.isArray(item.result) && 
            item.result.length === 2 && 
            typeof item.result[0] === 'string' && 
            typeof item.result[1] === 'string') {
          
          const career = item.result[0].replace(/"/g, '&quot;');
          const items = item.result[1].replace(/"/g, '&quot;');
          
          const rerollButton = !isNestedContent ? `
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>` : '';
          
          return `
            <div class="result-row"${sourceTable} data-format="career">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              <div class="result-content" title="${career}">${item.result[0]}</div>
              <div class="result-content" title="${items}">${item.result[1]}</div>
              ${rerollButton}
            </div>
          `;
        }
        
        // Viridian Dice style - array of simple strings
        if (Array.isArray(item.result) && 
            item.result.every(el => typeof el === 'string' || typeof el === 'number')) {
          
          const contentCells = item.result.map(element => {
            const valueStr = String(element);
            const escapedValue = valueStr.replace(/"/g, '&quot;');
            return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
          }).join('');
          
          const rerollButton = !isNestedContent ? `
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>` : '';
          
          return `
            <div class="result-row"${sourceTable} data-format="string-array">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              ${contentCells}
              ${rerollButton}
            </div>
          `;
        }
        
        // Complex nested objects - handle deeper structures
        if (Array.isArray(item.result) && 
            item.result.some(el => typeof el === 'object' && el !== null)) {
          // ShadowDark-style nested tables
          return item.result.map(subItem => renderResultItem(subItem, false, generationIndex)).join("");
        }
        
        // Standard single value
        const resultStr = typeof item.result === 'string' || typeof item.result === 'number' ? 
                        String(item.result) : JSON.stringify(item.result);
        const escapedResult = resultStr.replace(/"/g, '&quot;');
        
        const rerollButton = !isNestedContent ? `
          <button class="reroll-btn" onclick="rerollContent(this)">
            <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
          </button>` : '';
        
        return `
          <div class="result-row"${sourceTable} data-format="simple">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            <div class="result-content" title="${escapedResult}">${resultStr}</div>
            ${rerollButton}
          </div>
        `;
      }
      
      // Handle generic objects
      if (item && typeof item === 'object' && item !== null && !Array.isArray(item)) {
        const formattedResult = Object.entries(item)
          .filter(([key]) => !key.startsWith('_'))
          .map(([key, value]) => `${key}: ${typeof value === 'object' ? JSON.stringify(value) : value}`)
          .join(', ');
        
        if (isNestedContent) {
          return formattedResult;
        } else {
          return `
            <div class="result-row" data-format="object">
              <div class="result-header">Object</div>
              <div class="result-content" title="${formattedResult.replace(/"/g, '&quot;')}">${formattedResult}</div>
            </div>
          `;
        }
      }
      
      // For primitive values
      return item !== undefined && item !== null ? String(item) : '';
    }

    // Add the missing extractContext function that is being called but wasn't defined
    function extractContext(item, context) {
      if (!item || typeof item !== 'object') return;

      // If item has a header and result
      if ("header" in item && "result" in item) {
        // Store result for tables that would be used as context
        // We're particularly interested in tables like "Ancestry"
        if (item.header) {
          context[item.header] = item.result;
          console.log(`Stored context: ${item.header} = ${JSON.stringify(item.result)}`);
        }
        // Recursively check result for nested objects
        if (Array.isArray(item.result)) {
          item.result.forEach(subItem => extractContext(subItem, context));
        } else if (typeof item.result === 'object' && item.result !== null) {
          extractContext(item.result, context);
        }
      }
      // If array, check each item
      else if (Array.isArray(item)) {
        item.forEach(subItem => extractContext(subItem, context));
      }
    }

    // Function to display the table contents
    function showTableContent() {
      // Use the same table selection logic as generateContent
      const tableHeader = document.querySelector('#tableHeaders h2');
      
      if (!tableHeader) {
        console.error('No table header found');
        displayErrorMessage('Error: No table selected.');
        return;
      }
      
      const selectedTableName = tableHeader.textContent;
      const selectedFileName = tableHeader.dataset.filename;
      const selectedGameName = tableHeader.dataset.game;
      
      console.log('Looking for table with:', {
        tablename: selectedTableName,
        filename: selectedFileName,
        game: selectedGameName  
      });
      
      const selectedTable = tablesData.find(t => {
        // First try exact filename match
        if (selectedFileName && t.filename === selectedFileName) {
          return true;
        }
        // Then try name + game
        if (t.tablename === selectedTableName && t.game === selectedGameName) {
          return true;
        }
        return false;
      });
      
      if (!selectedTable) {
        console.error(`No table found for "${selectedTableName}"`);
        displayErrorMessage(`Error: Table "${selectedTableName}" not found.`);
        return;
      }
      
      console.log('Selected table for showing contents:', {
        tablename: selectedTable.tablename,
        filename: selectedTable.filename,
        game: selectedTable.game
      });

      currentSelectedTable = selectedTable;

      // Show loading indicator
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'generation-object';
      loadingDiv.textContent = 'Loading table contents...';
      resultsContainer.appendChild(loadingDiv);

      fetch('/api/table-contents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: selectedTable })
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(err => {
            throw new Error(err.error || 'Failed to retrieve table contents');
          });
        }
        return response.json();
      })
      .then(data => {
        resultsContainer.innerHTML = '';
        if (!data.tableData || !data.tableData.subtables || data.tableData.subtables.length === 0) {
          const noContentDiv = document.createElement('div');
          noContentDiv.className = 'generation-object';
          noContentDiv.textContent = 'No table entries found.';
          resultsContainer.appendChild(noContentDiv);
          return;
        }

        // Create a container for the table display
        const tableContainer = document.createElement('div');
        tableContainer.className = 'table-display generation-container';
        tableContainer.dataset.index = `table-${Date.now()}`;
        
        // Make it draggable like other cards
        tableContainer.draggable = true;
        tableContainer.addEventListener('dragstart', handleCardDragStart);
        tableContainer.addEventListener('dragend', handleCardDragEnd);

        // Add the collapse button
        const collapseBtn = document.createElement('button');
        collapseBtn.className = 'collapse-btn';
        collapseBtn.onclick = (e) => {
          e.stopPropagation(); // Prevent card drag
          toggleCardCollapse(collapseBtn);
        };
        collapseBtn.innerHTML = `
          <span class="down-arrow">▼</span>
          <span class="up-arrow">▲</span>
        `;
        tableContainer.appendChild(collapseBtn);
        
        // Add table header with title and action buttons
        const tableHeader = document.createElement('div');
        tableHeader.className = 'card-title';
        
        // Title text
        const titleText = document.createElement('span');
        titleText.className = 'card-title-text';
        titleText.textContent = data.tableData.name;
        tableHeader.appendChild(titleText);
        
        // Action buttons
        const cardActions = document.createElement('div');
        cardActions.className = 'card-actions';
        
        // Copy button
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = (e) => {
          e.stopPropagation(); // Prevent drag when clicking buttons
          copyTableToMarkdown(tableContainer, data.tableData);
        };
        copyBtn.innerHTML = `
          Copy
          <img src="./Images/Icons/stack.png" alt="Copy" title="Copy to Markdown">
        `;
        cardActions.appendChild(copyBtn);
        
        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-card-btn';
        deleteBtn.onclick = (e) => {
          e.stopPropagation(); // Prevent drag when clicking buttons
          deleteCard(tableContainer);
        };
        deleteBtn.innerHTML = `
          Delete
          <img src="./Images/Icons/trash-can.png" alt="Delete" title="Delete Card">
        `;
        cardActions.appendChild(deleteBtn);
        
        tableHeader.appendChild(cardActions);
        tableContainer.appendChild(tableHeader);

        // Create the content wrapper
        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'card-content';
        
        // Process each subtable
        data.tableData.subtables.forEach(subtable => {
          const subtableContainer = document.createElement('div');
          subtableContainer.className = 'subtable-container';
          
          // Add subtable header
          const subtableHeader = document.createElement('div');
          subtableHeader.className = 'subtable-header';
          subtableHeader.textContent = subtable.name;
          subtableContainer.appendChild(subtableHeader);
          
          // Add customDisplay if present
          if (subtable.customDisplay) {
            const customDisplay = document.createElement('div');
            customDisplay.className = 'subtable-custom-display';
            customDisplay.textContent = subtable.customDisplay;
            subtableContainer.appendChild(customDisplay);
          }
          
          // Add results
          if (subtable.results && subtable.results.length > 0) {
            subtable.results.forEach((entry, index) => {
              const entryDiv = document.createElement('div');
              entryDiv.className = 'table-entry';
              
              // Add entry number
              const entryNumber = document.createElement('div');
              entryNumber.className = 'entry-number';
              entryNumber.textContent = `${index + 1}.`;
              entryDiv.appendChild(entryNumber);
              
              // Add content based on type
              const entryContent = document.createElement('div');
              entryContent.className = 'entry-content';
              
              // Handle different entry types
              if (entry.isWeighted) {
                // It's a weighted entry
                if (typeof entry.value === 'object' && !Array.isArray(entry.value)) {
                  entryContent.textContent = JSON.stringify(entry.value);
                } else if (Array.isArray(entry.value)) {
                  entryContent.textContent = entry.value.join(', ');
                } else {
                  entryContent.textContent = entry.value;
                }
                
                // Add weight display
                const entryWeight = document.createElement('div');
                entryWeight.className = 'entry-weight';
                entryWeight.textContent = `Weight: ${entry.weight}`;
                entryDiv.appendChild(entryWeight);
              } 
              else if (entry.isCareer) {
                // It's a career entry format
                const careerEntry = document.createElement('div');
                careerEntry.className = 'career-entry';
                
                const careerName = document.createElement('span');
                careerName.className = 'career-name';
                careerName.textContent = entry.career;
                careerEntry.appendChild(careerName);
                
                const careerItems = document.createElement('span');
                careerItems.className = 'career-items';
                careerItems.textContent = entry.items;
                careerEntry.appendChild(careerItems);
                
                entryContent.appendChild(careerEntry);
              }
              else if (typeof entry.value !== 'undefined') {
                // It's a simple value
                if (typeof entry.value === 'object') {
                  entryContent.textContent = JSON.stringify(entry.value);
                } else {
                  entryContent.textContent = entry.value;
                }
              }
              else {
                // It's a generic object
                entryContent.textContent = JSON.stringify(entry);
              }
              
              entryDiv.appendChild(entryContent);
              subtableContainer.appendChild(entryDiv);
            });
          } else {
            const noResults = document.createElement('div');
            noResults.className = 'table-entry';
            noResults.textContent = '(No results found)';
            subtableContainer.appendChild(noResults);
          }
          
          // Add nested subtables if present
          if (subtable.nestedSubtables && subtable.nestedSubtables.length > 0) {
            const nestedContainer = document.createElement('div');
            nestedContainer.className = 'nested-subtables';
            
            subtable.nestedSubtables.forEach(nestedTable => {
              const nestedHeader = document.createElement('div');
              nestedHeader.className = 'subtable-header';
              nestedHeader.textContent = `${nestedTable.name} (nested)`;
              nestedContainer.appendChild(nestedHeader);
              
              if (nestedTable.results && nestedTable.results.length > 0) {
                nestedTable.results.forEach((entry, index) => {
                  const entryDiv = document.createElement('div');
                  entryDiv.className = 'table-entry';
                  
                  // Add entry number
                  const entryNumber = document.createElement('div');
                  entryNumber.className = 'entry-number';
                  entryNumber.textContent = `${index + 1}.`;
                  entryDiv.appendChild(entryNumber);
                  
                  // Add content
                  const entryContent = document.createElement('div');
                  entryContent.className = 'entry-content';
                  
                  if (typeof entry.value !== 'undefined') {
                    entryContent.textContent = entry.value;
                  } else {
                    entryContent.textContent = JSON.stringify(entry);
                  }
                  
                  entryDiv.appendChild(entryContent);
                  nestedContainer.appendChild(entryDiv);
                });
              }
            });
            
            subtableContainer.appendChild(nestedContainer);
          }
          
          contentWrapper.appendChild(subtableContainer);
        });
        
        tableContainer.appendChild(contentWrapper);
        resultsContainer.appendChild(tableContainer);
      })
      .catch(error => {
        resultsContainer.innerHTML = '';
        const errorDiv = document.createElement('div');
        errorDiv.className = 'generation-object error';
        errorDiv.textContent = `Error: ${error.message}`;
        resultsContainer.appendChild(errorDiv);
      });
    }
    
    // Add function to copy table contents to markdown
    function copyTableToMarkdown(tableContainer, tableData) {
      if (!tableData) {
        // Fallback to old method if tableData isn't passed
        const title = tableContainer.querySelector('.card-title-text').textContent;
        const sourceInfo = currentSelectedTable ? `${currentSelectedTable.filename}: ${currentSelectedTable.tablename}` : '';
        
        let markdown = `# ${title}\n`;
        if (sourceInfo) {
          markdown += `*Source: ${sourceInfo}*\n`;
        }
        markdown += '\n';
        
        // Get all table entries
        const entries = tableContainer.querySelectorAll('.table-entry');
        entries.forEach(entry => {
          markdown += `- ${entry.textContent}\n`;
        });
        
        copyToClipboardWithToast(markdown);
        return;
      }
      
      // Enhanced method with structured data
      const title = tableData.name;
      const sourceInfo = `${tableData.filename}: ${tableData.game} (${tableData.type})`;
      
      let markdown = `# ${title}\n`;
      markdown += `*Source: ${sourceInfo}*\n\n`;
      
      // Process each subtable
      tableData.subtables.forEach(subtable => {
        markdown += `## ${subtable.name}\n\n`;
        
        if (subtable.customDisplay) {
          markdown += `*Custom Display: \`${subtable.customDisplay}\`*\n\n`;
        }
        
        if (subtable.results && subtable.results.length > 0) {
          subtable.results.forEach((entry, index) => {
            let entryText = '';
            
            if (entry.isWeighted) {
              const valueText = typeof entry.value === 'object' ? JSON.stringify(entry.value) : entry.value;
              entryText = `${valueText} *(Weight: ${entry.weight})*`;
            } else if (entry.isCareer) {
              entryText = `**${entry.career}** - ${entry.items}`;
            } else if (typeof entry.value !== 'undefined') {
              entryText = typeof entry.value === 'object' ? JSON.stringify(entry.value) : entry.value;
            } else {
              entryText = JSON.stringify(entry);
            }
            
            markdown += `${index + 1}. ${entryText}\n`;
          });
          markdown += '\n';
        }
        
        // Handle nested subtables
        if (subtable.nestedSubtables && subtable.nestedSubtables.length > 0) {
          subtable.nestedSubtables.forEach(nestedTable => {
            markdown += `### ${nestedTable.name} (nested)\n\n`;
            
            if (nestedTable.results && nestedTable.results.length > 0) {
              nestedTable.results.forEach((entry, index) => {
                const entryText = typeof entry.value !== 'undefined' ? 
                    entry.value : JSON.stringify(entry);
                markdown += `${index + 1}. ${entryText}\n`;
              });
              markdown += '\n';
            }
          });
        }
      });
      
      copyToClipboardWithToast(markdown);
    }
    
    function copyToClipboardWithToast(text) {
      navigator.clipboard.writeText(text)
        .then(() => {
          showToast('Copied to clipboard!');
        })
        .catch(err => {
          console.error('Failed to copy text: ', err);
          showToast('Failed to copy to clipboard');
        });
    }

    // New function to update available options in other filters based on current selection
    function updateAvailableOptions(filteredTables) {
      const gameFilter = document.getElementById('gameFilter');
      const typeFilter = document.getElementById('typeFilter');
      const settingFilter = document.getElementById('settingFilter');
      
      // Get selected values
      const selectedGames = getSelectedValues('gameFilter');
      const selectedTypes = getSelectedValues('typeFilter');
      const selectedSettings = getSelectedValues('settingFilter');
      
      // Create sets to store available options
      const availableGames = new Set();
      const availableTypes = new Set();
      const availableSettings = new Set();
      
      // Populate available options based on filtered tables
      filteredTables.forEach(table => {
        if (table.game) availableGames.add(table.game);
        
        if (Array.isArray(table.type)) {
          table.type.forEach(t => {
            if (t) availableTypes.add(t);
          });
        } else if (table.type) {
          availableTypes.add(table.type);
        }
        
        if (table.setting) availableSettings.add(table.setting);
      });
      
      // Update filter buttons to reflect available options
      updateFilterButtons(gameFilter, availableGames, selectedGames);
      updateFilterButtons(typeFilter, availableTypes, selectedTypes);
      updateFilterButtons(settingFilter, availableSettings, selectedSettings);
    }
    
    // Helper function to update filter buttons
    function updateFilterButtons(filterContainer, availableOptions, selectedOptions) {
      const buttons = filterContainer.querySelectorAll('.filter-btn');
      buttons.forEach(button => {
        const value = button.dataset.value;
        if (availableOptions.has(value)) {
          button.classList.remove('unavailable');
          button.disabled = false;
        } else {
          button.classList.add('unavailable');
          button.disabled = true;
        }
        
        // Restore selected state if previously selected
        if (selectedOptions.includes(value)) {
          button.classList.add('selected');
          button.classList.remove('unselected');
        }
      });
    }
  </script>
