              const careerName = document.createElement('span');
              careerName.className = 'career-name';
              careerName.textContent = entry[0];

              const careerItems = document.createElement('span');
              careerItems.className = 'career-items';
              careerItems.textContent = ' - ' + entry[1];

              careerDiv.appendChild(careerName);
              careerDiv.appendChild(careerItems);
              entryContentDiv.appendChild(careerDiv);
            } else if (entry.length === 2 && typeof entry[0] === 'string' && typeof entry[1] === 'number') {
              // Weighted entry [value, weight]
              displayValue = entry[0];
              weight = entry[1];
              entryContentDiv.textContent = displayValue;
            } else {
              // Regular array
              entryContentDiv.textContent = entry.join(', ');
            }
          } else {
            // Simple string or number
            entryContentDiv.textContent = String(entry || '');
          }

          entryDiv.appendChild(entryContentDiv);

          // Add weight if present
          if (weight !== undefined) {
            const weightDiv = document.createElement('div');
            weightDiv.className = 'entry-weight';
            weightDiv.textContent = `(${weight})`;
            entryDiv.appendChild(weightDiv);
          }

          container.appendChild(entryDiv);
        });
      } else if (tableData.table) {
        // Some tables use 'table' property instead of 'entries'
        processTableEntries(container, { entries: tableData.table });
      }

      // Display the display format if present
      if (tableData.displayFormat || tableData.customDisplay) {
        const formatDiv = document.createElement('div');
        formatDiv.className = 'subtable-custom-display';
        formatDiv.textContent = `Format: ${tableData.displayFormat || tableData.customDisplay}`;
        container.appendChild(formatDiv);
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
    }

    function checkFilterBarOverflow() {
      const filterContainers = ['gameFilter', 'typeFilter', 'settingFilter'];
      let totalHeight = 0;
      let maxButtonHeight = 0;
      // Calculate total height of all buttons if not wrapped
      filterContainers.forEach(filterId => {
        const container = document.getElementById(filterId);
        const buttons = container.querySelectorAll('.filter-btn');

        // Find the height of the tallest button
        buttons.forEach(button => {
          const buttonHeight = button.offsetHeight;
          if (buttonHeight > maxButtonHeight) {
            maxButtonHeight = buttonHeight;
          }
        });

        // Calculate unwrapped width
        let rowWidth = 0;
        const containerWidth = container.clientWidth;
        const buttonGap = 4; // Gap between buttons
        let rowCount = 1;

        buttons.forEach(button => {
          const buttonWidth = button.offsetWidth + buttonGap;
          // If this button would overflow the current row, start a new row
          if (rowWidth + buttonWidth > containerWidth && rowWidth > 0) {
            rowCount++;
            rowWidth = buttonWidth;
          } else {
            rowWidth += buttonWidth;
          }
        });

        // Store row count as data attribute
        container.dataset.rowCount = rowCount;

        // If rows > 2, mark as has-overflow
        if (rowCount > 2) {
          container.classList.add('has-overflow');
        } else {
          container.classList.remove('has-overflow');
        }
      });

      // Calculate if any container needs 3+ rows
      const hasSignificantOverflow = filterContainers.some(filterId => {
        const container = document.getElementById(filterId);
        return parseInt(container.dataset.rowCount || '0') >= 3;
      });

      // Update the container class
      const filtersContainer = document.getElementById('filtersContainer');
      if (hasSignificantOverflow) {
        filtersContainer.classList.add('has-significant-overflow');
      } else {
        filtersContainer.classList.remove('has-significant-overflow');
        filtersContainer.classList.remove('filters-expanded');
      }

      // Update the expand button text
      const expandBtn = document.getElementById('filterExpandBtn');
      expandBtn.innerHTML = filtersContainer.classList.contains('filters-expanded') ? '▲' : '▼';
    }

    function toggleAllFilters() {
      const filtersContainer = document.getElementById('filtersContainer');
      filtersContainer.classList.toggle('filters-expanded');
      // Update button text
      const expandBtn = document.getElementById('filterExpandBtn');
      expandBtn.innerHTML = filtersContainer.classList.contains('filters-expanded') ? '▲' : '▼';
    }

    function updateAvailableOptions(filteredTables) {
      const gameFilter = document.getElementById('gameFilter');
      const typeFilter = document.getElementById('typeFilter');
      const settingFilter = document.getElementById('settingFilter');
      // Get currently selected values
      const selectedGames = getSelectedValues('gameFilter');
      const selectedTypes = getSelectedValues('typeFilter');
      const selectedSettings = getSelectedValues('settingFilter');
      // Create sets to store available options
      const availableGames = new Set();
      const availableTypes = new Set();
      const availableSettings = new Set();

      // Populate available options based on filtered tables
      filteredTables.forEach(table => {
        if (table.game) availableGames.add(table.game);

        if (Array.isArray(table.type)) {
          table.type.forEach(t => {
            if (t) availableTypes.add(t);
          });
        } else if (table.type) {
          availableTypes.add(table.type);
        }

        if (table.setting) availableSettings.add(table.setting);
      });

      // Update filter buttons to reflect available options
      updateFilterButtons(gameFilter, availableGames, selectedGames);
      updateFilterButtons(typeFilter, availableTypes, selectedTypes);
      updateFilterButtons(settingFilter, availableSettings, selectedSettings);
    }

    function updateFilterButtons(filterContainer, availableOptions, selectedOptions) {
      const buttons = filterContainer.querySelectorAll('.filter-btn');
      buttons.forEach(button => {
        const value = button.dataset.value;
        if (availableOptions.has(value)) {
          button.classList.remove('unavailable');
          button.disabled = false;
        } else {
          button.classList.add('unavailable');
          button.disabled = true;
        }

        // Restore selected state if previously selected
        if (selectedOptions.includes(value)) {
          button.classList.add('selected');
          button.classList.remove('unselected');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Check filter overflow on window resize
      window.addEventListener('resize', debounce(() => {
        checkFilterBarOverflow();
      }, 250));
    });

    function debounce(func, wait) {
      let timeout;
      return function () {
        const context = this;
        const args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
      };
    }
  </script>
