<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
            flex-direction: column;
        }

        #contentWrapper {
            display: flex;
            flex: 1;
        }

        #leftColumn {
            width: 20%;
            border-right: 2px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #topAndCategoryButtons {
            display: flex;
            flex-direction: row;
            gap: 10px;
            height: auto;
        }

        #topLevelButtons {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 20%;
        }

        #categoryButtons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-content: start;
            width: 70%;
            overflow-y: auto;
        }

        #horizontalDivider {
            width: 100%;
            height: 2px;
            background-color: #ccc;
            margin: 20px 0;
        }

        #matchingTables {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            overflow-y: auto;
            max-height: calc(100% - 120px);
        }

        #mainContent {
            width: 70%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #results {
            margin-top: 20px;
            white-space: pre-wrap; /* Preserve spacing and newlines */
        }

        .header {
            font-weight: bold;
            margin-top: 10px;
            text-align: left;
        }

        .generation-container {
            margin-bottom: 20px; /* Space between each generation */
        }

        .generation-title {
            font-weight: bold;
            margin-top: 20px;
        }

        .slider-container {
            margin-top: 20px;
        }

        #tableHeaders {
            margin-bottom: 20px;
        }

        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

            .dark-mode #leftColumn {
                border-right: 2px solid #444;
            }

        .top-level-button {
            width: 100%;
            padding: 6px;
            margin-bottom: 5px;
            text-align: center;
            cursor: pointer;
            background-color: #f0f0f0;
            border: none;
            border-radius: 5px;
            font-size: 0.9em;
            transition: background-color 0.3s, transform 0.2s;
        }

            .top-level-button:hover {
                background-color: #e0e0e0;
                transform: scale(1.05);
            }

            .top-level-button.active, .top-level-button.selected {
                background-color: #b0b0b0;
            }

        .matching-table-button, .category-button {
            width: 100%;
            padding: 6px;
            margin: 0;
            font-size: 0.9em;
            background-color: #f0f0f0;
            border: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
        }

            .matching-table-button:hover, .category-button:hover {
                background-color: #e0e0e0;
                transform: scale(1.05);
            }

            .matching-table-button.active, .category-button.active, .matching-table-button.selected, .category-button.selected {
                background-color: #b0b0b0;
            }

        #toggleDarkMode {
            margin: 20px;
            align-self: center;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(-20%);
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div id="contentWrapper">
        <div id="leftColumn">
            <h1>TTRPG Generator</h1>
            <div id="topAndCategoryButtons">
                <div id="topLevelButtons">
                    <button class="top-level-button" onclick="filterTables('all', this)">All</button>
                    <button class="top-level-button" onclick="filterTables('game', this)">Game</button>
                    <button class="top-level-button" onclick="filterTables('genre', this)">Setting</button>
                    <button class="top-level-button" onclick="filterTables('type', this)">Type</button>
                </div>
                <div id="categoryButtons" class="category-buttons">
                    <!-- Filtered tag buttons will be dynamically populated here -->
                </div>
            </div>

            <div id="horizontalDivider"></div>

            <h2>Matching Tables</h2>
            <div id="matchingTables" class="matching-tables">
                <!-- Matching table buttons will be dynamically populated here -->
            </div>
        </div>
        <div id="mainContent">
            <div id="tableHeaders">
                <!-- Table name and details will be displayed here -->
            </div>
            <div id="generationControls" class="slider-container" style="display: none;">
                <label for="generationSlider">Number of Generations: <span id="generationValue">1</span></label><br>
                <input type="range" id="generationSlider" min="1" max="20" value="1">
                <button id="generateBtn" style="margin-top: 10px;">Generate</button>
            </div>
            <div id="results"></div>
        </div>
    </div>
    <button id="toggleDarkMode">Toggle Dark Mode</button>

    <script>
        let tablesData = [];

        async function fetchTables() {
            try {
                const response = await fetch('/api/tables');
                tablesData = await response.json();
                console.log('Tables data fetched:', tablesData); // Debugging to ensure tables are fetched correctly
                filterTables('all', document.querySelector('.top-level-button')); // Automatically select 'All' on load
            } catch (error) {
                console.error('Error fetching tables:', error);
            }
        }

        function filterTables(filterType, buttonElement) {
            console.log('Filtering tables by:', filterType); // Debugging
            const categoryButtonsContainer = document.getElementById('categoryButtons');
            const matchingTablesContainer = document.getElementById('matchingTables');
            categoryButtonsContainer.innerHTML = ''; // Clear previous buttons
            matchingTablesContainer.innerHTML = ''; // Clear previous buttons
            categoryButtonsContainer.classList.remove('active');
            matchingTablesContainer.classList.remove('active');

            resetButtonHighlights();
            buttonElement.classList.add('selected');

            if (filterType === 'all') {
                tablesData.forEach(table => {
                    createTableButton(table, matchingTablesContainer);
                });
                if (matchingTablesContainer.children.length > 1) { // More than just the title
                    matchingTablesContainer.classList.add('active');
                }
                hideCategoryButtons();
            } else {
                let filteredValues = new Set();
                tablesData.forEach(table => {
                    if (table[filterType]) {
                        console.log('Found value for filter:', table[filterType]); // Debugging
                        filteredValues.add(table[filterType]);
                    }
                });

                Array.from(filteredValues).forEach(value => {
                    const button = document.createElement('button');
                    button.className = 'category-button';
                    button.textContent = value;
                    button.onclick = () => {
                        console.log('Category button clicked:', value); // Debugging
                        displayFilteredTables(filterType, value);
                        resetButtonHighlights(false, true, true);
                        button.classList.add('selected');
                    };
                    categoryButtonsContainer.appendChild(button);
                });

                if (filteredValues.size > 0) {
                    showCategoryButtons();
                }
            }
        }

        function createTableButton(table, container) {
            const button = document.createElement('button');
            button.className = 'matching-table-button';
            button.textContent = table.tablename;
            button.onclick = () => {
                resetButtonHighlights(false, false, true);
                button.classList.add('selected');
                displayTableHeaders(table);
                document.getElementById('generationControls').style.display = 'block';
                document.getElementById('generationSlider').value = 1;
                document.getElementById('generationValue').textContent = 1;
            };

            container.appendChild(button);
        }

        function displayFilteredTables(filterType, value) {
            const matchingTablesContainer = document.getElementById('matchingTables');
            // Clear previous buttons
            matchingTablesContainer.innerHTML = ''; // Clear previous buttons

            tablesData.filter(table => table[filterType] === value).forEach(table => {
                createTableButton(table, matchingTablesContainer);
            });

            if (matchingTablesContainer.children.length > 1) { // More than just the title
                matchingTablesContainer.classList.add('active');
            }
        }

        function displayTableHeaders(table) {
            const tableHeadersContainer = document.getElementById('tableHeaders');
            tableHeadersContainer.innerHTML = ''; // Clear previous headers

            // Set the table name as the section title
            const tableNameTitle = document.createElement('h2');
            tableNameTitle.textContent = table.tablename;
            tableHeadersContainer.appendChild(tableNameTitle);

            // Display relevant table details
            const details = [
                { key: 'filename', label: 'File Name' },
                { key: 'game', label: 'Game' },
                { key: 'genre', label: 'Genre' },
                { key: 'type', label: 'Type' },
                { key: 'subtype', label: 'Subtype' }
            ];

            details.forEach(detail => {
                if (table[detail.key]) {
                    const detailDiv = document.createElement('div');
                    detailDiv.className = 'header';
                    detailDiv.textContent = `${detail.label}: ${table[detail.key]}`;
                    tableHeadersContainer.appendChild(detailDiv);
                }
            });
        }

        function showCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('categoryButtons');
            categoryButtonsContainer.style.display = 'grid';
            categoryButtonsContainer.style.animation = 'slideIn 0.5s forwards';
        }

        function hideCategoryButtons() {
            const categoryButtonsContainer = document.getElementById('categoryButtons');
            categoryButtonsContainer.style.animation = 'slideOut 0.5s forwards';
            setTimeout(() => {
                categoryButtonsContainer.style.display = 'none';
            }, 500);
        }

        function resetButtonHighlights(resetTopLevel = true, resetTags = true, resetTables = true) {
            if (resetTopLevel) {
                document.querySelectorAll('.top-level-button').forEach(button => {
                    button.classList.remove('selected');
                });
            }
            if (resetTags) {
                document.querySelectorAll('.category-button').forEach(button => {
                    button.classList.remove('selected');
                });
            }
            if (resetTables) {
                document.querySelectorAll('.matching-table-button').forEach(button => {
                    button.classList.remove('selected');
                });
            }
        }

        // Update the label when the slider changes
        document.getElementById('generationSlider').addEventListener('input', (event) => {
            const generationValue = event.target.value;
            document.getElementById('generationValue').textContent = generationValue;
        });

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const selectedTableButton = document.querySelector('.matching-table-button.selected');
            if (!selectedTableButton) {
                alert("Please select a table first.");
                return;
            }

            const tableName = selectedTableButton.textContent;
            const tableData = tablesData.find(table => table.tablename === tableName);
            const numberOfGenerations = parseInt(document.getElementById('generationSlider').value, 10);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table: tableData, number: numberOfGenerations })
                });
                const data = await response.json();
                displayResults(data.results);
            } catch (error) {
                console.error('Error generating adventure:', error);
            }
        });

        function displayResults(results) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = ''; // Clear previous results

            results.forEach((result, index) => {
                // Create a container for each generation
                const generationContainer = document.createElement('div');
                generationContainer.className = 'generation-container';

                // Add the generation number and result on the same line
                const generationTitle = document.createElement('div');
                generationTitle.className = 'generation-title';
                generationTitle.textContent = `(${index + 1}) `;

                if (typeof result === 'string') {
                    generationTitle.textContent += result;
                } else if (typeof result === 'object') {
                    // If there are nested headers, format them properly
                    generationTitle.textContent += `${result.header}: ${result.result}`;
                }

                generationContainer.appendChild(generationTitle);

                // Append the generation container to the results container
                resultsContainer.appendChild(generationContainer);
            });
        }

        // Toggle dark mode
        document.getElementById('toggleDarkMode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Fetch tables on page load
        fetchTables();
    </script>
</body>
</html>
