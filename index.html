<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTRPG Generator - Version 120</title>
    <link href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        #titleContainer {
            text-align: center;
            padding: 15px;
            background-color: #444;
            color: #fff;
        }

        #searchContainer {
            display: flex;
            padding: 15px;
            background-color: #f0f0f0;
            border-bottom: 2px solid #ccc;
        }

        #searchInput {
            flex: 1;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #filtersContainer {
            display: flex;
            padding: 15px;
            background-color: #e0e0e0;
            border-bottom: 2px solid #ccc;
            gap: 15px;
        }

        .filter-container {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 300px;
        }

        .filter-dropdown {
            width: 100%;
            margin-top: 5px;
        }

        .clear-button {
            position: absolute;
            right: 10px;
            top: 0;
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: #007bff;
            display: block;
        }

        #resetButton {
            margin-left: 20px;
            padding: 10px;
            font-size: 1em;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 5px;
        }

        #contentWrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #leftColumn {
            width: 25%;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #ccc;
            overflow-y: auto;
        }

        .matching-table-button {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 1em;
            background-color: #f0f0f0;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

            .matching-table-button:hover {
                background-color: #e0e0e0;
            }

        #mainContent {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            font-weight: bold;
            margin-top: 10px;
            text-align: left;
        }

        .disabled-option {
            color: #aaa;
        }

        .generation-object {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            cursor: grab;
        }

        .saved-generations {
            width: 25%;
            padding: 15px;
            background-color: #f0f0f0;
            border-left: 2px solid #ccc;
            overflow-y: auto;
        }

        .dragging {
            opacity: 0.5;
        }

        /* NPC specific styling */
        .npc-object {
            border: 2px solid #007bff;
            background-color: #e6f0ff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .npc-header {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }

        .npc-notes {
            margin-top: 10px;
        }

            .npc-notes textarea {
                width: 100%;
                height: 50px;
                padding: 5px;
                font-size: 1em;
                border-radius: 5px;
                border: 1px solid #ccc;
            }

        .npc-details {
            margin-top: 10px;
        }

        .detail-key {
            font-weight: bold;
        }

        .npc-details div {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="titleContainer">
        <h1>TTRPG Generator - Version 119</h1>
    </div>

    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="Search for tables..." oninput="performSearch()">
    </div>

    <div id="filtersContainer">
        <div class="filter-container">
            <label for="gameFilter">Game</label>
            <select id="gameFilter" class="filter-dropdown" multiple="multiple"></select>
            <button class="clear-button" onclick="clearFilter('gameFilter')">&times;</button>
        </div>

        <div class="filter-container">
            <label for="typeFilter">Type</label>
            <select id="typeFilter" class="filter-dropdown" multiple="multiple"></select>
            <button class="clear-button" onclick="clearFilter('typeFilter')">&times;</button>
        </div>

        <div class="filter-container">
            <label for="settingFilter">Setting</label>
            <select id="settingFilter" class="filter-dropdown" multiple="multiple"></select>
            <button class="clear-button" onclick="clearFilter('settingFilter')">&times;</button>
        </div>

        <button id="resetButton" onclick="resetFilters()">Reset</button>
    </div>

    <div id="contentWrapper">
        <div id="leftColumn">
            <div id="matchingTablesContainer">
                <!-- Matching table buttons will be dynamically populated here -->
            </div>
        </div>

        <div id="mainContent">
            <div id="tableHeaders">
                <!-- Table name and details will be displayed here -->
            </div>
            <div id="generationControls" class="slider-container" style="display: none;">
                <label for="generationSlider">Number of Generations: <span id="generationValue">1</span></label><br>
                <input type="range" id="generationSlider" min="1" max="20" value="1" oninput="updateGenerationValue()">
                <button id="generateBtn" style="margin-top: 10px;" onclick="generateContent()">Generate</button>
            </div>
            <div id="results" class="generation-list">
                <!-- Generation List goes here, each generation being its own object in the list. -->
            </div>
        </div>

        <div id="savedGenerations" class="saved-generations">
            <h2>Saved Generations</h2>
        </div>
    </div>

    <script>
        let tablesData = [];

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const response = await fetch('/api/tables');
                tablesData = await response.json();
                console.log('Tables Data:', tablesData); // Debugging output
                populateDropdowns(tablesData);
                applyFilters();
            } catch (error) {
                console.error('Error fetching tables:', error);
            }

            window.gameChoices = new Choices('#gameFilter', {
                removeItemButton: true,
                placeholder: true,
                searchPlaceholderValue: 'Select games...',
                allowHTML: true,
                noResultsText: '',
                noChoicesText: ''
            });
            document.getElementById('gameFilter').addEventListener('change', applyFilters);

            window.typeChoices = new Choices('#typeFilter', {
                removeItemButton: true,
                placeholder: true,
                searchPlaceholderValue: 'Select types...',
                allowHTML: true,
                noResultsText: '',
                noChoicesText: ''
            });
            document.getElementById('typeFilter').addEventListener('change', applyFilters);

            window.settingChoices = new Choices('#settingFilter', {
                removeItemButton: true,
                placeholder: true,
                searchPlaceholderValue: 'Select settings...',
                allowHTML: true,
                noResultsText: '',
                noChoicesText: ''
            });
            document.getElementById('settingFilter').addEventListener('change', applyFilters);
        });

        function populateDropdowns(tables) {
            const gameSet = new Set();
            const typeSet = new Set();
            const settingSet = new Set();

            tables.forEach(table => {
                if (table.game) gameSet.add(table.game);
                if (table.type) typeSet.add(table.type);
                if (table.setting) settingSet.add(table.setting);
            });

            populateOptions('#gameFilter', Array.from(gameSet));
            populateOptions('#typeFilter', Array.from(typeSet));
            populateOptions('#settingFilter', Array.from(settingSet));
        }

        function populateOptions(selectId, options) {
            const select = document.querySelector(selectId);
            select.innerHTML = '';
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });
        }

        function performSearch() {
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const gameFilter = Array.from(document.getElementById('gameFilter').selectedOptions).map(option => option.value);
            const typeFilter = Array.from(document.getElementById('typeFilter').selectedOptions).map(option => option.value);
            const settingFilter = Array.from(document.getElementById('settingFilter').selectedOptions).map(option => option.value);

            const matchingTablesContainer = document.getElementById('matchingTablesContainer');
            matchingTablesContainer.innerHTML = '';

            const filteredTables = tablesData.filter(table =>
                (searchQuery === '' || (table.tablename && table.tablename.toLowerCase().includes(searchQuery))) &&
                (gameFilter.length === 0 || gameFilter.includes(table.game)) &&
                (typeFilter.length === 0 || typeFilter.includes(table.type)) &&
                (settingFilter.length === 0 || settingFilter.includes(table.setting))
            );

            filteredTables.forEach(table => {
                const button = document.createElement('button');
                button.className = 'matching-table-button';
                button.textContent = `${table.game ?? 'Unknown'} : ${table.tablename ?? 'Undefined'}`;
                console.log('Button Text:', button.textContent); // Debugging output
                button.onclick = () => {
                    displayTableDetails(table);
                    clearGeneratedList();
                    generateContent(); // Automatically generate one result when a matching table is selected
                };

                matchingTablesContainer.appendChild(button);
            });
        }

        function displayTableDetails(table) {
            const tableHeadersContainer = document.getElementById('tableHeaders');
            tableHeadersContainer.innerHTML = '';

            const tableNameTitle = document.createElement('h2');
            tableNameTitle.textContent = table.tablename ?? 'Unnamed Table';
            tableHeadersContainer.appendChild(tableNameTitle);

            const details = [
                { key: 'game', label: 'Game' },
                { key: 'type', label: 'Type' },
                { key: 'setting', label: 'Setting' }
            ];

            details.forEach(detail => {
                if (table[detail.key]) {
                    const detailDiv = document.createElement('div');
                    detailDiv.className = 'header';
                    detailDiv.textContent = `${detail.label}: ${table[detail.key]}`;
                    tableHeadersContainer.appendChild(detailDiv);
                }
            });

            document.getElementById('generationControls').style.display = 'block';
            document.getElementById('generationSlider').value = 1;
            document.getElementById('generationValue').textContent = 1;
        }

        function clearFilter(filterId) {
            const choicesInstance = window[`${filterId.replace('Filter', 'Choices')}`];
            if (choicesInstance) {
                choicesInstance.removeActiveItems();
                console.log('Active items cleared for:', filterId);
            } else {
                console.warn('Choices instance not found for:', filterId);
            }
            applyFilters();
        }

        function resetFilters() {
            window.gameChoices.removeActiveItems();
            window.typeChoices.removeActiveItems();
            window.settingChoices.removeActiveItems();
            applyFilters();
        }

        function generateContent() {
            clearGeneratedList();

            const numberOfGenerations = document.getElementById('generationSlider').value;
            const selectedTable = tablesData.find(t => t.tablename === document.querySelector('#tableHeaders h2')?.textContent);

            if (!selectedTable) {
                console.error('No table selected for generation.');
                return;
            }

            fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table: selectedTable, number: numberOfGenerations })
            })
                .then(response => response.json())
                .then(data => {
                    console.log("Received generation data:", data.results); // Debugging output

                    const resultsContainer = document.getElementById('results');
                    data.results.forEach((result, index) => {
                        const objDiv = document.createElement('div');
                        objDiv.setAttribute('draggable', 'true');
                        objDiv.dataset.type = selectedTable.type;
                        objDiv.dataset.id = `${selectedTable.filename}-${Date.now()}-${index}`;

                        if (selectedTable.type.toLowerCase() === 'npc') {
                            // NPC-specific structure
                            objDiv.className = 'generation-object npc';

                       
                            const header = `<strong>NPC</strong>`;

                            // Create NPC details in a vertical list
                            const npcDetails = document.createElement('div');
                            npcDetails.className = 'npc-details';

                            result.forEach(item => {
                                if (item.key !== 'name' && item.key !== 'title' && item.key !== 'ancestry') {
                                    const detailDiv = document.createElement('div');
                                    //  detailDiv.textContent = `${item.key}: ${item.value}`;
                                    detailDiv.innerHTML = `<span class="detail-key">${item.key}:</span> ${item.value}`;

                                    npcDetails.appendChild(detailDiv);
                                }
                            });

                            objDiv.innerHTML = `${header}`;
                            objDiv.appendChild(npcDetails);

                            // Add Notes section
                            const notesDiv = document.createElement('div');
                            notesDiv.className = 'notes';
                            notesDiv.innerHTML = `<label>Notes:</label><textarea></textarea>`;
                            objDiv.appendChild(notesDiv);

                        } else if (selectedTable.actionType === 'SameLineWithSpaces' || selectedTable.actionType === 'SameLineWithoutSpaces') {
                            // Handle non-NPC content with SameLine
                            objDiv.className = 'generation-object';

                            let resultText = '';
                            if (Array.isArray(result)) {
                                // If result is an array of objects, concatenate the values
                                resultText = result.map(item => item.value).join(
                                    selectedTable.actionType === 'SameLineWithSpaces' ? ' ' : ''
                                );
                            } else if (typeof result === 'object') {
                                resultText = Object.values(result).join(
                                    selectedTable.actionType === 'SameLineWithSpaces' ? ' ' : ''
                                );
                            } else {
                                resultText = result;
                            }

                            const defaultContent = `<strong>${selectedTable.type}</strong><br>${resultText}`;
                            objDiv.innerHTML = defaultContent;
                        } else {
                            // Default generation for other content types
                            objDiv.className = 'generation-object';
                            const defaultContent = `<strong>${selectedTable.type}</strong><br>${result}`;
                            objDiv.innerHTML = defaultContent;
                        }

                        // Add drag event handlers
                        objDiv.addEventListener('dragstart', handleDragStart);
                        objDiv.addEventListener('dragend', handleDragEnd);

                        resultsContainer.appendChild(objDiv);
                    });
                })
                .catch(error => {
                    console.error('Error generating content:', error);
                });
        }



        function updateGenerationValue() {
            const generationSlider = document.getElementById('generationSlider');
            document.getElementById('generationValue').textContent = generationSlider.value;
        }

        function clearGeneratedList() {
            document.getElementById('results').innerHTML = '';
        }

        function handleDragStart(e) {
            this.classList.add('dragging');
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        document.getElementById('savedGenerations').addEventListener('dragover', function (e) {
            e.preventDefault();
        });

        document.getElementById('savedGenerations').addEventListener('drop', function (e) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.querySelector(`[data-id="${id}"]`);
            if (draggedElement) {
                this.appendChild(draggedElement);
            }
        });

        applyFilters();
    </script>
</body>
</html>
