<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTRPG Generator - Version 124</title>
  <!-- Add extractContext polyfill script first - IMPORTANT! -->
  <script src="/js/extractContext.js"></script>
  <!-- REMOVE Choices.js dependency since we're using buttons instead -->
  <link rel="stylesheet" href="css/styles.css">

</head>

<body>
  <div id="titleContainer">
    <h1>TTRPG Generator - Version 124</h1>
    <button id="themeToggle" onclick="toggleTheme()">Toggle Theme</button>
  </div>

  <div id="searchContainer">
    <input type="text" id="searchInput" placeholder="Search for tables..." oninput="performSearch()">
  </div>

  <!-- REPLACE the filter section with our new button-based UI in horizontal layout -->
  <div id="filtersContainer">
    <div class="filter-container">
      <div class="filter-header">
        <span class="filter-title">Game</span>
        <!-- Commented out individual clear button
        <button class="filter-clear" onclick="clearFilter('game')">&times;</button>
        -->
      </div>
      <div id="gameFilter" class="filter-buttons" data-mode="all-selected">
        <!-- Game filter buttons will be added here dynamically -->
      </div>
    </div>

    <div class="filter-container">
      <div class="filter-header">
        <span class="filter-title">Type</span>
        <!-- Commented out individual clear button
        <button class="filter-clear" onclick="clearFilter('type')">&times;</button>
        -->
      </div>
      <div id="typeFilter" class="filter-buttons" data-mode="all-selected">
        <!-- Type filter buttons will be added here dynamically -->
      </div>
    </div>

    <div class="filter-container">
      <div class="filter-header">
        <span class="filter-title">Setting</span>
        <!-- Commented out individual clear button
        <button class="filter-clear" onclick="clearFilter('setting')">&times;</button>
        -->
      </div>
      <div id="settingFilter" class="filter-buttons" data-mode="all-selected">
        <!-- Setting filter buttons will be added here dynamically -->
      </div>
    </div>

    <button id="resetButton" onclick="resetFilters()">Reset</button>

    <!-- Single expand button for the entire filter bar -->
    <button id="filterExpandBtn" onclick="toggleAllFilters()" aria-label="Show more filters">▼</button>
  </div>

  <div id="contentWrapper">
    <div id="leftColumn">
      <div id="matchingTablesContainer">
        <!-- Matching table buttons will be dynamically populated here -->
      </div>
    </div>

    <div id="mainContent">
      <div id="tableHeaders">
        <!-- Table name and details will be displayed here -->
      </div>
      <div id="generationControls" class="slider-container" style="display: none;">
        <label for="generationSlider">Number of Generations: <span id="generationValue">1</span></label><br>
        <input type="range" id="generationSlider" min="1" max="100" value="1" oninput="updateGenerationValue()">
        <button id="generateBtn" style="margin-top: 10px;" onclick="generateContent()">Generate</button>
        <button id="showTableBtn" style="margin-top: 10px; margin-left: 10px;" onclick="showTableContent()">Show
          Table</button>
        <button id="clearBtn" style="margin-top: 10px; margin-left: 10px;" onclick="clearGeneratedList()">Clear
          All</button>
      </div>
      <div id="results" class="generation-list">
        <!-- Generation List goes here, each generation being its own object in the list. -->
      </div>
    </div>

    <div id="savedGenerations" class="saved-cards">
      <h2>Saved Cards</h2>
    </div>
  </div>

  <script>
    let tablesData = [];
    let currentSelectedTable = null;
    let generationContexts = {};

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        const response = await fetch('/api/tables');
        tablesData = await response.json();
        console.log('Tables Data:', tablesData);
        populateFilterButtons(tablesData); // New function to populate filter buttons
        applyFilters();
      } catch (error) {
        console.error('Error fetching tables:', error);
      }

      // Set up drag and drop for saved cards
      const savedArea = document.getElementById('savedGenerations');

      savedArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        this.classList.add('drop-target-highlight');
        e.dataTransfer.dropEffect = 'copy';
      });

      savedArea.addEventListener('dragleave', function (e) {
        this.classList.remove('drop-target-highlight');
      });

      savedArea.addEventListener('drop', function (e) {
        e.preventDefault();
        this.classList.remove('drop-target-highlight');
        const cardIndex = e.dataTransfer.getData('text/plain');
        const originalCard = document.querySelector(`.generation-container[data-index="${cardIndex}"]`);

        if (!originalCard) return;

        // Check if this card already exists in the saved area by comparing content
        const cardTitle = originalCard.querySelector('.card-title-text').textContent;

        // Get all headers and contents from the original card to create a unique signature
        const originalHeaders = Array.from(originalCard.querySelectorAll('.result-header')).map(h => h.textContent);
        const originalContents = Array.from(originalCard.querySelectorAll('.result-content')).map(c => c.textContent);
        const cardSignature = JSON.stringify({ title: cardTitle, headers: originalHeaders, contents: originalContents });

        // Check if a card with the same signature already exists
        let isDuplicate = false;
        const savedCards = savedArea.querySelectorAll('.generation-container');
        savedCards.forEach(savedCard => {
          const savedHeaders = Array.from(savedCard.querySelectorAll('.result-header')).map(h => h.textContent);
          const savedContents = Array.from(savedCard.querySelectorAll('.result-content')).map(c => c.textContent);
          const savedSignature = JSON.stringify({
            title: savedCard.querySelector('.card-title-text').textContent,
            headers: savedHeaders,
            contents: savedContents
          });

          if (savedSignature === cardSignature) {
            isDuplicate = true;
          }
        });

        if (isDuplicate) {
          showToast('Card already exists in Saved Cards');
          return;
        }

        // Clone the card and add to saved area
        const cardClone = originalCard.cloneNode(true);
        const newIndex = `saved-${Date.now()}`;
        cardClone.dataset.index = newIndex;

        // Reattach event handlers for all buttons in the cloned card
        cardClone.querySelector('.copy-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToMarkdown(cardClone);
        });

        cardClone.querySelector('.reroll-all-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          rerollAllContent(cardClone);
        });

        cardClone.querySelector('.delete-card-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteCard(cardClone);
        });

        // Make the clone draggable too, but it won't actually be draggable due to our check in handleCardDragStart
        cardClone.addEventListener('dragstart', handleCardDragStart);
        cardClone.addEventListener('dragend', handleCardDragEnd);

        // Update collapse button handlers
        cardClone.querySelector('.collapse-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCardCollapse(e.currentTarget);
        });

        // Add the card to the saved area
        this.appendChild(cardClone);

        // Show confirmation
        showToast('Card saved!');
      });
    });

    // New function to populate filter buttons
    function populateFilterButtons(tables) {
      const gameSet = new Set();
      const typeSet = new Set();
      const settingSet = new Set();

      tables.forEach(table => {
        if (table.game) gameSet.add(table.game);

        // Handle type as either an array or string
        if (Array.isArray(table.type)) {
          table.type.forEach(t => {
            if (t) typeSet.add(t);
          });
        } else if (table.type) {
          typeSet.add(table.type);
        }

        if (table.setting) settingSet.add(table.setting);
      });

      createFilterButtons('gameFilter', Array.from(gameSet));
      createFilterButtons('typeFilter', Array.from(typeSet));
      createFilterButtons('settingFilter', Array.from(settingSet));
    }

    // Helper function to create filter buttons
    function createFilterButtons(filterId, options) {
      const filterContainer = document.getElementById(filterId);
      filterContainer.innerHTML = '';

      options.sort().forEach(option => {
        const button = document.createElement('button');
        button.className = 'filter-btn';
        button.textContent = option;
        button.dataset.value = option;
        button.onclick = function () {
          toggleFilterButton(this, filterId);
        };
        filterContainer.appendChild(button);
      });

      // Check if the container has overflow and add indicator class
      setTimeout(() => {
        checkFilterOverflow(filterId);
      }, 0);
    }

    // New function to check if filter container has significant overflow content
    function checkFilterOverflow(filterId) {
      const container = document.getElementById(filterId);
      const significantOverflowThreshold = 10; // Show "More" when we have this much overflow

      if (container.scrollHeight > container.clientHeight || container.scrollWidth > container.clientWidth) {
        // Add has-overflow class for any overflow
        container.classList.add('has-overflow');

        // Check if overflow is significant enough to show controls
        const hasSignificantOverflow =
          container.scrollHeight - container.clientHeight > significantOverflowThreshold ||
          container.scrollWidth - container.clientWidth > 20; // Higher threshold for horizontal

        if (hasSignificantOverflow) {
          container.closest('.filter-container').classList.add('has-significant-overflow');
        } else {
          container.closest('.filter-container').classList.remove('has-significant-overflow');
        }
      } else {
        container.classList.remove('has-overflow');
        container.closest('.filter-container').classList.remove('has-significant-overflow');
      }
    }

    // Toggle filter button states
    function toggleFilterButton(button, filterId) {
      const filterContainer = document.getElementById(filterId);
      const currentMode = filterContainer.dataset.mode;

      if (currentMode === 'all-selected') {
        // Switching from AllSelectedMode to ChoiceMode
        filterContainer.dataset.mode = 'choice';

        // Set all buttons to unselected state
        const buttons = filterContainer.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
          btn.classList.add('unselected');
          btn.classList.remove('selected');
        });

        // Set the clicked button to selected
        button.classList.remove('unselected');
        button.classList.add('selected');
      } else {
        // Already in ChoiceMode, toggle this button
        button.classList.toggle('unselected');
        button.classList.toggle('selected');

        // If no buttons are selected, switch back to all-selected mode
        const selectedButtons = filterContainer.querySelectorAll('.filter-btn.selected');
        if (selectedButtons.length === 0) {
          clearFilter(filterId.replace('Filter', ''));
        }
      }

      // Apply filters with the new selection
      applyFilters();
    }

    // Clear a specific filter (reset to all-selected mode)
    function clearFilter(filterType) {
      const filterId = filterType + 'Filter';
      const filterContainer = document.getElementById(filterId);

      filterContainer.dataset.mode = 'all-selected';
      const buttons = filterContainer.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.classList.remove('unselected', 'selected');
      });

      console.log('Filter cleared:', filterType);
      applyFilters();
    }

    // Toggle filter section expansion
    function toggleFilterExpand(filterId) {
      const filterContainer = document.getElementById(filterId);
      filterContainer.classList.toggle('expanded');

      const expandBtn = document.querySelector(`.expand-btn[onclick*="${filterId}"]`);
      if (filterContainer.classList.contains('expanded')) {
        expandBtn.textContent = '▲';
      } else {
        expandBtn.textContent = '▼';
      }

      // Recalculate overflow after toggling
      setTimeout(() => {
        checkFilterOverflow(filterId);
      }, 300);
    }

    // Reset all filters to default state
    function resetFilters() {
      clearFilter('game');
      clearFilter('type');
      clearFilter('setting');
      document.getElementById('searchInput').value = '';
      applyFilters();
    }

    function performSearch() {
      applyFilters();
    }

    // Updated applyFilters function to work with the new button-based UI
    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();

      // Get selected filter values from the new button UI
      const gameFilter = getSelectedValues('gameFilter');
      const typeFilter = getSelectedValues('typeFilter');
      const settingFilter = getSelectedValues('settingFilter');

      console.log('Applying filters:', {
        search: searchQuery,
        game: gameFilter,
        type: typeFilter,
        setting: settingFilter
      });

      const matchingTablesContainer = document.getElementById('matchingTablesContainer');
      matchingTablesContainer.innerHTML = '';

      const filteredTables = tablesData.filter(table => {
        // Search by name
        const matchesSearch = searchQuery === '' ||
          (table.tablename && table.tablename.toLowerCase().includes(searchQuery));

        // Filter by game
        const matchesGame = gameFilter.length === 0 ||
          (table.game && gameFilter.includes(table.game));

        // Handle type filter when type is an array
        let matchesType = false;
        if (typeFilter.length === 0) {
          matchesType = true;
        } else if (Array.isArray(table.type)) {
          // Check if any type in the array matches any selected type filter
          matchesType = table.type.some(t => typeFilter.includes(t));
        } else {
          // Handle single type as before
          matchesType = table.type && typeFilter.includes(table.type);
        }

        // Filter by setting
        const matchesSetting = settingFilter.length === 0 ||
          (table.setting && settingFilter.includes(table.setting));

        return matchesSearch && matchesGame && matchesType && matchesSetting;
      });

      console.log(`Found ${filteredTables.length} matching tables`);

      filteredTables.forEach(table => {
        const button = document.createElement('button');
        button.className = 'matching-table-button';
        button.textContent = `${table.game ?? 'Unknown'} : ${table.tablename ?? 'Undefined'}`;

        // Add additional info for debugging when hovering
        button.title = `Filename: ${table.filename}`;

        button.onclick = () => {
          console.log('Selected table from list:', {
            tablename: table.tablename,
            filename: table.filename,
            game: table.game
          });
          displayTableDetails(table);
          clearGeneratedList();
          generateContent(); // Automatically generate one result
        };

        matchingTablesContainer.appendChild(button);
      });

      // Update available options in other filters based on current selection
      updateAvailableOptions(filteredTables);
    }

    // Helper function to get selected values from button-based filter
    function getSelectedValues(filterId) {
      const filterContainer = document.getElementById(filterId);
      const mode = filterContainer.dataset.mode;

      // If in all-selected mode, return empty array (no filtering)
      if (mode === 'all-selected') {
        return [];
      }

      // Otherwise get selected button values
      const selectedButtons = filterContainer.querySelectorAll('.filter-btn.selected');
      return Array.from(selectedButtons).map(btn => btn.dataset.value);
    }

    function displayTableDetails(table) {
      // Add debugging to see which table is being selected
      console.log('Selected table details:', {
        tablename: table.tablename,
        filename: table.filename,
        game: table.game,
        inputField: table.inputField // Add this to debug
      });

      const tableHeadersContainer = document.getElementById('tableHeaders');
      tableHeadersContainer.innerHTML = '';

      const tableNameTitle = document.createElement('h2');
      tableNameTitle.textContent = table.tablename ?? 'Unnamed Table';
      // Store the filename as a data attribute for clear identification
      tableNameTitle.dataset.filename = table.filename;
      tableNameTitle.dataset.game = table.game;
      tableHeadersContainer.appendChild(tableNameTitle);

      const details = [
        { key: 'game', label: 'Game' },
        { key: 'type', label: 'Type' },
        { key: 'setting', label: 'Setting' },
        { key: 'filename', label: 'Filename' } // Add filename to display for debugging
      ];

      details.forEach(detail => {
        if (table[detail.key]) {
          const detailDiv = document.createElement('div');
          detailDiv.className = 'header';
          detailDiv.textContent = `${detail.label}: ${table[detail.key]}`;
          tableHeadersContainer.appendChild(detailDiv);
        }
      });

      // Add input field if the table has inputField property
      if (table.inputField && Array.isArray(table.inputField) && table.inputField.length >= 2) {
        console.log('Creating input field for:', table.inputField); // Add debug log

        const inputFieldName = table.inputField[0];
        const inputFieldType = table.inputField[1];

        const inputContainer = document.createElement('div');
        inputContainer.className = 'header input-field-container';

        const inputLabel = document.createElement('label');
        inputLabel.textContent = `${inputFieldName}: `;
        inputLabel.htmlFor = `input-${inputFieldName}`;

        const inputElement = document.createElement('input');
        inputElement.id = `input-${inputFieldName}`;
        inputElement.name = inputFieldName;
        inputElement.className = 'table-input-field';

        // Set input type and default value based on specified type
        if (inputFieldType === 'number') {
          inputElement.type = 'number';
          inputElement.value = '0';
        } else {
          inputElement.type = 'text';
          inputElement.value = '';
        }

        inputContainer.appendChild(inputLabel);
        inputContainer.appendChild(inputElement);
        tableHeadersContainer.appendChild(inputContainer);
      } else {
        console.log('No input field found for this table', table); // Add debug log
      }

      document.getElementById('generationControls').style.display = 'block';
      document.getElementById('generationSlider').value = 1;
      document.getElementById('generationValue').textContent = 1;
    }

    function updateGenerationValue() {
      const generationSlider = document.getElementById('generationSlider');
      document.getElementById('generationValue').textContent = generationSlider.value;
    }

    function clearGeneratedList() {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';
    }

    function displayErrorMessage(message) {
      const resultsContainer = document.getElementById('results');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'generation-object';
      errorDiv.style.color = 'red';
      errorDiv.textContent = message;
      resultsContainer.appendChild(errorDiv);
    }

    function generateContent() {
      clearGeneratedList();

      const numberOfGenerations = document.getElementById('generationSlider').value;
      // Get the header element with the table name
      const tableHeader = document.querySelector('#tableHeaders h2');

      if (!tableHeader) {
        console.error('No table header found');
        displayErrorMessage('Error: No table selected for generation.');
        return;
      }

      // Get the filename and game from data attributes
      const selectedTableName = tableHeader.textContent;
      const selectedFileName = tableHeader.dataset.filename;
      const selectedGameName = tableHeader.dataset.game;

      console.log('Looking for table with:', {
        tablename: selectedTableName,
        filename: selectedFileName,
        game: selectedGameName
      });

      // Find the selected table using multiple criteria to ensure precision
      const selectedTable = tablesData.find(t => {
        // First try exact filename match (most reliable)
        if (selectedFileName && t.filename === selectedFileName) {
          console.log(`Found table by filename: ${t.filename}`);
          return true;
        }

        // If no filename match, try tablename + game
        if (t.tablename === selectedTableName && t.game === selectedGameName) {
          console.log(`Found table by name and game: ${t.tablename} (${t.game})`);
          return true;
        }

        return false;
      });

      if (!selectedTable) {
        console.error(`No matching table found for "${selectedTableName}" (${selectedFileName})`);
        displayErrorMessage(`Error: Table "${selectedTableName}" (${selectedFileName}) not found.`);
        return;
      }

      // Log full table details for debugging
      console.log('Selected table for generation:', {
        tablename: selectedTable.tablename,
        filename: selectedTable.filename,
        game: selectedTable.game
      });

      // Keep full table object for reference
      currentSelectedTable = selectedTable;

      // Reset contexts
      generationContexts = {};

      // Show loading indicator
      const resultsContainer = document.getElementById('results');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'generation-object';
      loadingDiv.id = 'loading-indicator';
      loadingDiv.textContent = 'Loading...';
      resultsContainer.appendChild(loadingDiv);

      // Collect input field values if present
      const inputValues = {};
      if (selectedTable.inputField && Array.isArray(selectedTable.inputField)) {
        const inputFieldName = selectedTable.inputField[0];
        const inputField = document.getElementById(`input-${inputFieldName}`);
        if (inputField) {
          // Convert to number if type is number, otherwise keep as string
          if (selectedTable.inputField[1] === 'number') {
            inputValues[inputFieldName] = parseFloat(inputField.value) || 0; // Default to 0 if parsing fails
          } else {
            inputValues[inputFieldName] = inputField.value;
          }
          console.log(`Added input field ${inputFieldName} with value:`, inputValues[inputFieldName]);
        } else {
          console.error(`Input field element not found for ${inputFieldName}`);
        }
      } else {
        console.log('No input field configured for this table', selectedTable);
      }

      // Send the complete table object to ensure proper identification
      fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          table: selectedTable,
          number: parseInt(numberOfGenerations),
          inputValues: inputValues
        })
      })
        .then(response => {
          // First remove the loading indicator
          document.getElementById('loading-indicator')?.remove();
          if (!response.ok) {
            return response.json().then(err => {
              throw new Error(`Server error: ${err.error || 'Unknown server error'}`);
            });
          }
          return response.json();
        })
        .then(data => {
          console.log("Received generation data:", data.results);
          if (!data.results || data.results.length === 0) {
            throw new Error('Server returned empty results');
          }

          const resultsContainer = document.getElementById('results');

          // For each generation, create a separate container
          data.results.forEach((result, index) => {
            // Initialize context for this generation
            generationContexts[index] = {};
            const generationContainer = document.createElement('div');
            generationContainer.className = 'generation-container';
            generationContainer.dataset.index = index;
            // Make it draggable
            generationContainer.draggable = true;
            generationContainer.addEventListener('dragstart', handleCardDragStart);
            generationContainer.addEventListener('dragend', handleCardDragEnd);

            // Create a title container with buttons
            const cardTitle = document.createElement('div');
            cardTitle.className = 'card-title';

            // Add the collapse button
            const collapseBtn = document.createElement('button');
            collapseBtn.className = 'collapse-btn';
            collapseBtn.onclick = (e) => {
              e.stopPropagation(); // Prevent card drag
              toggleCardCollapse(collapseBtn);
            };
            collapseBtn.innerHTML = `
            <span class="down-arrow">▼</span>
            <span class="up-arrow">▲</span>
          `;
            cardTitle.appendChild(collapseBtn);

            // Add the title text
            const titleText = document.createElement('span');
            titleText.className = 'card-title-text';
            // Extract first meaningful value for the title
            let firstValue = extractDisplayValueForTitle(result);
            firstValue = firstValue.trim();
            // Remove the truncation - let CSS handle it
            titleText.textContent = firstValue ?
              `${selectedTable.tablename || 'Result'} - ${firstValue}` :
              selectedTable.tablename || 'Result';
            cardTitle.appendChild(titleText);

            // Create buttons container
            const cardActions = document.createElement('div');
            cardActions.className = 'card-actions';

            // Add the Copy button
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.title = "Copy to Markdown"; // Add title attribute for hover text
            copyBtn.onclick = (e) => {
              e.stopPropagation(); // Prevent drag when clicking buttons
              copyToMarkdown(generationContainer);
            };
            copyBtn.innerHTML = `<img src="./Images/Icons/stack.png" alt="Copy" title="Copy to Markdown">`;
            cardActions.appendChild(copyBtn);

            // Add the Reroll All button
            const rerollAllBtn = document.createElement('button');
            rerollAllBtn.className = 'reroll-all-btn';
            rerollAllBtn.title = "Reroll All"; // Add title attribute for hover text
            rerollAllBtn.onclick = (e) => {
              e.stopPropagation(); // Prevent drag when clicking buttons
              rerollAllContent(generationContainer);
            };
            rerollAllBtn.innerHTML = `<img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll All" title="Reroll All">`;
            cardActions.appendChild(rerollAllBtn);

            // Add the Delete button (in the action bar instead of corner)
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-card-btn';
            deleteBtn.title = "Delete Card"; // Add title attribute for hover text
            deleteBtn.onclick = (e) => {
              e.stopPropagation(); // Prevent drag when clicking buttons
              deleteCard(generationContainer);
            };
            deleteBtn.innerHTML = `<img src="./Images/Icons/trash-can.png" alt="Delete" title="Delete Card">`;
            cardActions.appendChild(deleteBtn);

            // Add the actions to the card title
            cardTitle.appendChild(cardActions);
            generationContainer.appendChild(cardTitle);

            // Extract initial context from result
            extractContext(result, generationContexts[index]);

            // --- START: Modified Result Rendering for separateRows ---
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'card-content';

            // Check if the result itself is an array (from separateRows)
            if (Array.isArray(result)) {
              // If it's an array of results, render each one as a row
              result.forEach(subResult => {
                // Extract context from each sub-result
                extractContext(subResult, generationContexts[index]);
                // Render item, ensuring isTopLevel is false for subsequent items
                // Pass isNestedContent = true to prevent buttons on these inner rows
                contentWrapper.innerHTML += renderResultItem(subResult, false, index, true);
              });
              // Update the main card title based on the first sub-result
              if (result.length > 0) {
                let firstValue = extractDisplayValueForTitle(result[0]);
                firstValue = firstValue.trim();
                titleText.textContent = firstValue ?
                  `${selectedTable.tablename || 'Result'} - ${firstValue}` :
                  selectedTable.tablename || 'Result';
              }
            } else {
              // Original behavior: render the single result object
              extractContext(result, generationContexts[index]);
              contentWrapper.innerHTML = renderResultItem(result, true, index);
              // Update title based on this single result
              let firstValue = extractDisplayValueForTitle(result);
              firstValue = firstValue.trim();
              titleText.textContent = firstValue ?
                `${selectedTable.tablename || 'Result'} - ${firstValue}` :
                selectedTable.tablename || 'Result';
            }
            // --- END: Modified Result Rendering ---

            generationContainer.appendChild(contentWrapper);
            resultsContainer.appendChild(generationContainer);
          });
        })
        .catch(error => {
          console.error('Error generating content:', error);
          displayErrorMessage(`Error: ${error.message || 'Unable to generate content. Please try again later.'}`);
        });
    }

    function rerollContent(button) {
      if (!currentSelectedTable) {
        console.error('No table currently selected');
        return;
      }

      // Get the row containing this button
      const resultRow = button.closest('.result-row');
      if (!resultRow) {
        console.error('Could not find parent result row');
        return;
      }

      // Check if the row is locked
      if (resultRow.classList.contains('locked')) {
        console.log('This row is locked and cannot be rerolled');
        return;
      }

      // Get the header text to know what to reroll
      const header = resultRow.querySelector('.result-header').textContent;

      // Find which generation this belongs to
      const generationContainer = button.closest('.generation-container');
      if (!generationContainer) {
        console.error('Could not find parent generation container');
        return;
      }

      const generationIndex = generationContainer.dataset.index;
      const context = generationContexts[generationIndex] || {};

      // Collect input field values if present
      const inputValues = {};
      if (currentSelectedTable.inputField && Array.isArray(currentSelectedTable.inputField)) {
        const inputFieldName = currentSelectedTable.inputField[0];
        const inputField = document.getElementById(`input-${inputFieldName}`);
        if (inputField) {
          // Convert to number if type is number, otherwise keep as string
          if (currentSelectedTable.inputField[1] === 'number') {
            inputValues[inputFieldName] = parseFloat(inputField.value) || 0;
          } else {
            inputValues[inputFieldName] = inputField.value;
          }
          // Add the input value directly to the context
          context[inputFieldName] = inputValues[inputFieldName];
        }
      }

      // Get the format of the existing row to help with re-rendering
      const rowFormat = resultRow.getAttribute('data-format') || '';
      console.log(`Rerolling ${header} in table ${currentSelectedTable.filename} (format: ${rowFormat})`);
      console.log(`Context:`, context);

      // Show loading indicator in the row
      resultRow.style.opacity = '0.5';

      // Call the server to reroll just this item
      fetch('/api/reroll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          table: currentSelectedTable,
          header: header,
          context: context,
          inputValues: inputValues
        })
      })
        .then(response => response.json())
        .then(data => {
          console.log(`Received reroll response for ${header}:`, data);
          // Update the context if provided
          if (data.context) {
            Object.assign(context, data.context);
          }
          // Make sure we have data.result
          if (!data.result) {
            throw new Error('No result data returned from server');
          }

          try {
            // IMPORTANT: Clear all existing content divs first
            const contentDivs = resultRow.querySelectorAll('.result-content');
            contentDivs.forEach(div => div.remove());

            // Get reference to header div
            const headerDiv = resultRow.querySelector('.result-header');

            // Variables to store the new content value for the title update
            let newTitleValue = '';
            let shouldUpdateTitle = false;

            // First, check if this was a career-style row (from original format or from array structure)
            const isCareerRow = rowFormat === 'career' ||
              (Array.isArray(data.result.result) &&
                data.result.result.length === 2 &&
                typeof data.result.result[0] === 'string' &&
                typeof data.result.result[1] === 'string');

            // Career-style array handling (array with exactly two string elements)
            if (isCareerRow) {
              console.log('Processing career-style array:', data.result.result);
              let career, items;
              // Extract the two string values from the result
              if (Array.isArray(data.result.result) && data.result.result.length === 2) {
                // Normal array of two strings
                [career, items] = data.result.result;
              } else if (typeof data.result.result === 'object' && data.result.result.career && data.result.result.items) {
                // Object with career and items properties
                career = data.result.result.career;
                items = data.result.result.items;
              } else if (typeof data.result.result === 'string') {
                // Split string result if needed (fallback)
                const parts = data.result.result.split(',');
                career = parts[0];
                items = parts.slice(1).join(',');
              } else {
                console.error('Unexpected career format:', data.result.result);
                career = "Unknown Career";
                items = "Unknown Items";
              }

              // Create first content div for career
              const careerDiv = document.createElement('div');
              careerDiv.className = 'result-content';
              careerDiv.textContent = career;
              careerDiv.title = career;
              headerDiv.insertAdjacentElement('afterend', careerDiv);

              // Create second content div for items
              const itemsDiv = document.createElement('div');
              itemsDiv.className = 'result-content';
              itemsDiv.textContent = items;
              itemsDiv.title = items;
              careerDiv.insertAdjacentElement('afterend', itemsDiv);

              // Update the row's format attribute
              resultRow.setAttribute('data-format', 'career');

              // Update context with the array
              context[header] = [career, items];

              // Use career for title update if this is the first row
              if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = career;
                shouldUpdateTitle = true;
              }
            }
            // Simple string handling
            else if (typeof data.result.result === 'string' || typeof data.result.result === 'number') {
              // This handles most simple cases
              console.log('Processing simple string value:', data.result.result);
              const stringValue = String(data.result.result);
              const contentDiv = document.createElement('div');
              contentDiv.className = 'result-content';
              contentDiv.textContent = stringValue;
              contentDiv.title = stringValue;
              headerDiv.insertAdjacentElement('afterend', contentDiv);

              // Update context with the string value
              context[header] = stringValue;

              // Only update title if this is the first row
              if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = stringValue;
                shouldUpdateTitle = true;
              }
            }
            // Regular array handling (non-career arrays)
            else if (Array.isArray(data.result.result)) {
              console.log('Processing array format:', data.result.result);

              // Special case for weighted arrays [value, weight]
              if (data.result.result.length === 2 &&
                typeof data.result.result[0] === 'string' &&
                typeof data.result.result[1] === 'number') {
                const value = data.result.result[0];
                const contentDiv = document.createElement('div');
                contentDiv.className = 'result-content';
                contentDiv.textContent = value;
                contentDiv.title = value;
                headerDiv.insertAdjacentElement('afterend', contentDiv);

                // Update context with just the value
                context[header] = value;

                // Check if this is the first row
                if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                  newTitleValue = value;
                  shouldUpdateTitle = true;
                }
              }
              // Normal array case
              else {
                // Process each array element and create corresponding content divs
                let resultValues = [];
                let lastInsertedDiv = headerDiv;

                // Loop through array items (limit to max 4)
                const maxItems = Math.min(data.result.result.length, 4);
                for (let i = 0; i < maxItems; i++) {
                  let arrayValue;
                  // Handle nested weighted arrays
                  if (Array.isArray(data.result.result[i]) &&
                    data.result.result[i].length === 2 &&
                    typeof data.result.result[i][0] === 'string' &&
                    typeof data.result.result[i][1] === 'number') {
                    arrayValue = data.result.result[i][0]; // Just take the value
                  } else {
                    arrayValue = String(data.result.result[i] || '');
                  }

                  resultValues.push(arrayValue);
                  const contentDiv = document.createElement('div');
                  contentDiv.className = 'result-content';
                  contentDiv.textContent = arrayValue;
                  contentDiv.title = arrayValue;
                  lastInsertedDiv.insertAdjacentElement('afterend', contentDiv);
                  lastInsertedDiv = contentDiv;
                }

                // Update context with the array
                context[header] = resultValues;

                // Use first array element for title update if this is the first row
                if (resultValues.length > 0 && resultRow === generationContainer.querySelector('.result-row:first-child')) {
                  newTitleValue = resultValues[0];
                  shouldUpdateTitle = true;
                }
              }
            }
            // Object result handling
            else if (typeof data.result.result === 'object' && data.result.result !== null) {
              console.log('Processing object result:', data.result);

              let extractedValue = "";
              // Try to extract a usable string value from the object
              // First, look for a 'result' property in the nested result
              if (typeof data.result.result.result === 'string') {
                extractedValue = data.result.result.result;
              }
              // Otherwise look for any string property that's not special (starts with _)
              else {
                for (const key in data.result.result) {
                  if (typeof data.result.result[key] === 'string' && !key.startsWith('_')) {
                    extractedValue = data.result.result[key];
                    break;
                  }
                }
              }
              // If nothing found in nested result, check top level
              if (!extractedValue && typeof data.result === 'object') {
                for (const key in data.result) {
                  if (typeof data.result[key] === 'string' && !key.startsWith('_') && key !== 'header') {
                    extractedValue = data.result[key];
                    break;
                  }
                }
              }
              // If still no value found, use a generic message
              if (!extractedValue) {
                extractedValue = "No string value found";
                console.warn('Could not extract string value from result:', data.result);
              }

              // Create the content div with the extracted value
              const contentDiv = document.createElement('div');
              contentDiv.className = 'result-content';
              contentDiv.textContent = extractedValue;
              contentDiv.title = extractedValue;
              headerDiv.insertAdjacentElement('afterend', contentDiv);

              // Update context with the string value
              context[header] = extractedValue;

              // Use extracted value for title update if this is the first row
              if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = extractedValue;
                shouldUpdateTitle = true;
              }
            }
            // Fallback for any other type
            else {
              console.log('Using fallback handling for result:', data.result);
              const resultStr = JSON.stringify(data.result.result);
              const contentDiv = document.createElement('div');
              contentDiv.className = 'result-content';
              contentDiv.textContent = resultStr;
              contentDiv.title = resultStr;
              headerDiv.insertAdjacentElement('afterend', contentDiv);

              // Update context with the string value
              context[header] = resultStr;

              // Use extracted value for title update if this is the first row
              if (resultRow === generationContainer.querySelector('.result-row:first-child')) {
                newTitleValue = resultStr;
                shouldUpdateTitle = true;
              }
            }

            // UPDATE CARD TITLE if appropriate
            if (newTitleValue && newTitleValue.trim() && shouldUpdateTitle) {
              updateCardTitle(generationContainer, newTitleValue);
            }

            // Always reset opacity
            resultRow.style.opacity = '1';
          } catch (error) {
            console.error('Error processing reroll result:', error);
            console.error('Data that caused error:', data);
            resultRow.style.opacity = '1';
            alert(`Error processing result: ${error.message}`);
          }
        })
        .catch(error => {
          console.error('Error rerolling content:', error);
          resultRow.style.opacity = '1';
          alert('Failed to reroll content. Please try again.');
        });
    }

    function rerollAllContent(generationContainer) {
      if (!currentSelectedTable) {
        console.error('No table currently selected');
        return;
      }

      // Store the collapsed state
      const wasCollapsed = generationContainer.classList.contains('collapsed');

      // Find all unlocked rows that need to be rerolled
      const unlockedRows = generationContainer.querySelectorAll('.result-row:not(.locked)');
      if (unlockedRows.length === 0) {
        console.log('No unlocked rows to reroll');
        showToast('No unlocked rows to reroll');
        return;
      }

      // Pre-process and cache all locked rows BEFORE starting any rerolls
      const lockedRowsCache = {};
      const lockedRows = generationContainer.querySelectorAll('.result-row.locked');
      lockedRows.forEach(row => {
        const header = row.querySelector('.result-header').textContent;
        const contentElements = row.querySelectorAll('.result-content');

        // Store content based on row format
        const format = row.getAttribute('data-format');
        if (format === 'career' && contentElements.length >= 2) {
          lockedRowsCache[header] = [
            contentElements[0].textContent,
            contentElements[1].textContent
          ];
        } else if (format === 'multi-array') {
          lockedRowsCache[header] = Array.from(contentElements).map(el => el.textContent);
        } else {
          lockedRowsCache[header] = contentElements.length > 0 ? contentElements[0].textContent : '';
        }

        // Also capture the DOM elements to help with restoration
        lockedRowsCache[header + '_elements'] = {
          row: row,
          format: format,
          contentElements: contentElements
        };

        console.log(`Cached locked row "${header}" with format ${format}`);
      });

      // Check if the first row is locked (to prevent title updates)
      const firstRow = generationContainer.querySelector('.result-row:first-child');
      const isFirstRowLocked = firstRow && firstRow.classList.contains('locked');

      console.log(`Rerolling ${unlockedRows.length} unlocked rows in card (${lockedRows.length} locked rows will be preserved)`);

      // Get the generation index for context access
      const generationIndex = generationContainer.dataset.index;
      const context = generationContexts[generationIndex] || {};

      // Track progress for sequential rerolling
      let currentIndex = 0;
      let rerollFailed = false;

      // Show loading indicator
      generationContainer.style.opacity = '0.6';

      // Process rows sequentially to maintain context between them
      function processNextRow() {
        if (currentIndex >= unlockedRows.length || rerollFailed) {
          // All rows processed or an error occurred
          generationContainer.style.opacity = '1';
          // Restore collapsed state if needed
          if (wasCollapsed) {
            generationContainer.classList.add('collapsed');
          }

          // Update the card title based on the first row's content
          // ONLY if the first row isn't locked
          if (!isFirstRowLocked) {
            updateCardTitleFromFirstRow(generationContainer);
          }

          return;
        }

        const row = unlockedRows[currentIndex];
        const rerollButton = row.querySelector('.reroll-btn');

        if (rerollButton) {
          // Use the existing reroll function to maintain context properly
          try {
            // Set up a one-time event listener to know when this reroll finishes
            const observer = new MutationObserver((mutations, obs) => {
              // Check if the row's opacity has been reset, signaling the reroll is complete
              if (row.style.opacity === '1') {
                obs.disconnect();
                currentIndex++;
                setTimeout(processNextRow, 50); // Small delay between rerolls for stability
              }
            });
            observer.observe(row, {
              attributes: true,
              attributeFilter: ['style']
            });

            // Trigger the reroll
            rerollContent(rerollButton);
          } catch (error) {
            console.error('Error rerolling row:', error);
            rerollFailed = true;
            currentIndex++;
            setTimeout(processNextRow, 50);
          }
        } else {
          // Skip this row if it doesn't have a reroll button
          currentIndex++;
          setTimeout(processNextRow, 50);
        }
      }

      // Start the sequential rerolling process
      processNextRow();
    }

    function updateCardTitle(container, newValue) {
      newValue = newValue.trim();
      // Remove the hardcoded truncation - let CSS handle it
      const titleText = container.querySelector('.card-title-text');
      if (titleText) {
        titleText.textContent = `${currentSelectedTable.tablename || 'Result'} - ${newValue}`;
        // Using the full text and letting CSS truncate
      }
    }

    function updateCardTitleFromFirstRow(generationContainer) {
      const firstRow = generationContainer.querySelector('.result-row:first-child');
      if (!firstRow) return;
      // Skip title update if the first row is locked
      if (firstRow.classList.contains('locked')) {
        return;
      }

      // Get content from the first row
      let titleValue = '';

      // Handle different row formats
      const format = firstRow.getAttribute('data-format');
      const contentElements = firstRow.querySelectorAll('.result-content');
      if (format === 'career' && contentElements.length >= 1) {
        // For career format, use the career name (first content cell)
        titleValue = contentElements[0].textContent;
      } else if (contentElements.length > 0) {
        // For other formats, use the first content cell
        titleValue = contentElements[0].textContent;
      }

      // Update the title if we found content
      if (titleValue && titleValue.trim()) {
        updateCardTitle(generationContainer, titleValue);
      }
    }

    function copyToMarkdown(generationContainer) {
      let markdown = '';

      // Get the main table information
      let mainTableName = '';
      let mainTableDisplayName = '';
      if (currentSelectedTable) {
        // Get table name from filename (without extension) for references
        if (currentSelectedTable.filename) {
          mainTableName = currentSelectedTable.filename.replace(/\.(yaml|yml)$/, '');
        }
        // Get the display name from the tablename property
        mainTableDisplayName = currentSelectedTable.tablename || '';
      }

      // Extract all the rows
      const rows = generationContainer.querySelectorAll('.result-row');
      const rowFormat = rows.length > 0 ? rows[0].getAttribute('data-format') : '';

      // Helper function to normalize strings for comparison
      const normalize = str => str.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/gi, '');

      // Process each row
      rows.forEach(row => {
        const header = row.querySelector('.result-header').textContent;
        const contentCells = row.querySelectorAll('.result-content');

        // Start building the markdown line for this row
        let rowMd = `*${header}*: `;

        // Handle career format - detect by format attribute
        if (rowFormat === 'career' && contentCells.length >= 2) {
          // Career format - first cell is career, second cell is items
          const career = contentCells[0].textContent.trim();
          const items = contentCells[1].textContent.trim();
          rowMd += `${career} - ${items}`;
        }
        // Handle general array format with multiple cells
        else if (contentCells.length > 1) {
          const cellTexts = Array.from(contentCells).map(cell => cell.textContent.trim());
          // Join all cells with commas
          rowMd += cellTexts.join(', ');
        }
        else if (contentCells.length === 1) {
          // Normal case - single content cell
          rowMd += contentCells[0].textContent.trim();
        }

        // Check if this is a root table reference
        // Compare the normalized header with the normalized tablename
        const normalizedHeader = normalize(header);
        const normalizedTableName = normalize(mainTableDisplayName);
        const isRootTableReference = normalizedHeader === normalizedTableName;

        // Add table reference
        if (mainTableName) {
          if (isRootTableReference) {
            // Simplified format for root table references
            rowMd += `.:{${mainTableName}}`;
          } else {
            // Full format for subtable references
            rowMd += `.:{${mainTableName}|${header}}`;
          }
        }

        markdown += rowMd + '\n';
      });

      // Copy to clipboard
      navigator.clipboard.writeText(markdown)
        .then(() => {
          showToast('Copied to clipboard!');
        })
        .catch(err => {
          console.error('Failed to copy text: ', err);
          showToast('Failed to copy to clipboard');
        });
    }

    function showToast(message, duration = 2000) {
      // Check if a toast already exists
      let toast = document.querySelector('.toast-message');

      // If not, create one
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast-message';
        document.body.appendChild(toast);
      }

      // Update the toast message
      toast.textContent = message;
      toast.classList.add('toast-visible');

      // Hide the toast after duration
      setTimeout(() => {
        toast.classList.remove('toast-visible');
      }, duration);
    }

    function handleCardDragStart(e) {
      // Only allow dragging from the title area, not the buttons
      if (e.target.closest('.reroll-all-btn, .copy-btn, .delete-card-btn')) {
        e.preventDefault();
        return;
      }

      // Check if the card is in the saved area and prevent dragging within saved area
      const inSavedArea = this.closest('#savedGenerations');
      if (inSavedArea) {
        e.preventDefault();
        return;
      }

      e.dataTransfer.setData('text/plain', this.dataset.index);
      this.classList.add('card-being-dragged');

      // Allow the card to be copied to the saved area
      e.dataTransfer.effectAllowed = 'copy';
    }

    function handleCardDragEnd(e) {
      this.classList.remove('card-being-dragged');

      // Remove highlight from drop targets
      document.querySelectorAll('.drop-target-highlight').forEach(el => {
        el.classList.remove('drop-target-highlight');
      });
    }

    function deleteCard(card) {
      if (confirm('Are you sure you want to delete this card?')) {
        card.remove();
        showToast('Card deleted');
      }
    }

    function toggleCardCollapse(button) {
      const card = button.closest('.generation-container');
      card.classList.toggle('collapsed');

      // Update the button icon (though CSS will hide/show the appropriate one)
      const isCollapsed = card.classList.contains('collapsed');

      // Optional: Scroll to the card if expanding
      if (!isCollapsed) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function extractDisplayValueForTitle(resultObj) {
      // Handle arrays by looking at first item
      if (Array.isArray(resultObj)) {
        return resultObj.length > 0 ? extractDisplayValueForTitle(resultObj[0]) : '';
      }

      // If it's an object with header and result properties
      if (resultObj && typeof resultObj === 'object' && resultObj.result !== undefined) {
        // Check for simple string result
        if (typeof resultObj.result === 'string') {
          return resultObj.result;
        }
        // Recurse into nested result structure
        return extractDisplayValueForTitle(resultObj.result);
      }

      // Special handling for ShadowDark NPCs - look for the name field
      if (resultObj && typeof resultObj === 'object' && resultObj.result && Array.isArray(resultObj.result)) {
        // Try to find the NPC Names entry
        const nameEntry = resultObj.result.find(item =>
          item && typeof item === 'object' && item.header === 'NPC Names by Ancestry');

        if (nameEntry) {
          return nameEntry.result;
        }
      }

      // If it's a simple value, return it as string
      return resultObj ? String(resultObj) : '';
    }

    function renderResultItem(item, isTopLevel = true, generationIndex = 0, isNestedContent = false) {
      // Add support for table-level descriptions and title descriptions
      let descriptionHTML = '';
      let titleDescriptionHTML = '';
      if (isTopLevel) {
        // Add title description if present
        if (item && item._titleDescription) {
          titleDescriptionHTML = `<div class="title-description">${item._titleDescription}</div>`;
        }

        // Standard description
        if (item && item._description) {
          descriptionHTML = `<div class="table-description">${item._description}</div>`;
        }
      }

      // Special handling for career format flagged by the server
      if (item && typeof item === 'object' && item._isCareer === true && Array.isArray(item.result)) {
        const headerTitle = item.header ? item.header.replace(/"/g, '"') : '';
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';

        const career = item.result[0] || '';
        const items = item.result[1] || '';

        // Escape values for HTML attributes
        const careerEscaped = career.replace(/"/g, '"');
        const itemsEscaped = items.replace(/"/g, '"');

        const buttonGroup = !isNestedContent ? `
          <div class="button-group">
            <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
              <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
            </button>
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>
          </div>` : '';

        const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';

        return `
          ${isTopLevel ? titleDescriptionHTML : ''}
          ${isTopLevel ? descriptionHTML : ''}
          <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="career">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            <div class="result-content" title="${careerEscaped}">${career}</div>
            <div class="result-content" title="${itemsEscaped}">${items}</div>
            ${buttonGroup}
          </div>
          ${rowDescription}
        `;
      }

      // Continue with existing case for multi-element array format
      if (item && typeof item === 'object' && item._isMultiElementArray === true && Array.isArray(item.result)) {
        const headerTitle = item.header ? item.header.replace(/"/g, '"') : '';
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';

        const contentCells = item.result.map(element => {
          const valueStr = String(element || '');
          const escapedValue = valueStr.replace(/"/g, '"');
          return `<div class="result-content" title="${escapedValue}">${valueStr}</div>`;
        }).join('');

        const buttonGroup = !isNestedContent ? `
          <div class="button-group">
            <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
              <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
            </button>
            <button class="reroll-btn" onclick="rerollContent(this)">
              <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
            </button>
          </div>` : '';

        const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';

        return `
          ${isTopLevel ? titleDescriptionHTML : ''}
          ${isTopLevel ? descriptionHTML : ''}
          <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="multi-array">
            <div class="result-header" title="${headerTitle}">${item.header}</div>
            ${contentCells}
            ${buttonGroup}
          </div>
          ${rowDescription}
        `;
      }

      // Continue with existing standard value handling
      if (item && typeof item === 'object' && "header" in item && "result" in item) {
        const originalSource = item._originalSource || item._tableName || '';
        const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
        const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
        const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';
        const headerTitle = item.header ? item.header.replace(/"/g, '"') : '';

        // Handle different result types, starting with standard string/number
        if (typeof item.result === 'string' || typeof item.result === 'number') {
          const resultStr = String(item.result);
          const escapedResult = resultStr.replace(/"/g, '"');

          const buttonGroup = !isNestedContent ? `
            <div class="button-group">
              <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
                <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
              </button>
              <button class="reroll-btn" onclick="rerollContent(this)">
                <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
              </button>
            </div>` : '';

          const rowDescription = item._description ? `<div class="row-description">${item._description}</div>` : '';

          return `
            ${isTopLevel ? titleDescriptionHTML : ''}
            ${isTopLevel ? descriptionHTML : ''}
            <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="simple">
              <div class="result-header" title="${headerTitle}">${item.header}</div>
              <div class="result-content" title="${escapedResult}">${resultStr}</div>
              ${buttonGroup}
            </div>
            ${rowDescription}
          `;
        }

        // For arrays of objects (nested results)
        if (Array.isArray(item.result) &&
          item.result.some(el => typeof el === 'object' && el !== null)) {
          // Add the parent description if we're at the top level
          let output = isTopLevel ? titleDescriptionHTML + descriptionHTML : '';
          // Process each nested result item
          item.result.forEach(subItem => {
            output += renderResultItem(subItem, false, generationIndex);
          });

          return output;
        }
      }

      // For arrays of strings (e.g. SeparateRows)
      if (Array.isArray(item.result) && item.result.length > 0 && typeof item.result[0] === 'string') {
        let output = isTopLevel ? titleDescriptionHTML + descriptionHTML : '';
        item.result.forEach(str => {
          // Construct a simple result object for this string to leverage existing logic?
          // Or just manually build HTML.
          // Manually building is safer to avoid deeper recursion weirdness.

          const originalSource = item._originalSource || item._tableName || '';
          const sourceTable = originalSource ? ` data-source-table="${originalSource}"` : '';
          const sourceTableName = item._tableName ? ` data-table-name="${item._tableName}"` : '';
          const subtableName = item.header !== item._tableName ? ` data-subtable-name="${item.header}"` : '';
          const headerTitle = item.header ? item.header.replace(/"/g, '"') : '';

          const resultStr = String(str);
          const escapedResult = resultStr.replace(/"/g, '"');

          const buttonGroup = !isNestedContent ? `
             <div class="button-group">
               <button class="lock-btn" onclick="toggleRowLock(this)" title="Lock/Unlock this result">
                 <img src="./Images/Icons/padlock-open.png" alt="Unlock" title="Lock/Unlock this result">
               </button>
               <button class="reroll-btn" onclick="rerollContent(this)">
                 <img src="./Images/Icons/perspective-dice-six-faces-random.png" alt="Reroll" title="Reroll">
               </button>
             </div>` : '';

          output += `
             <div class="result-row"${sourceTable}${sourceTableName}${subtableName} data-format="simple">
               <div class="result-header" title="${headerTitle}">${item.header}</div>
               <div class="result-content" title="${escapedResult}">${resultStr}</div>
               ${buttonGroup}
             </div>
           `;
        });
        return output;
      }

      // For primitive values and fallback
      return item !== undefined && item !== null ? String(item) : '';
    }

    function toggleRowLock(button) {
      const row = button.closest('.result-row');
      if (!row) return;

      row.classList.toggle('locked');

      // Update the lock icon
      const lockImage = button.querySelector('img');
      if (row.classList.contains('locked')) {
        lockImage.src = './Images/Icons/padlock.png';
        lockImage.alt = 'Locked';
        lockImage.title = 'Unlock this result';
      } else {
        lockImage.src = './Images/Icons/padlock-open.png';
        lockImage.alt = 'Unlocked';
        lockImage.title = 'Lock this result';
      }
    }

    function showTableContent() {
      if (!currentSelectedTable) {
        console.error('No table currently selected');
        displayErrorMessage('Error: No table selected to display.');
        return;
      }

      // Clear existing content
      clearGeneratedList();

      // Show loading indicator
      const resultsContainer = document.getElementById('results');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'generation-object';
      loadingDiv.id = 'loading-indicator';
      loadingDiv.textContent = 'Loading table structure...';
      resultsContainer.appendChild(loadingDiv);

      // Fetch the table structure - FIXED: use table-contents instead of table-structure
      fetch('/api/table-contents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: currentSelectedTable })
      })
        .then(response => {
          // First remove the loading indicator
          document.getElementById('loading-indicator')?.remove();

          // Check for content type to detect HTML error pages
          const contentType = response.headers.get('content-type');
          if (contentType && contentType.indexOf('application/json') === -1) {
            throw new Error(`Server returned non-JSON response (${contentType}). The API endpoint might be missing or unavailable.`);
          }
          if (!response.ok) {
            return response.text().then(text => {
              try {
                const data = JSON.parse(text);
                throw new Error(`Server error: ${data.error || 'Unknown server error'}`);
              } catch (e) {
                throw new Error(`Server error: Response code ${response.status}`);
              }
            });
          }

          return response.json();
        })
        .then(data => {
          // FIXED: Change data.structure to data.tableData to match the server response format
          if (!data.tableData) {
            throw new Error('No table structure returned from server');
          }

          // Create a container for the table display
          const tableContainer = document.createElement('div');
          tableContainer.className = 'generation-container table-display';

          // Add title
          const cardTitle = document.createElement('div');
          cardTitle.className = 'card-title';

          // Add title text
          const titleText = document.createElement('span');
          titleText.className = 'card-title-text';
          titleText.textContent = `Table: ${currentSelectedTable.tablename || 'Unnamed Table'}`;
          cardTitle.appendChild(titleText);

          // Add buttons
          const cardActions = document.createElement('div');
          cardActions.className = 'card-actions';

          // Add the Copy button
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.title = "Copy to Markdown";
          copyBtn.onclick = (e) => {
            e.stopPropagation();
            copyTableToMarkdown(tableContainer);
          };
          copyBtn.innerHTML = `<img src="./Images/Icons/stack.png" alt="Copy" title="Copy to Markdown">`;
          cardActions.appendChild(copyBtn);

          // Add the delete button
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-card-btn';
          deleteBtn.title = "Close Table View";
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            tableContainer.remove();
          };
          deleteBtn.innerHTML = `<img src="./Images/Icons/trash-can.png" alt="Close" title="Close Table View">`;
          cardActions.appendChild(deleteBtn);

          cardTitle.appendChild(cardActions);
          tableContainer.appendChild(cardTitle);

          // Add collapse button
          const collapseBtn = document.createElement('button');
          collapseBtn.className = 'collapse-btn';
          collapseBtn.onclick = (e) => {
            e.stopPropagation();
            toggleCardCollapse(collapseBtn);
          };
          collapseBtn.innerHTML = `
          <span class="down-arrow">▼</span>
          <span class="up-arrow">▲</span>
        `;
          tableContainer.appendChild(collapseBtn);

          // Add card content
          const contentWrapper = document.createElement('div');
          contentWrapper.className = 'card-content';

          // FIXED: Adapt to the server response format
          const tableData = data.tableData;

          // Add table description if present
          if (tableData.description) {
            const descriptionDiv = document.createElement('div');
            descriptionDiv.className = 'table-description';
            descriptionDiv.textContent = tableData.description;
            contentWrapper.appendChild(descriptionDiv);
          }

          // Display table entries
          const entriesDiv = document.createElement('div');
          entriesDiv.className = 'table-entries';

          // Process main table entries
          if (tableData.subtables && tableData.subtables.length > 0) {
            // If the first subtable is called "Main Results", treat it as the main table
            const mainTable = tableData.subtables.find(t => t.name === "Main Results") || tableData.subtables[0];
            processTableEntries(entriesDiv, mainTable);
            // Add other subtables
            tableData.subtables.forEach(subtable => {
              // Skip the main table we already processed
              if (subtable === mainTable) return;

              const subtableContainer = document.createElement('div');
              subtableContainer.className = 'subtable-container';

              // Add subtable header
              const subtableHeader = document.createElement('div');
              subtableHeader.className = 'subtable-header';
              subtableHeader.textContent = subtable.name;
              subtableContainer.appendChild(subtableHeader);

              // Add subtable description if present
              if (subtable.description) {
                const subtableDesc = document.createElement('div');
                subtableDesc.className = 'subtable-description';
                subtableDesc.textContent = subtable.description;
                subtableContainer.appendChild(subtableDesc);
              }

              // Process subtable entries
              processTableEntries(subtableContainer, subtable);
              // Handle nested subtables if present
              if (subtable.nestedSubtables && subtable.nestedSubtables.length > 0) {
                const nestedSubtables = document.createElement('div');
                nestedSubtables.className = 'nested-subtables';
                subtable.nestedSubtables.forEach(nestedTable => {
                  const nestedContainer = document.createElement('div');
                  nestedContainer.className = 'subtable-container';

                  // Add nested subtable header
                  const nestedHeader = document.createElement('div');
                  nestedHeader.className = 'subtable-header';
                  nestedHeader.textContent = nestedTable.name;
                  nestedContainer.appendChild(nestedHeader);

                  // Add nested subtable description if present
                  if (nestedTable.description) {
                    const nestedDesc = document.createElement('div');
                    nestedDesc.className = 'subtable-description';
                    nestedDesc.textContent = nestedTable.description;
                    nestedContainer.appendChild(nestedDesc);
                  }

                  // Process nested subtable entries
                  processTableEntries(nestedContainer, nestedTable);

                  nestedSubtables.appendChild(nestedContainer);
                });
                subtableContainer.appendChild(nestedSubtables);
              }

              entriesDiv.appendChild(subtableContainer);
            });
          } else {
            // No subtables, just process the main table
            processTableEntries(entriesDiv, tableData);
          }

          contentWrapper.appendChild(entriesDiv);
          tableContainer.appendChild(contentWrapper);

          // Add the table display to the results container
          resultsContainer.appendChild(tableContainer);
        })
        .catch(error => {
          console.error('Error displaying table structure:', error);

          // Show a helpful message if the API might not exist
          if (error.message && error.message.includes('non-JSON response')) {
            displayErrorMessage('The table structure API endpoint (/api/table-contents) appears to be missing. Make sure the server supports this feature.');
          } else {
            displayErrorMessage(`Error: ${error.message || 'Unable to display table structure.'}`);
          }
        });
    }

    function processTableEntries(container, tableData) {
      // FIXED: Use either results or entries depending on what's available
      const entries = tableData.results || tableData.entries || [];
      if (entries && entries.length > 0) {
        entries.forEach((entry, index) => {
          const entryDiv = document.createElement('div');
          entryDiv.className = 'table-entry';

          // Add entry number/index
          const entryNumDiv = document.createElement('div');
          entryNumDiv.className = 'entry-number';
          entryNumDiv.textContent = (index + 1) + '.';
          entryDiv.appendChild(entryNumDiv);

          // Add content based on type
          const entryContentDiv = document.createElement('div');
          entryContentDiv.className = 'entry-content';

          // FIXED: Handle entries from the server's format
          let displayValue, weight;
          if (entry && typeof entry === 'object') {
            // Handle different object formats
            if (entry.isCareer) {
              // Career format from server
              const careerDiv = document.createElement('div');
              careerDiv.className = 'career-entry';

              const careerName = document.createElement('span');
              careerName.className = 'career-name';
              careerName.textContent = entry.career || '';

              const careerItems = document.createElement('span');
              careerItems.className = 'career-items';
              careerItems.textContent = ' - ' + (entry.items || '');

              careerDiv.appendChild(careerName);
              careerDiv.appendChild(careerItems);
              entryContentDiv.appendChild(careerDiv);
            } else if (entry.isWeighted) {
              // Weighted entry from server
              displayValue = entry.value;
              weight = entry.weight;
              entryContentDiv.textContent = typeof displayValue === 'object' ?
                JSON.stringify(displayValue) : String(displayValue || '');
            } else if (entry.value !== undefined) {
              // Simple value object
              displayValue = entry.value;
              entryContentDiv.textContent = typeof displayValue === 'object' ?
                JSON.stringify(displayValue) : String(displayValue || '');
            } else {
              // Unknown object format
              entryContentDiv.textContent = JSON.stringify(entry);
            }
          } else if (Array.isArray(entry)) {
            // Handle arrays - career or weighted format
            if (entry.length === 2 && typeof entry[0] === 'string' && typeof entry[1] === 'string') {
              // Career format [career, items]
              const careerDiv = document.createElement('div');
              careerDiv.className = 'career-entry';
