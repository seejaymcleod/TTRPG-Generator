- id: sk_apex_slannethiss
  name: Slannethiss
  type: Monster
  stage: Apex
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Large Beast, Unaligned, Aggressive
    flavor: As the tide recedes, a large shell rises out of a tidal pool. The Slannethiss is a terrifying apex predator of the strands.
    bio:
      class: Amphibia
      genus: Derived Evolution - Eurycea
      niche: Amphibious Apex Carnivore
      biome: The Strands (Coastal)
    ecology:
      preyed_upon_by: Arkiopti, Daugon, Illithisk, Goliarch, Nicalliath, Sacrissian, Vinnirex
      preys_on: None (Apex)
    taming:
      bond: "Control 9"
      maturity: 25 Seasons
    ac: "17"
    hp: 114 (12d10 + 48)
    speed: 50 ft., swim 60 ft.
    initiative: +7 (17)
    attributes:
      str: { score: 20, mod: "+5", save: "+5" }
      dex: { score: 24, mod: "+7", save: "+11" }
      con: { score: 19, mod: "+4", save: "+4" }
      int: { score: 9, mod: "-1", save: "-1" }
      wis: { score: 21, mod: "+5", save: "+9" }
      cha: { score: 14, mod: "+2", save: "+2" }
    skills: Acrobatics +11, Perception +9, Stealth +11
    immunities: Blindness, Charmed, Frightened
    resistances: Lightning, Slashing
    vulnerabilities: Thunder
    senses: Truesight 60 ft., Passive Perception 19
    challenge: { rating: "11", xp: "7,200", pb: "4" }
    traits:
      - name: Legendary Resistance (2/Day)
        desc: If the slannethiss fails a Saving Throw, it can choose to succeed instead.
      - name: Amphibious
        desc: The slannethiss can breathe both air and water.
      - name: Sensory Horned
        desc: Advantage on Wisdom (Perception) checks. While underwater, knows exact location of any creature within 100 ft.
      - name: Shoreline Stalker
        desc: Advantage on Dexterity (Stealth) checks in Strands. Hide as Bonus Action.
      - name: Wickedly Fast
        desc: Opportunity attacks against the slannethiss are made with Disadvantage.
      - name: Slippery
        desc: If succeeding on Dex save for half damage, takes no damage instead.
    actions:
      - name: Multiattack
        desc: Makes three attacks using Crushing Tarsus, Heaving Bulk, Mandible Bite or Viscous Webbing in any combination.
      - name: Grasping Talons
        desc: "Melee: +11 to hit, 5 ft. Hit: 28 (6d6+7) Slashing. DC 16 Dex Save or Grappled (Escape DC 17). Can grapple two creatures."
      - name: Twisting Bite
        desc: "Melee: +11 to hit, 5 ft. Hit: 32 (5d10+5) Piercing. DC 17 Str Save or 22 (4d10) Slashing damage."
      - name: Slapping Tail
        desc: "Melee: +9 to hit, 10 ft. Hit: 16 (2d10+5) Piercing. DC 15 Str Save or Pushed 5 ft and Prone."
    reactions:
      - name: Redirecting Charge
        desc: "Trigger: Creature sees hit with Lightning attack. Response: Con Save DC 5 + damage. Success: Redirects to another creature within 30 ft."
    legendary_actions:
      - name: Quick Slash
        desc: Makes one Grasping Talons attack.
      - name: Slither Step
        desc: Moves up to half speed without provoking Opportunity Attacks.
      - name: Violent Instincts
        desc: "If grappling, slams creature against stone. DC 16 Str Save. Failure: 11 (2d10) Bludgeoning."
    lair_actions:
      - name: Slinking into Shadow
        desc: Ranged attacks against it are Disadvantage until next turn.
      - name: Tunnels in the Strands
        desc: "Disappears into crevice, reappears in space within 60 ft."
      - name: Choice Corals
        desc: "Throws coral cluster at enemy within 30 ft. DC 14 Con Save or Paralyzed."
      - name: Salt and Grit
        desc: "Swipes tail into sand. 20 ft cone. DC 13 Dex Save or Blinded."
    regional_effects:
      - name: Scant Predators
        desc: Clears out most megafauna within 6 miles of Lair.
      - name: Nature Unbalanced
        desc: Small herbivores flourish within 5 miles.
      - name: Fear's Shroud
        desc: Creatures within 4 miles feel fear. Disadvantage on Saves against Frightened.
      - name: Tremor in the Water
        desc: Creatures in water 1 mile out must make DC 16 Stealth check to avoid detection.
    crafting:
      - { type: Item Crafting, name: External Gills, cost: 134 gp, check: "DC 16 Wisdom (Survival)" }
      - { type: Weapon Crafting, name: Primary Sensory Horn, cost: 216 gp, check: "DC 22 Wisdom (Survival)" }
      - { type: Weapon Crafting, name: Secondary Sensory Horn, cost: 190 gp, check: "DC 19 Wisdom (Survival)" }

