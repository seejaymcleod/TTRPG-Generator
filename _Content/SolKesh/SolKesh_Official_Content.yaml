- id: sk_monster_cerrophol
  name: Cerrophol
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Medium Beast, Unaligned, Aggressive
    flavor: As the tide falls, exposing trapped crustaceans and fish within tidal pools, the cerrophol stalks out of the surf to survey the pickings. A semi-terrestrial squid using feeding tentacles to hunt above the waves.
    bio:
      class: Cephalopoda
      genus: Derived Evolution - Dosidicus
      niche: Amphibious Generalist Carnivore
      biome: The Strands (Coastal)
    ecology:
      preyed_upon_by: Daellash, Gharril, Goliarch, Illithisk, Slannethiss, Vinnirex
      preys_on: Daugon, Gharril, Illithisk
    taming:
      bond: "5"
      maturity: 3 Seasons
    ac: "14"
    hp: 46 (8d8 + 8)
    speed: 20 ft., swim 40 ft.
    initiative: +3 (13)
    attributes:
      str: { score: 15, mod: "+2", save: "+2" }
      dex: { score: 16, mod: "+3", save: "+3" }
      con: { score: 12, mod: "+1", save: "+1" }
      int: { score: 9, mod: "-1", save: "-1" }
      wis: { score: 13, mod: "+1", save: "+1" }
      cha: { score: 8, mod: "-1", save: "-1" }
    skills: Perception +3, Stealth +5
    senses: Darkvision 30 ft., Passive Perception 13
    challenge: { rating: "2", xp: "450", pb: "+2" }
    traits:
      - name: Coastal Hunter
        desc: The cerrophol can breathe only water, and while out of water, it can hold its breath for 1 hour.
      - name: Polarized Sight
        desc: The cerrophol has Advantage on Wisdom (Insight) checks to determine if a creature is being deceptive.
      - name: Twisting Form
        desc: The cerrophol has Advantage on Saving Throws made to escape the Grappled condition.
    defensive_instinct: |
      (1/Day) When Bloodied and engaged in melee combat, the cerrophol begins to flail wildly.
      On its turn, Wisdom Saving Throw: DC 12. Success: Gains a third attack. Failure: Free Disengage and Dash away.
    actions:
      - name: Multiattack
        desc: The cerrophol makes two attacks, using Piercing Tentacles and Gripping Arms.
      - name: Piercing Tentacles
        desc: "Melee Attack Roll: +5 to hit, reach 5 ft., one target. Hit: 12 (2d8+3) Piercing damage. Attack rolls against target have Advantage until start of next turn."
      - name: Gripping Arms
        desc: "Melee Weapon Attack: +5 to hit, reach 10 ft., one target. Hit: 6 (1d6+3) Bludgeoning damage. Medium/smaller target is Grappled (Escape DC 15)."
    reactions:
      - name: Ink Spill (1/Day)
        desc: "Trigger: Takes damage out of water. Response: Releases 15 ft. radius slippery ink. Difficult terrain. DC 14 Dex Save or Prone."
    encountering: Naturally inquisitive, the cerrophol has adapted to a life of changing tides. It may follow stealthily if not threatened.
    crafting:
      - { type: Weapon Crafting, name: Piercing Tentacle, cost: 18 gp, check: "DC 14 Wisdom (Survival)" }
      - { type: Trap Crafting, name: Hollowed Mantle, cost: 46 gp, check: "DC 18 Wisdom (Survival)" }
      - { type: Consumable, name: Calamari Ring, cost: 1 gp, check: "DC 10 Wisdom (Survival)" }

- id: sk_monster_daellash
  name: Daellash
  type: Monster
  stage: Standard
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Large Beast, Unaligned, Wary
    flavor: From deep within limestone tunnels to vast interwoven coral caverns, the daellash worms its way through tight confines, snapping up crustaceans with grasping jaws.
    bio:
      class: Actinopterygii
      genus: Derived Evolution - Gorgasia
      niche: Generalist Marine Carnivore
      biome: The Umbrawells (Caverns)
    ecology:
      preyed_upon_by: Goliarch, Slannethiss, Spiera, Vortautilus
      preys_on: Cerrophol, Esslinter, Illithisk, Tiama
    taming:
      bond: "3"
      maturity: 9 Seasons
    ac: "12"
    hp: 45 (6d10 + 12)
    speed: 5 ft., burrow 10 ft., swim 40 ft.
    initiative: +2 (12)
    attributes:
      str: { score: 17, mod: "+3", save: "+3" }
      dex: { score: 14, mod: "+2", save: "+2" }
      con: { score: 15, mod: "+2", save: "+2" }
      int: { score: 7, mod: "-2", save: "-2" }
      wis: { score: 10, mod: "+0", save: "+0" }
      cha: { score: 8, mod: "-1", save: "-1" }
    skills: Perception +2
    senses: Perception +2
    challenge: { rating: "2", xp: "450", pb: "+2" }
    traits:
      - name: Saturated Gill Branches
        desc: Can breathe only underwater, survives without oxygen for 30 minutes.
      - name: Serpentine Form
        desc: Advantage on Saving Throws made to escape a Grapple.
    defensive_instinct: |
      (1/Day) - Wary Instinct. When swallowing a creature, it looks for escape.
      On turn, DC 10 Wis Save. Success: Disengage and flee deeper into tunnels.
    actions:
      - name: Grasping Bite
        desc: "Melee: +5 to hit, reach 10 ft. Hit: 12 (2d8 + 3) Piercing. DC 10 Wis Save or Grappled (Escape DC 12). Deals 7 (1d8+3) auto damage at start of turn."
      - name: Gulping Maw
        desc: "Attack against Grappled target. Hit: Swallowed. Blinded, Restrained, Total Cover, 5 (2d4) Bludgeoning/turn."
    encountering: A hunter of tight confines, rarely seen outside narrow tunnels. Mothers sequester eggs deep in crevasses.
    crafting:
      - { type: Consumable, name: Steak Slice, cost: 4 gp, check: "DC 8 Wisdom (Survival)" }
      - { type: Hatching, name: Crevice Roe, cost: 60 gp, check: "DC 20 Intelligence (Nature)" }
      - { type: Tool Crafting, name: Gill Branches, cost: 18 gp, check: "DC 16 Wisdom (Survival)" }

