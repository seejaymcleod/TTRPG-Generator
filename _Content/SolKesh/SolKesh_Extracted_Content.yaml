- id: sk_monster_trikautrae
  name: Trikautrae
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Medium Beast, Unaligned, Defensive
    flavor: Covered in a skin of fluid, suffused with a neurotoxin, the tendrils that rim the edge of the urchin can temporarily numb the extremities of creatures on contact. Fringed by a ring of large, flattened modified spines, the urchin can pivot and rotate them for a measured pace of locomotion. While slow, the trikautrae can crawl up past the tide to entice nearby scavengers.
    bio:
      class: Echinoidea
      genus: Derived Evolution Colobocentrotus
      niche: Specialist Carnivore
      biome: ''
    ecology:
      preyed_upon_by: Daugon, Gharril, Slannethiss, Vortautilus
      preys_on: Black Billed Fingulls
    taming:
      bond: 'Null'
      maturity: Age 6 Seasons
    ac: '14'
    hp: 45 (6d8 + 18)
    speed: 5 ft.
    initiative: '-1 (9)'
    attributes:
      str:
        score: 16
        mod: '+3'
        save: '+3'
      dex:
        score: 8
        mod: '-1'
        save: '-1'
      con:
        score: 16
        mod: '+3'
        save: '+3'
      int:
        score: 2
        mod: '-4'
        save: '-4'
      wis:
        score: 8
        mod: '-1'
        save: '-1'
      cha:
        score: 3
        mod: '-4'
        save: '-4'
    skills: Stealth +1
    senses: Blindsight 30 ft., passive Perception 10
    immunities: Blinded, Charmed, Deafened
    challenge:
      rating: '2'
      xp: '450'
      pb: '+2'
    traits:
      - name: Amphibious
        desc: The trikautrae can breathe both air and water.
      - name: Tidal Camouflage
        desc: While the trikautrae remains motionless with its shell closed, it is indistinguishable from the surrounding stones. It has advantage on Dexterity (Stealth) checks made to Hide while in the Strands biome or coastal-like environments.
    actions:
      - name: Paralyzing Clamp ( Open )
        desc: 'Melee Weapon Roll : +5 to hit, reach 5 ft., one target. Hit : 11 (2d6 + 3) Piercing damage. Constitution Saving Throw: DC 14, target creature the trikautrae has successfully hit. Failure: The target creature has the Paralyzed condition for 6 minutes. The Paralyzed target can repeat the Saving Throw at the end of each of its turns, ending the effect on a success.'
      - name: Devour ( Open)
        desc: 'Strength Saving Throw: DC 14, one Medium or smaller creature Grappled by the trikautrae (it can one creature swallowed at a time). Failure: The target is swallowed. A swallowed creature has the Paralyzed and Restrained conditions, has Total Cover against attacks and other effects outside the trikautrae, and takes 4 (1d6) Acid damage at the start of each of the trikautrae''s turns. If the trikautrae takes 20 damage or more on a single turn from a creature inside it, the trikautrae must succeed on a DC 19 Constitution Saving Throw at the end of that turn or regurgitate the creature, which falls in a space within 5 ft. of the trikautrae and has the Prone condition. If the trikautrae dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 5 ft. of movement, exiting Prone.'
      - name: Shelled Tackle (Closed)
        desc: 'Melee Attack Roll: +5 to hit, reach 5 ft., one target. Hit: 11 (2d6 + 3) Bludgeoning damage.'
    bonus_actions:
      - name: Clamping Shell
        desc: The trikautrae can close its shell. While closed it gains +2 AC (total 16) and Resistance to Piercing and Slashing damage and it can use its (closed) Actions. In a subsequent turn, it can use a Bonus Action to Open its shell once more.
    defensive_instinct: 'When near death, its shell closes against intrusion. Reaction Trigger: When the trikautrae is reduced to 0 hit points. Response - Constitution Saving Throw: DC 12, the trikautrae. Success: The Trikautrae''s mouth remains tightly closed upon death, blocking the Scavenging of its Paralytic Tendril Knot and Concentrated Digestion Enzyme. Any effort to open its mouth requires a DC 17 Strength check.'
  stage: Standard
  encountering: Along the rocky shores of the Strands, the trikautrae is often found nestled among the stones and tidal pools. Never venturing far from the water, it often comes ashore at night, opening its wide mouth to entrap prey with its luminescent glowing tendrils that wave in the moonlit air. During the day, nestled among the clams and stones, it is much harder to spot.
  crafting:
    - type: Weapon Crafting
      name: Paralytic Tendril Knot
      cost: 31 gp
      check: DC 15 Wisdom (Survival) Check
    - type: Potion Crafting
      name: Concentrated Digestion Enzyme
      cost: 65 gp
      check: DC 19 Wisdom (Survival) Check
    - type: Armor Crafting
      name: Stonescale Shell
      cost: 28 gp
      check: DC 14 Wisdom (Survival) Check
