  stage: Standard
  encountering: These large herbivores look deceptively docile when slowly grazing in the fields, their eyes staring vacantly as they chew, but they are always watching for danger. Once confronted by aggressive creatures they quickly form a defensive posture, their instinctual need to protect taking over. If roused to violence, there is little that would calm them until the hostile is long gone or crushed into the soil.
