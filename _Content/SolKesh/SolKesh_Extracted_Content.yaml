- id: sk_monster_axilot
  name: Axilot
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Small Beast, Unaligned, Aggressive
    flavor: The quick pitter-patter of taloned feet speed over dry plains as the axilot rushes past circling scavengers. A dozen of their kind following suit, all directed at the large freshly slain carcass being torn apart by a famished predator under the arid day sun. With the sound of a sharp crack, it plunges into the fallen beast, its axe-like beak cracking through the ribcage and exposing the nutrient-rich organs for a fast snatch and hasty retreat. Its kin plunging in quick succession while the frustrated predator lashes out at the pestering flightless birds. With their precious prize held firmly in razored beaks, bright scarlet drops trail behind them as they escape the hunting ground. Wolfing down the meat while on the run, they take no rest as the flock continues their search to steal another meal. Bright turquoise feathers help the terrestrial bird sight their kin over long distances. Males sport red tails, signaling their readiness to mate. As its defining trait, the sharp wedge-shaped beak is both light and durable. Microscopic keratin tiles overlap an interior structure made of a foam of bony fibers, aiding the bird to endure bone shattering impacts.
    bio:
      class: Aves
      genus: Derived Evolution Geococcyx
      niche: Specialist Scavenger Omnivore
      biome: Farplains
    ecology:
      preyed_upon_by: Argustaur, Draffer, Grahknash, Khanith, Maedrynn
      preys_on: Bloomux, Lhoupin, Tartakka
    taming:
      bond: '3'
      maturity: Age 2 Seasons
    ac: '10'
    hp: 10 (3d6)
    speed: 30 ft.
    initiative: +3 (13)
    skills: Acrobatics +4
    senses: Darkvision 60 ft., Passive Perception 11
    challenge:
      rating: '1'
      xp: '200'
      pb: '2'
    traits:
      - name: Farplains Senses
        desc: The axilot has Advantage on Wisdom (Perception) checks that rely on sight or smell.
      - name: Pack Strikes
        desc: The axilot has Advantage on attack rolls against a creature if at least one of the axilot's allies is within 5 ft. of the creature and the ally doesn't have the Incapacitated condition.
    actions:
      - name: Axe Beak
        desc: 'Melee Attack Roll : +4 to hit, reach 5ft., one target. Hit : 4 (1d4 + 2) Piercing damage. If the axilot moves 20+ ft. immediately before the hit toward a creature, that target takes an extra 4 (1d8) Piercing damage. Constitution Saving Throw: DC 11, target creature that the axilot has successfully hit. Failure: Target creature has Disadvantage on their next attack roll.'
      - name: Talons
        desc: 'Melee Attack Roll : +4 to hit, reach 5ft., one target. Hit : 7 (2d4 + 2) Slashing damage.'
    reactions:
      - name: Aggressive Instinct (1/Day)
        desc: 'Trigger: An allied axilot within 60 ft. that it can see is slain. Response: Wisdom Saving Throw: DC 10, the axilot. Success: It makes an Talons Attack Action against any enemy creature within 5 ft. as a Bonus Action if within range. Failure: It takes a Disengage action and attempts to move as far as possible from any hostile creatures.'
      - name: Flock Coordination
        desc: 'Trigger: An allied axilot within 10 ft. of it that it can see makes a Dash action. Response: The axilot can make a Dash action or Disengage action and move in the same direction if possible.'
  stage: Standard
  encountering: Finding an axilot is a much easier task than catching one, as the fleet-footed birds are quick to react to predators and unknown creatures, rushing off far from their reach. Although their striking method is devastating for their size, it can also be their downfall if an axilot charges and becomes stuck in the carcass, making itself easy prey to be caught.
  crafting:
    - type: Weapon Crafting
      name: Axilot Beak
      cost: 16 gp
      check: DC 18 Wisdom (Survival) Check
    - type: Consumable and Hatching
      name: Pebbleskin Egg
      cost: 90 gp
      check: DC 19 Intelligence (Nature) Check
    - type: Ammunition Crafting
      name: 1d12 Quill Feather
      cost: 8 sp
      check: DC 9 Wisdom (Survival) Check
- id: sk_monster_bloomux
  name: Bloomux
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Large Beast, Unaligned, Wary
    flavor: Among the lush flower-fields of Valedayn, slow plodding bloomux graze in great herds. Sipping nectar from the leagues of flowering fields with their long prehensile proboscises, these peaceful arthropods, standing at nearly seven feet tall, want nothing more than to grow their honeywombs for their gestating pupae during the summer. When predators approach the herd, the nectarivores will turn their spiny backsides outwards to dissuade any foolish hunter that attempts to get near. Though this presents their precious honeywombs to the attacker, the potential explosion of chitinous spikes, sticky nectar and wriggling pupae often proves fatal to predators, and allows the larvae to be eaten by scavengers for the next stage in their development.
    bio:
      class: Insecta
      genus: Derived Evolution Macrosiphum
      niche: Specialized Nectarivore
      biome: Valedayn
    ecology:
      preyed_upon_by: Axilot, Draffer, Grahknash, Khanith, Maedrynn, Tyrandroth
      preys_on: ''
    taming:
      bond: '3'
      maturity: Age 3 Seasons
    ac: '13'
    hp: 45 (6d10 + 12)
    speed: ''
    skills: Perception +3
    senses: Passive Perception 13
    vulnerabilities: Piercing
    challenge:
      rating: '2'
      xp: '450'
      pb: '2'
    traits:
      - name: Sweetest Scent
        desc: The bloomux have Advantage on any attack rolls against non-bloomux creatures covered in nectar.
      - name: Prickly Hide
        desc: At the start of it its turn, the bloomux deals 3 (1d6) Piercing damage to any creature Grappling it.
      - name: Fatal Burst
        desc: 'When the bloomux dies, it explodes in a burst of nectar and spines. DC 11 Dexterity Saving Throw, each creature in a 15 ft. radius Sphere centered on the bloomux. Failure: 10 (3D6) Piercing damage and is covered in a sticky honey, Reducing their movement speed by half. Success: Half damage. A nectarcovered creature can use an Action to wipe off the nectar.'
    actions:
      - name: Prickly Spines
        desc: 'Melee Attack Roll : +5 to hit, reach 5ft., one target. Hit : 12 (3d6 + 3) Piercing damage.'
    reactions:
      - name: Wary Instinct (Once)
        desc: 'Trigger: If the bloomux suffers a total of 10 or more damage in a single round of combat. Response: Constitution Saving Throw: DC 16, the bloomux. Failure: The bloomux immediately uses its Fatal Burst ability.'
    bonus_actions:
      - name: Honeyed Sacrifice
        desc: The bloomux can trigger its Fatal Burst ability instantly, killing itself in the process.
  stage: Standard
  encountering: These ponderous beasts are easy to spot in large swarms of twenty to sixty individuals, roaming south to north as the fields bloom. While they are not a species liable to stampede, if the swarm feels endangered they'll be quick to turn their spines outward to ward off any dangerous predators, only sacrificing themselves in a sequence of fatal eruptions in the most direst of situations to save their young pupae.
  crafting:
    - type: Potion Brewing
      name: Honeywomb Nectar
      cost: 42 gp
      check: DC 12 Wisdom (Survival) Check
    - type: Trap Crafting
      name: 1d12 Bloomspine
      cost: 4 gp
      check: DC 8 Wisdom (Survival) Check
    - type: Trap Crafting
      name: Curled Proboscis
      cost: 62 gp
      check: DC 18 Wisdom (Survival) Check
- id: sk_monster_drafian
  name: Drafian
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Large Beast, Unaligned, Defensive
    flavor: After eons of pressure to hasten the vulnerable metamorphosis that transforms a caterpillar into a butterfly, one species developed wing-like membranes during its larval form and simply continued feasting. This form of neoteny forced the creature to forgo the usual brief life span of sexual maturity and, instead the insect now grows large and lives past their year-long lifespan, hibernating in leafy nests and reaching egg laying adulthood once growing to a foot in length. While not capable of true flight like a butterfly, the drafian, in its near larval state can nonetheless glide across great distances to find rich feeding grounds. Such a gentle flight would be an easy meal for most predators had the drafian's bodily fluids not be suffused with a neurotoxin from feasting on the toxic leaves of a drafwood tree. A wide sail-like membrane spreads outwards to catch updrafts and allow the drafian to glide effortlessly across fields and rivers. Folding its wing-membranes close to its body, the drafian navigates along treetops in a similar manner to its larval caterpillar origins. When needing to move quickly, it launches itself upwards and spreads the thin jelly-like skin out to glide effortlessly. Rows of spiracles adorn the sides of the soft fleshed insect. These allow the creature to grow large as it can take in vast amounts of oxygen when in flight.
    bio:
      class: Insecta
      genus: Derived Evolution Cyclophora
      niche: Arboreal Specialist Herbivore
      biome: Farplains
    ecology:
      preyed_upon_by: Maedrynn, Skyelarx, Tyrandroth, Ynnil
      preys_on: ''
    taming:
      bond: '4'
      maturity: Age 1 Season
    ac: '13'
    hp: 45 (6d10 + 12)
    speed: 20 ft., glide 30 ft.
    initiative: '-1 (9)'
    attributes:
      str:
        score: 16
        mod: '+3'
        save: '+3'
      dex:
        score: 8
        mod: '-1'
        save: '-1'
      con:
        score: 14
        mod: '+2'
        save: '+2'
      int:
        score: 2
        mod: '-4'
        save: '-4'
      wis:
        score: 7
        mod: '-2'
        save: '-2'
      cha:
        score: 6
        mod: '-3'
        save: '-3'
    skills: Acrobatics +1, Perception +0, Stealth +1
    senses: Passive Perception 10
    challenge:
      rating: '2'
      xp: '450'
      pb: '2'
    traits:
      - name: Wary Eyes of Prey
        desc: The drafian has Advantage on Wisdom (Perception) checks that rely on sight.
      - name: Leafy Simulacrum
        desc: The drafian has Advantage on Dexterity (Stealth) checks made to hide in its natural environments of the fields and forests.
      - name: Leaping Glide
        desc: The drafian can leap into the air 20 ft. and begin gliding. During this glide, it gains a flying speed of 30 ft., and can move 5 ft. horizontally for every 1 ft. it descends, and it can pass over other creatures and obstacles.
      - name: Drafwood Toxic Blood
        desc: 'Constitution Saving Throw: DC 14, each creature that successfully damages the drafian with a melee attack. Failure: 7 (2d6) Poison damage and the target has the Poisoned condition. The target may repeat the save at the end of each of its turns, ending the effect on itself on a success. After 10 minutes, it succeeds automatically. While Poisoned, the target has Disadvantage on all Wisdom rolls and takes 2 (1d4) Poison damage at the start of its turn.'
    actions:
      - name: Nibbling Bite
        desc: 'Melee Attack Roll: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) Piercing damage.'
    reactions:
      - name: Defensive Instinct (1/Day)
        desc: 'Trigger: A creature the drafian can see hits it with an attack roll. Response: Dexterity Saving Throw: DC 14, each creature in a 20 ft. Cone originating from behind the drafian. Failure: 7 (2d6) Poison damage. Success: Half damage.'
    bonus_actions:
      - name: Silken Stream
        desc: 'While the drafian glides, it may release a wide column of thin threads of silk for the full length of its movement. Constitution Saving Throw: DC 14, each creature in a 30 ft. long, 5 ft. wide line. Failure: 3 (1d6) Poison damage and the target has the Poisoned condition. The target may repeat the save at the end of each of its turns, ending the effect on itself on a success. After 10 minutes, it succeeds automatically. While Poisoned, the target has Disadvantage on all Wisdom Rolls and takes 2 (1d4) Poison damage at the start of its turn.'
  stage: Standard
  encountering: With little to concern itself besides eating and breeding, the drafian is either evading or gliding across the Farplains in search of plants to feed on during the spring and summer months. Most predators stay clear of the bright green insect for the ill effects of its blood and potentially fatal strands of silk that stretch across the fields.
  crafting:
    - type: Weapon Crafting
      name: Spool of Drafwood Silk
      cost: 12 GP
      check: DC 14 Wisdom (Survival) Check
    - type: Potion Brewing
      name: Drafian Haemolymph
      cost: 18 GP
      check: DC 13 Wisdom (Survival) Check
    - type: Weapon Crafting
      name: Rudder Membrane
      cost: 33 GP
      check: DC 14 Wisdom (Survival) Check
- id: sk_monster_khanaur
  name: Khanaur
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Large Beast, Unaligned, Defensive
    flavor: A deep grinding sound heralds the peaceful packs of khanaur as they chew through stalks of tall grass and dig up tubers to feed their voracious appetites. Roaming in groups of several individuals, their larvae stuck on the undersides of the adult members to keep their familial packs tight and moving, the khanaur travel the Farplains in slow seasonal migrations. Grazing in close proximity to each other to ward off any nearby predators, while the larger females of their group patrol, their massive forelimbs stomping into the soil to warn any that think they can attempt to penetrate their heavily armored chitin shells. Keeping pace with their roaming herd are packs of khanith, picking off smaller predators that would otherwise prey on the larvae grubs, their presence welcomed by their larger cousins.
    bio:
      class: Insecta
      genus: Derived Evolution Micropeplus
      niche: Generalist Grazing Herbivore
      biome: Farplains
    ecology:
      preyed_upon_by: Argustaur, Draffer, Grahknash, Maedrynn, Tyrandroth
      preys_on: ''
    taming:
      bond: '4'
      maturity: Age 3 Seasons
    ac: '18'
    hp: 85 (9d10 + 36)
    speed: 30 ft.
    initiative: '-1 (9)'
    attributes:
      str:
        score: 20
        mod: '+5'
        save: '+7'
      dex:
        score: 8
        mod: '-1'
        save: '-1'
      con:
        score: 18
        mod: '+4'
        save: '+6'
      int:
        score: 2
        mod: '-4'
        save: '-4'
      wis:
        score: 7
        mod: '-2'
        save: '-2'
      cha:
        score: 10
        mod: '+0'
        save: '+0'
    senses: Darkvision 60 ft., Passive Perception 9
    resistances: Slashing
    challenge:
      rating: '4'
      xp: '1100'
      pb: '2'
    traits:
      - name: Pack Protector
        desc: By the use of its enormously armored arms, when an ally of a khanaur is within 5 ft. and is the target of an attack, it can use its Reaction to force Disadvantage on the attacking creatures attack roll.
      - name: Distant Kin
        desc: If a friendly khanaur or khanith creature is attacked within 60 ft., surrounding khanaur become aware by the use of pheromones. Khanith are considered allies to the khanaur.
      - name: Forlorn Grief
        desc: Whenever the khanaur starts its turn with 20 hit points or fewer, and is the last of its allies within 60 ft., the khanaur enrages. The khanaur has Advantage on attack rolls, and is unable to Disengage from combat once engaged. Once the khanaur is enraged, it continues to do so until it is slain.
    actions:
      - name: Multiattack
        desc: The khanaur makes two attacks, using its Crushing Fore Claws and Mandible Bite in any combination.
      - name: Crushing Fore Claws
        desc: 'Melee Attack Roll : +7 to hit, reach 5ft., one target. Hit : 10 (1d10 + 5) Bludgeoning damage. If the target is a Large or smaller creature, and the khanaur moved 20+ ft. straight toward it immediately before the hit, the target has the Prone condition.'
      - name: Mandible Bite
