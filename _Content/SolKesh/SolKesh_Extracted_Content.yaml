    - type: Tool Crafting
      name: Darting Tongue
      cost: 124 gp
      check: DC 17 Wisdom (Survival) Check
    - type: Hatching
      name: Oval Egg
      cost: 326 gp
      check: DC 26 Intelligence ( Nature) Check
