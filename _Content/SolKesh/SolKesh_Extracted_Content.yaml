- id: sk_apex_maedrynn_murmuration
  name: Maedrynn Murmuration
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Gargantuan Swarm of Tiny Beasts, Unaligned, Wary
    flavor: Ordinarily found near the prairies that skirt the edges of the Wealdwoods, the diminutive hummingbird flutters about from flower to flower, its green shimmering feathers as welcome as a calm and peaceful summer day. That all changes quickly when spring warms the grasses and a keening death knell is heard screeching across the open skies of the Farplains. Before long, thousands of them gather into a great murmur, darkening the sky above the flat lands, becoming a natural calamity and blocking out the sun. A single maedrynn hummingbird may be of little threat, but during the ferocious but fortunately short mating season, they become an absolute apex predator together. Countless birds descending like a tornado of serrated beaks onto any creature that is foolish enough to be out in the open daylight, ripping and flensing flesh from bone in a frantic need to fuel their rapid and voracious metabolism.
    bio:
      class: Aves
      genus: Derived Evolution Androdon
      niche: Aerial Apex Omnivore
      biome: Farplains
    ecology:
      preyed_upon_by: ''
      preys_on: Argustaur, Bloomux, Khanaur, Khanith, Korruk, Rutort, Vinnirex, Sacrissian, Tartakka, Tyrandroth
    taming:
      bond: 'Null'
      maturity: Age 2 Seasons
    ac: '21'
    hp: 546 (28d20 + 252)
    speed: 10 ft., fly 60 ft.
    initiative: +8 (18)
    attributes:
      str:
        score: 18
        mod: '+4'
        save: '+4'
      dex:
        score: 26
        mod: '+8'
        save: '+15'
      con:
        score: 28
        mod: '+9'
        save: '+16'
      int:
        score: 7
        mod: '-2'
        save: '-2'
      wis:
        score: 16
        mod: '+3'
        save: '+3'
      cha:
        score: 4
        mod: '-3'
        save: '-3'
    skills: Acrobatics +15, Perception +10
    senses: Passive Perception 20
    vulnerabilities: Thunder
    resistances: Bludgeoning, Piercing, Slashing
    immunities: Charmed, Frightened, Grappled, Paralyzed, Petrified, Prone, Restrained, Stunned
    challenge:
      rating: '24'
      xp: 62,000
      pb: '7'
    traits:
      - name: Thousands of Eyes
        desc: The swarm has Advantage on Wisdom (Perception) checks that rely on sight.
      - name: Cloud of Birds
        desc: The swarm occupies a 30 ft. radius (Gargantuan) space and can move through any opening large enough for a Tiny creature.
      - name: Undulating Murmuration
        desc: The swarm of birds moves in dizzying patterns. Ranged attack rolls outside of 60 ft. are made with Disadvantage against it.
      - name: Trilling Death
        desc: Creatures have the Deafened condition while within the swarm's space. In addition, any creature within 60 ft. must succeed on a DC 15 Constitution Saving Throw on each of their turns to maintain their Concentration.
      - name: Frenzied
        desc: The swarm has Advantage on attack rolls against Bloodied creatures.
    actions:
      - name: Multiattack
        desc: The swarm makes three attacks, using Serrated Beaks, Hungering Outliers, or Feasting Storm in in any combination.
      - name: Serrated Beaks
        desc: 'Melee Attack Roll: +15 to hit, reach 0 ft., one target in the swarm''s space. Hit: 36 (8d6+8) Slashing damage, or 22 (4d6+8) Slashing damage if the swarm is Bloodied. Dexterity Saving Throw: DC 8, one creature that the swarm successfully hit with its Serrated Beaks attack. Failure: The target has the Blind condition until the swarms next turn, as the birds slash at their eyes.'
      - name: Hungering Outliers
        desc: 'Ranged Attack Roll: +15 to hit, reach 60 ft., one target. Hit: 29 (6d6+8) Slashing damage, or 18 (3d6+8) Slashing damage if the swarm is Bloodied.'
      - name: Feasting Storm
        desc: 'Dexterity Saving Throw: DC 18, all creatures within the swarm''s space. Failure: 38 (12d4+8) Slashing damage and the creature has the Prone condition, or 23 (6d4+8) Slashing damage if the swarm is Bloodied. Success: Half damage.'
    defensive_instinct: 'When Bloodied and in melee combat. On its turn, Wisdom Saving Throw: DC 18, the swarm. Success: Individual maedrynn flock to join the swarm, the maedrynn murmuration swarm immediately gains 10 (1d20) Health Points (HP).'
  stage: Apex
  legendary_actions:
    - name: Legendary Action Uses
      desc: 3 (4 in Lair) . Immediately after another creature's turn, the maedrynn murmuration can expend a Legendary Action Use to take one of the following actions. The swarm regains all expended Legendary Actions at the start of each of its turns.
    - name: Disperse
      desc: The swarm spreads out in a tall column, leaving more space between each individual bird. The swarm gains +1 bonus to its Armor Class (total AC 22) and loses its Vulnerability to Thunder damage, until the beginning of its turn.
    - name: Screeching Cacophony
      desc: 'Constitution Saving Throw: DC 14, all creatures within the swarm''s space . Failure: 16 (3d10) Thunder damage. Success: Half damage.'
    - name: Pulling Beaks
      desc: 'Dexterity Saving Throw: DC 16, one target in the swarm''s space. Failure: Target has the Restrained condition (Escape DC 14) as birds pluck and pull at their limbs.'
  lair_actions:
    - name: Fade and Form
      desc: The maedrynn murmuration swarm breaks apart into thousands of individual birds and reforms into a free space within 60 ft. of itself.
    - name: Darting Death Dealers
      desc: 'The maedrynn murmuration swarm designates a point within 60 ft. of itself. Dexterity Saving Throw: DC 18, all creatures within 5 ft. of the selected point. Failure: 17 (5d6) Slashing damage. Success: Half damage.'
    - name: Cloud of Fear
      desc: 'Wisdom Saving Throw: DC 17, all creatures within 60 ft. that can see or hear the swarm. Failure: Target creature has the Frightened condition until the maedrynn murmuration swarm''s next turn.'
    - name: Buffeting Wings
      desc: 'The maedrynn murmuration swarm selects a target creature within 60 ft. of itself. Strength Saving Throw: DC 14, target creature. Failure: The creature is pushed 10 ft. in the direction of the swarm''s choice.'
    - name: Distracted Feast
      desc: The maedrynn murmuration swarm designates a point within 60 ft. of itself that hosts the remains of one of their earlier meals. Until the maedrynn murmuration swarm's next turn, 20 ft. from that point is Obscured, as the birds thickly flock and feast.
    - name: '[Seasonal] Calling Cries'
      desc: The cries of hunger gather more maedrynn to join the murmur. The maedrynn murmuration swarm gains 5 (1d10) Health Points (HP) as more birds join the swarm.
  regional_effects:
    - name: Grave Temptations
      desc: Emboldened by the multitude of bones, scavengers try their luck on the outskirts, 6 miles from the Lair. Double the amount of creatures from the results on the Scavengers Table.
    - name: Lingering Hunger
      desc: Sated individual maedrynn hummingbirds busying themselves with preparing their nests within 5 miles of the Lair may still single out nearby creatures for a bite of flesh. Increased likelihood to target Maedrynn Young (pg. 98).
    - name: Dreadful Flight
      desc: 'Flying creatures within 4 miles of the Lair are overcome with fear from the cloud of birds on the horizon. Wisdom Saving Throw: DC 12, any creature with a flying speed attempting to move. Failure: Target creature lowers their flying speed to a minimum of 10 ft., the target repeats the save at the end of each of its turns, ending the effect on itself on a success. After 5 minutes, it succeeds automatically and doesn''t need to take this test again for 1 day.'
    - name: Barren Plains
      desc: Little is left of the many creatures that roamed these fields but bloody bones. Travelers within 3 miles of the Lair must re-roll the first of any creature results for Hunting Expeditions.
    - name: Ceaseless Trilling
      desc: The massive murmuration of hummingbirds shriek and call constantly and from within 2 miles of the Lair. Creatures that attempt a Long Rest must succeed on a DC 15 Constitution Saving Throw or gain one level of Exhaustion from the fitful rest. Additionally, creatures have Disadvantage on Wisdom (Perception) checks that rely on hearing.
    - name: Watchful Cloud
      desc: Within 1 mile, the frenzied eyes of thousands of maedrynn above look hungrily for the movement of any prey. Creatures out in the open, 1 mile of the Lair must make a DC 14 Dexterity (Stealth) check to not alert the maedrynn murmuration of their presence for every hour they remain outside.
  encountering: Travelers stepping on to the Farplains often must contend with ferocious lizards, gigantic insects and more. Choosing to journey during the brief reign of the maedrynn is a recipe for annihilation, leaving little but bones for the grass.
  crafting:
    - type: Tool Crafting
      name: Moribeak
      cost: 287 gp
      check: DC 21 Wisdom (Survival) Check
    - type: Potion Brewing
      name: Glucose Rich Blood
      cost: 115 gp
      check: DC 19 Wisdom (Survival) Check
    - type: Armor Crafting
