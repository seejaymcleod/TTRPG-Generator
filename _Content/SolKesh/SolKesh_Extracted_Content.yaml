  name: Ruske
  type: Monster
  game: SolKesh
  source: SolKesh Bestiary
  properties:
    subtype: Small Beast, Unaligned, Defensive
    flavor: A warm breeze sways drooping willow branches, stirring a slow gentle river, its wide banks home to long strands of cattails. Th ick clusters of lily pads with slow moving, wedge-shaped-shelled creatures quietly chewing, quietly chewing through them at a docile pace. Frogs and birds rest on this notably serene crustacean's hard, flat shell while it roams the fresh waters, spearing all manner of river plants and chewing through the fi brous material with its long channel of teeth. Th ough blind, it has a highly developed sense of taste, able to detect the flora of its specialized diet and the flourishing surface algae. It is through the fi ltering and consumption of this scum that the ruske both cleanses the water ways for plants to proliferate, and develops its own inner toxins. Th ese toxins suffuse its body, giving its meat an impalpable taste and often lethal digestion, leading this creature to live a safe, if slow life.
