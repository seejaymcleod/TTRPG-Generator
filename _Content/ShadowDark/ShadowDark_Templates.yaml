# ShadowDark Content Templates v1.1
# These templates define the expected schema for each content type.
# The AI parser uses these to convert raw PDF text to valid YAML.
# 
# HOW TO USE:
# - Each template shows required fields, optional fields, and examples
# - The "conventions" section maps PDF abbreviations to our schema
# - The "source_schema" describes the visual layout in the original PDFs
# - Follow the exact structure shown in examples

game: ShadowDark
version: "1.1"

# ============================================================================
# GAME-SPECIFIC CONVENTIONS
# ============================================================================
# ShadowDark uses specific abbreviations in the official books.
# Map these to our standardized property names.

conventions:
  # Ability Score Abbreviations (shown as bold letters in stat blocks)
  stats:
    S: "str"      # Strength
    D: "dex"      # Dexterity
    C: "con"      # Constitution
    I: "int"      # Intelligence
    W: "wis"      # Wisdom
    Ch: "cha"     # Charisma (note: Ch, not C)
  
  # Alignment Codes
  alignments:
    L: "Lawful"
    N: "Neutral"
    C: "Chaotic"
  
  # Movement Keywords
  movement_types:
    near: "Standard movement (~30ft)"
    close: "Adjacent (~5ft)"
    far: "Long range (~60ft+)"
    double_near: "Double speed"
  
  # Movement Modifiers (in parentheses)
  movement_modifiers:
    - "(swim)"
    - "(fly)"
    - "(climb)"
    - "(burrow)"
  
  # Attack Format Pattern
  attack_pattern: "[count] [weapon] +[bonus] ([damage])"
  attack_examples:
    - "1 dagger (close/near) +2 (1d4)"
    - "2 claw +4 (1d6) and 1 bite +4 (1d10)"
    - "3 slam +8 (1d10) or 1 rock (far) +8 (2d12)"

# ============================================================================
# MONSTER TEMPLATE
# ============================================================================
templates:
  Monster:
    description: |
      A creature stat block for ShadowDark RPG.
      Monsters have stats, abilities, and attack actions.
      Level determines difficulty (1 = easy, 10+ = boss).
    
    id_format: "sd_monster_{snake_case_name}"
    
    required_fields:
      id:
        description: "Unique identifier"
        format: "sd_monster_lowercase_with_underscores"
        example: "sd_monster_goblin_archer"
      name:
        description: "Display name as shown in the book"
        example: "Goblin Archer"
      type:
        description: "Always 'Monster' for this template"
        value: "Monster"
      game:
        description: "Always 'ShadowDark'"
        value: "ShadowDark"
      source:
        description: "Which book or supplement"
        examples: ["Core", "Cursed Scroll 1", "Cursed Scroll 2", "Cursed Scroll 3"]
    
    properties:
      ac:
        description: "Armor Class - number, optionally with armor type in parentheses"
        examples: ["13", "13 (leather)", "13 (leather + shield)"]
      hp:
        description: "Hit Points - single number"
        examples: ["4", "13", "24", "38"]
      atk:
        description: "Attack line - parsed into actions array"
        format: "[count] [weapon] +[bonus] ([damage]) or ..."
        examples:
          - "1 dagger (close/near) +2 (1d4) or 1 shortsword +0 (1d6)"
          - "2 claw +4 (1d6) and 1 bite +4 (1d10)"
          - "3 slam +8 (1d10) or 1 rock (far) +8 (2d12)"
      mv:
        description: "Movement type and range"
        examples: ["near", "near (fly)", "double near", "near (swim)"]
      level:
        description: "Creature level (LV in source)"
        range: "1-20+"
      alignment:
        description: "Single letter: L/N/C (AL in source)"
      stats:
        description: "Six ability score MODIFIERS (not scores)"
        note: "These are modifiers (-4 to +5), NOT the 3-18 scores"
        format:
          str: "S in source"
          dex: "D in source"
          con: "C in source"
          int: "I in source"
          wis: "W in source"
          cha: "Ch in source"
      flavor:
        description: "Italicized description text immediately after the header"
        examples:
          - "A cat burglar in a black cloak."
          - "Green, lanky giants with warty skin and territorial rage. Lair in deep forests and swamps."
    
    abilities:
      description: "Special abilities - each has a bold name followed by period"
      format:
        - name: "Bold text before the period"
          desc: "Everything after the period"
      examples:
        - name: "Stealthy"
          desc: "ADV on DEX checks to sneak and hide."
        - name: "Backstab"
          desc: "Deal x2 damage against surprised creatures."
        - name: "Regenerate"
          desc: "Regains 2d6 HP on its turn unless its wounds are cauterized with fire or acid."
        - name: "Animate Tree"
          desc: "2/day. In place of attacks, one tree within near awakens as a treant ally without this ability. Reverts back in 1 day."
    
    actions:
      description: "Attack actions - parsed from ATK line"
      note: "Multiple attacks separated by 'or' are alternatives, 'and' are combined"
    
    source_schema:
      description: "Visual layout patterns in ShadowDark Core PDF"
      header:
        style: "Black banner/bar with white text"
        format: "ALL CAPS name"
        examples: ["THIEF", "THUG", "TREANT", "TROLL"]
      
      flavor_text:
        style: "Italicized"
        position: "First paragraph after header"
        examples:
          - "A cat burglar in a black cloak."
          - "Peaceful, slow-moving trees with merry eyes and tremulous voices. They protect the forest."
      
      stat_line:
        format: "AC [value], HP [value], ATK [attacks], MV [movement], S [+/-X], D [+/-X], C [+/-X], I [+/-X], W [+/-X], Ch [+/-X], AL [L/N/C], LV [number]"
        notes:
          - "Labels are bold: AC, HP, ATK, MV, S, D, C, I, W, Ch, AL, LV"
          - "Values follow immediately after label"
          - "Comma-separated, may wrap to multiple lines"
          - "AC may include armor type in parentheses: AC 13 (leather + shield)"
          - "ATK may have 'or' for alternatives and 'and' for combined attacks"
        examples:
          - "AC 13 (leather), HP 13, ATK 1 dagger (close/near) +2 (1d4) or 1 shortsword +0 (1d6), MV near, S +0, D +2, C +0, I +0, W +0, Ch +1, AL N, LV 3"
          - "AC 12, HP 24, ATK 2 claw +4 (1d6) and 1 bite +4 (1d10), MV near, S +3, D +2, C +2, I -1, W +0, Ch -1, AL C, LV 5"
      
      abilities:
        format: "**AbilityName.** Description text."
        notes:
          - "Bold ability name followed by period"
          - "Description follows on same line"
          - "May span multiple sentences"
          - "Often includes mechanics like 'ADV', 'DC X STAT', 'X/day'"
        examples:
          - "**Stealthy.** ADV on DEX checks to sneak and hide."
          - "**Backstab.** Deal x2 damage against surprised creatures."
          - "**Regenerate.** Regains 2d6 HP on its turn unless its wounds are cauterized with fire or acid."
      
      full_source_example: |
        ┌─────────────────────────────┐
        │          TROLL              │  ◄── Black banner, white ALL CAPS text
        └─────────────────────────────┘
        
        Green, lanky giants with warty      ◄── Italicized flavor text
        skin and territorial rage. Lair
        in deep forests and swamps.
        
        AC 12, HP 24, ATK 2 claw +4 (1d6)   ◄── Stat line (bold labels)
        and 1 bite +4 (1d10), MV near, S
        +3, D +2, C +2, I -1, W +0, Ch -1,
        AL C, LV 5
        
        Regenerate. Regains 2d6 HP on its   ◄── Ability (bold name + period)
        turn unless its wounds are
        cauterized with fire or acid.
    
    full_example: |
      - id: sd_monster_troll
        name: "Troll"
        type: Monster
        game: ShadowDark
        source: Core
        properties:
          ac: "12"
          hp: "24"
          mv: "near"
          level: "5"
          alignment: "C"
          stats:
            str: "+3"
            dex: "+2"
            con: "+2"
            int: "-1"
            wis: "+0"
            cha: "-1"
          flavor: "Green, lanky giants with warty skin and territorial rage. Lair in deep forests and swamps."
        abilities:
          - name: "Regenerate"
            desc: "Regains 2d6 HP on its turn unless its wounds are cauterized with fire or acid."
        actions:
          - name: "Attack"
            desc: "2 claw +4 (1d6) and 1 bite +4 (1d10)"

    gut_path: "I. ACTORS > 1. Monsters"
    taxonomy:
      # Mapped Properties
      level:
        label: "Level"
        source_property: "level"
        filter_type: "slider"
      ac:
        label: "AC"
        source_property: "ac"
        filter_type: "slider"
      hp:
        label: "HP"
        source_property: "hp"
        filter_type: "slider"
      
      # Taxonomy Tags
      Family:
        label: "Family"
        filter_type: "pills"
        options: ["Humanoid", "Beast", "Undead", "Construct", "Outsider", "Monstrosity", "Plant", "Giant", "Dragon"]
      Biome:
        label: "Biome"
        filter_type: "pills"
        options: ["Forest", "Dungeon", "Urban", "Aquatic", "Desert", "Mountains", "Swamp"]

  # ==========================================================================
  # SPELL TEMPLATE
  # ==========================================================================
  Spell:
    description: |
      A spell entry for ShadowDark RPG.
      Spells have tiers, classes, and effect descriptions.
    
    id_format: "sd_spell_{snake_case_name}"
    
    required_fields:
      id:
        description: "Unique identifier"
        format: "sd_spell_lowercase_with_underscores"
        example: "sd_spell_create_undead"
      name:
        description: "Spell name as shown in the book"
        example: "Create Undead"
      type:
        description: "Always 'Spell' for this template"
        value: "Spell"
      game:
        description: "Always 'ShadowDark'"
        value: "ShadowDark"
      source:
        description: "Which book or supplement"
        examples: ["Core", "Cursed Scroll 1"]
    
    properties:
      tier:
        description: "Spell tier (1-5)"
        range: "1-5"
        note: "Higher tier = more powerful"
      class:
        description: "Which class can cast this spell"
        options: ["Wizard", "Priest"]
        note: "Lowercase in source (wizard, priest)"
      duration:
        description: "How long the spell lasts"
        examples: ["Instant", "Focus", "1 day", "1 hour"]
      range:
        description: "Casting range"
        examples: ["Self", "Close", "Near", "Far"]
      description:
        description: "Full spell effect text - may be multiple paragraphs"
    
    source_schema:
      description: "Visual layout patterns in ShadowDark Core PDF"
      header:
        style: "Black banner/bar with white text"
        format: "ALL CAPS name"
        examples: ["CREATE UNDEAD", "DETECT MAGIC", "CURE WOUNDS"]
      
      tier_class_line:
        style: "Italicized"
        format: "Tier [1-5], [class]"
        position: "First line after header"
        examples:
          - "Tier 5, wizard"
          - "Tier 1, priest"
          - "Tier 2, wizard"
      
      properties:
        format: "**Label:** value"
        order: ["Duration", "Range"]
        notes:
          - "Duration and Range on separate lines"
          - "Labels are bold, values are regular text"
        examples:
          - "**Duration:** 1 day"
          - "**Duration:** Focus"
          - "**Duration:** Instant"
          - "**Range:** Close"
          - "**Range:** Near"
      
      effect_text:
        style: "Regular paragraphs"
        position: "After Duration/Range properties"
        notes:
          - "May be multiple paragraphs"
          - "Contains all mechanical details"
          - "May reference other spells in italics"
      
      full_source_example: |
        ┌─────────────────────────────┐
        │       CREATE UNDEAD         │  ◄── Black banner, white ALL CAPS
        └─────────────────────────────┘
        
        Tier 5, wizard                      ◄── Italicized tier and class
        
        Duration: 1 day                     ◄── Bold label, regular value
        
        Range: Close                        ◄── Bold label, regular value
        
        You conjure a vengeful undead       ◄── Effect paragraphs
        creature to do your bidding.
        
        When you cast this spell, you
        choose to summon either a
        wight or wraith. It appears next
        to you and is under your control.
        
        The undead creature acts on
        your turn. After 1 day, it melts
        away into smoke.
    
    full_example: |
      - id: sd_spell_create_undead
        name: "Create Undead"
        type: Spell
        game: ShadowDark
        source: Core
        properties:
          tier: "5"
          class: "Wizard"
          duration: "1 day"
          range: "Close"
        description: |
          You conjure a vengeful undead creature to do your bidding.
          
          When you cast this spell, you choose to summon either a wight or wraith. It appears next to you and is under your control.
          
          The undead creature acts on your turn. After 1 day, it melts away into smoke.

    gut_path: "III. MECHANICS > 6. Powers"
    taxonomy:
      # Mapped Properties
      class:
        label: "Class"
        source_property: "class"
        options: ["Wizard", "Priest", "Witch", "Seer", "Shaman"]
      tier:
        label: "Tier"
        source_property: "tier"
        options: ["1", "2", "3", "4", "5"]
      
      # Taxonomy Tags
      "Power Source":
        label: "Source"
        options: ["Arcane", "Divine"]

  # ==========================================================================
  # ITEM TEMPLATE (Magic Items, Potions, Gear)
  # ==========================================================================
  Item:
    description: |
      A magic item, potion, weapon, or piece of equipment for ShadowDark RPG.
      Magic items typically have Benefits and sometimes Curses.
    
    id_format: "sd_item_{snake_case_name}"
    
    required_fields:
      id:
        description: "Unique identifier"
        example: "sd_item_amulet_of_vitality"
      name:
        description: "Item name"
        example: "Amulet of Vitality"
      type:
        description: "Always 'Item' for this template"
        value: "Item"
      game:
        description: "Always 'ShadowDark'"
        value: "ShadowDark"
      source:
        description: "Which book"
        examples: ["Core", "Cursed Scroll 1"]
    
    properties:
      category:
        description: "Item category"
        options: ["Magic Item", "Potion", "Weapon", "Armor", "Gear", "Treasure"]
      flavor:
        description: "Italicized description of appearance"
        examples:
          - "A smooth, pearly statuette of a running horse."
          - "A gold amulet with a red ruby teardrop at its center."
          - "An acrid, tarry substance in an iron flask with a lead stopper."
      benefit:
        description: "What the item does - the main effect"
        note: "May have multiple benefits"
      bonus:
        description: "For weapons/armor - the mechanical bonus"
        examples: ["+3 plate mail"]
      curse:
        description: "Negative effect (optional)"
        examples: ["You constantly have the sensation of being watched."]
      personality:
        description: "For sentient items - alignment and behavior"
        examples: ["Chaotic. Protests loudly while being used and never agrees that the target is the right choice for extirpation."]
      level_effects:
        description: "For items with level-based scaling (like Potion of Healing)"
        note: "Multiple LV X-Y entries with different effects"
      description:
        description: "Full item description and effects"
    
    source_schema:
      description: "Visual layout patterns in ShadowDark Core PDF"
      header:
        style: "Black banner/bar with white text"
        format: "ALL CAPS name"
        examples: ["ALABASTER DESTRIER", "AMULET OF VITALITY", "POTION OF HEALING"]
      
      flavor_text:
        style: "Italicized"
        position: "First paragraph after header"
        examples:
          - "A smooth, pearly statuette of a running horse."
          - "A gold amulet with a red ruby teardrop at its center."
          - "A glass bottle with a fizzy, lemon-vanilla liquid inside."
      
      properties:
        format: "**Label.** Description text."
        notes:
          - "Labels are bold, followed by period"
          - "Common labels: Benefit, Curse, Bonus, Personality"
          - "Description follows on same line, may span multiple sentences"
        common_labels:
          Benefit: "Main positive effect of the item"
          Curse: "Negative effect (for cursed items)"
          Bonus: "Mechanical bonus (for weapons/armor)"
          Personality: "For sentient items - alignment and behavior"
        examples:
          - "**Benefit.** Once per day, the wielder can speak the command word to turn the statuette into a pegasus that accepts neutral or lawful riders. The statuette remains in this form for 1 hour."
          - "**Benefit.** Your Constitution stat becomes 18 (+4) while wearing this amulet."
          - "**Curse.** You constantly have the sensation of being watched."
          - "**Bonus.** +3 plate mail. Only a lawful worshipper of Saint Terragnis can wear this armor."
          - "**Personality.** Chaotic. Protests loudly while being used and never agrees that the target is the right choice for extirpation."
      
      level_scaling:
        format: "**LV X-Y:** effect"
        notes:
          - "For items with level-based effects"
          - "Each level range on its own line"
          - "Common for potions"
        examples:
          - "**LV 0-3:** 1d6 hit points."
          - "**LV 4-6:** 2d8 hit points."
          - "**LV 7-9:** 3d10 hit points."
          - "**LV 10+:** 4d12 hit points."
      
      full_source_example: |
        ┌─────────────────────────────┐
        │    POTION OF EXTIRPATION    │  ◄── Black banner, white ALL CAPS
        └─────────────────────────────┘
        
        An acrid, tarry substance in an     ◄── Italicized flavor text
        iron flask with a lead stopper.
        
        Benefit. You can pour the potion    ◄── Bold label + period
        on one object or creature filling
        up to a close area. The target is
        utterly removed from reality and
        cannot be returned by anything
        short of a wish spell.
        
        Personality. Chaotic. Protests      ◄── Bold label + period (optional)
        loudly while being used and
        never agrees that the target is
        the right choice for extirpation.
        
        ─────────────────────────────────
        
        ┌─────────────────────────────┐
        │      POTION OF HEALING      │  ◄── Black banner, white ALL CAPS
        └─────────────────────────────┘
        
        A glass bottle with a fizzy,        ◄── Italicized flavor text
        lemon-vanilla liquid inside.
        
        Benefit. The imbiber of this        ◄── Bold label + period
        potion regains hit points based
        on their level.
        
        LV 0-3: 1d6 hit points.             ◄── Level scaling entries
        LV 4-6: 2d8 hit points.
        LV 7-9: 3d10 hit points.
        LV 10+: 4d12 hit points.
    
    full_example: |
      - id: sd_item_potion_of_healing
        name: "Potion of Healing"
        type: Item
        game: ShadowDark
        source: Core
        properties:
          category: "Potion"
          flavor: "A glass bottle with a fizzy, lemon-vanilla liquid inside."
          benefit: "The imbiber of this potion regains hit points based on their level."
          level_effects:
            - level: "0-3"
              effect: "1d6 hit points"
            - level: "4-6"
              effect: "2d8 hit points"
            - level: "7-9"
              effect: "3d10 hit points"
            - level: "10+"
              effect: "4d12 hit points"
    gut_path: "II. OBJECTS"
    taxonomy:
      # Mapped Properties
      category:
         label: "Category"
         source_property: "category"
         options: ["Magic Item", "Potion", "Weapon", "Armor", "Gear", "Treasure"]
      
      # Weapons
      "Usage Category":
        label: "Usage"
        options: ["Melee", "Ranged", "Thrown", "Ammunition"]
      "Physical Form":
        label: "Form"
        options: ["Bladed", "Bludgeoning", "Polearm", "Bow", "Crossbow"]
      "Properties":
        label: "Properties"
        options: ["Finesse", "Two-handed", "Versatile", "Thrown", "Loading"]
      
      # Armor
      "Armor Class":
        label: "AC Type"
        options: ["Light", "Medium", "Heavy", "Shield"]
      
      # Consumables
      "Consumable Form":
        label: "Form"
        options: ["Potion", "Scroll", "Oil", "Ration"]
