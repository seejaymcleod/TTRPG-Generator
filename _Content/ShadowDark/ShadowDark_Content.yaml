- id: sd_monster_the_tarrasque
  name: "The Tarrasque"
  type: Monster
  game: ShadowDark
  source: Core
  properties:
    ac: "22"
    hp: "140"
    mv: "triple near (burrow, swim)"
    level: "30"
    alignment: "N"
    stats:
      str: "7"
      dex: "2"
      con: "5"
      int: "-3"
      wis: "1"
      cha: "-3"
    flavor: "A colossal, four-legged reptile with crocodilian jaws, amber scales, and a diamond-hard, spiked carapace. It towers overhead like a mountain, able to swallow entire villages in one gulp. The tarrasque hibernates deep in the earth or at the bottom of the sea for centuries, only awakening long enough to fill its vast belly in an indiscriminate rampage of terror and destruction. There is only one tarrasque, and it is the most dreaded creature to walk the earth."
  abilities:
    - name: "Legendary"
      desc: "Only damaged by magical sources. Hostile spells targeting the tarrasque are DC 18 to cast."
    - name: "Deep Dweller"
      desc: "Immune to harm from fire and cold. Amphibious."
    - name: "Permanent Death"
      desc: "Cannot be permanently killed unless a wish spell is cast on it while it is at 0 HP."
    - name: "Rampage"
      desc: "In place of attacks, move far in a straight line and make one bite attack. On a hit, triple damage."
    - name: "Reflective Carapace"
      desc: "Immune to rays, blasts, or bolts of energy. 1:6 chance these are reflected back at their originator."
    - name: "Regeneration"
      desc: "Regains 4d10 lost HP at the beginning of its turn."
    - name: "Sever"
      desc: "On a natural attack roll of 18+, the attack also severs a random limb. 1d6: 1. Head, 2-4. Arm, 5-6. Leg."
    - name: "Swallow"
      desc: "DC 18 STR or swallowed whole. Total darkness inside and 4d10 damage per round. Tarrasque regurgitates all swallowed if dealt at least 30 damage in one round to the inside of its gullet."
  actions:
    - name: "Attack"
      desc: "4 thrash (near) +13 (3d10 + sever) and 1 bite (near) +13 (5d10 + sever + swallow)"
  description: "A colossal, four-legged reptile with crocodilian jaws, amber scales, and a diamond-hard, spiked carapace. It towers overhead like a mountain, able to swallow entire villages in one gulp. The tarrasque hibernates deep in the earth or at the bottom of the sea for centuries, only awakening long enough to fill its vast belly in an indiscriminate rampage of terror and destruction. There is only one tarrasque, and it is the most dreaded creature to walk the earth."

- id: sd_monster_the_wandering_merchant
  name: "The Wandering Merchant"
  type: Monster
  game: ShadowDark
  source: Core
  properties:
    ac: "16 (mithral chainmail)"
    hp: "71"
    mv: "near"
    level: "15"
    alignment: "L"
    stats:
      str: "3"
      dex: "3"
      con: "4"
      int: "3"
      wis: "4"
      cha: "5"
    flavor: "A cheerful merchant who appears to be a hale, middle-aged human man with a handlebar mustache. He wears a white shirt, breeches, and leather apron, and he hauls a towering backpack bursting at the seams. Few know the merchant's true nature and origins, though some theorize he is an immortal being or a god (they are not entirely incorrect). The Wandering Merchant always has something useful, far-flung, or incredible to sell at a reasonable price, and there's no telling when or where he'll show up next..."
  abilities:
    - name: "Legendary"
      desc: "Only damaged by magical sources. Hostile spells targeting The Wandering Merchant are DC 18 to cast."
    - name: "Amulet of Rahm-Hotep"
      desc: "In place of attacks, teleport to a random location in the multiverse."
    - name: "Bottomless Bag"
      desc: "Contains 200 gear slots in magical sub-pockets. Weighs as much as a normal backpack. The Wandering Merchant can summon it to himself from anywhere by snapping his fingers."
    - name: "Dice of Truth"
      desc: "A set of three six-sided dice whose rolls cannot be magically or mundanely altered in any way."
    - name: "Lop"
      desc: "On a natural attack roll of 18-20, behead the target."
    - name: "Reckoning"
      desc: "Any creature who steals from The Wandering Merchant develops a curse. Over the next 2d8 days, that creature turns into a cockatrice. This curse can only be lifted by a wish spell or by returning the stolen goods."
    - name: "Strange Lands"
      desc: "The Wandering Merchant does not suffer any ill effects from the natural environment he does not wish to suffer."
  actions:
    - name: "Attack"
      desc: "4 +3 vorpal bastard sword +9 (1d10 + lop)"
  description: "A cheerful merchant who appears to be a hale, middle-aged human man with a handlebar mustache. He wears a white shirt, breeches, and leather apron, and he hauls a towering backpack bursting at the seams. Few know the merchant's true nature and origins, though some theorize he is an immortal being or a god (they are not entirely incorrect). The Wandering Merchant always has something useful, far-flung, or incredible to sell at a reasonable price, and there's no telling when or where he'll show up next..."

