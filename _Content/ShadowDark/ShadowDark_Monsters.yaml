    notes: "\n\t<p><i>A floating mass of rubbery skin crusted with barnacles. Its ten eyestalks writhe like snakes, and a deep, circular scar mars its central body, blinding what was once a large eye above a lipless maw. The Ten-Eyed Oracle stalks the Shadowdark, burbling mad prophesies and somehow moving freely between the lightless fathoms of the earth. The keepers of the deep lore suspect The Ten-Eyed Oracle was once a benevolent ally of mankind, but an unknown calamity drove it to insanity and reckless hatred.</i></p>\n\t\n\t<p><strong>AC</strong> 17, <strong>HP</strong> 85, <strong>ATK</strong> 2d4 eyestalk ray, <strong>MV</strong> near (fly), <strong>S</strong> +4, <strong>D</strong> +5, <strong>C</strong> +4, <strong>I</strong> +5, <strong>W</strong> +4, <strong>Ch</strong> +4, <strong>AL</strong> <strong>C</strong>, <strong>LV</strong> 18</p>\n\t<p><strong>Legendary</strong>. Only damaged by magical sources. Hostile spells targeting The Ten-Eyed Oracle are DC 18 to cast.</p><p><strong>Eyestalk Ray</strong>. Each ray can shoot once per round and target one creature or an object up to 1,000 pounds (up to four on same target).</p><p><strong>Eyestalk Ray: Charm</strong>. [[check 15 cha]] or become ally for 1d4 rounds.</p><p><strong>Eyestalk Ray: Hold</strong>. [[check 15 str]] or paralyzed 1d4 rounds.</p><p><strong>Eyestalk Ray: Sleep</strong>. [[check 15 wis]] or asleep 1d4 rounds.</p><p><strong>Eyestalk Ray: Polymorph</strong>. [[check 15 int]] or turned into vermin for 1d4 rounds.</p><p><strong>Eyestalk Ray: Cancel</strong>. [[check 15 dex]] or all magical effects on target end.</p><p><strong>Eyestalk Ray: Confusion</strong>. [[check 15 wis]] or attack a random ally within near.</p><p><strong>Eyestalk Ray: Telekinesis</strong>. [[check 15 str]] or hover target up to double near.</p><p><strong>Eyestalk Ray: Disintegrate</strong>. [[check 15 dex]] or 5d8 damage (object destroyed).</p><p><strong>Eyestalk Ray: Petrify</strong>. [[check 15 con]] or petrified.</p><p><strong>Eyestalk Ray: Death</strong>. [[check 15 con]] or drop to 0 HP with a death timer of 1.</p>"
    spellcastingAbility: ''
    spellcastingAttackNum: 0
    spellcastingBonus: 0
