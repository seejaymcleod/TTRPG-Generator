    notes: "\n\t<p><i> A cheerful merchant who appears to be a hale, middle-aged human man with a handlebar mustache. He wears a white shirt, breeches, and leather apron, and he hauls a towering backpack bursting at the seams. Few know the merchant's true nature and origins, though some theorize he is an immortal being or a god (they are not entirely incorrect). The Wandering Merchant always has something useful, far-flung, or incredible to sell at a reasonable price, and there's no telling when or where he'll show up next... </i></p>\n\t\n\t<p><strong>AC</strong> 16 (mithral chainmail), <strong>HP</strong> 71, <strong>ATK</strong> 4 +3 vorpal bastard sword +9 (1d10 + lop), <strong>MV</strong> near, <strong>S</strong> +3, <strong>D</strong> +3, <strong>C</strong> +4, <strong>I</strong> +3, <strong>W</strong> +4, <strong>Ch</strong> +5, <strong>AL</strong> L, <strong>LV</strong> 15</p>\n\t<p><strong> Legendary</strong>. Only damaged by magical sources. Hostile spells targeting The Wandering Merchant are DC 18 to cast.</p><p><strong>Amulet of Rahm-Hotep</strong>. In place of attacks, teleport to a random location in the multiverse.</p><p><strong>Bottomless Bag</strong>. Contains 200 gear slots in magical sub-pockets. Weighs as much as a normal backpack. The Wandering Merchant can summon it to himself from anywhere by snapping his fingers.</p><p><strong>Dice of Truth</strong>. A set of three six-sided dice whose rolls cannot be magically or mundanely altered in any way.</p><p><strong>Lop</strong>. On a natural attack roll of 18-20, behead the target.</p><p><strong>Reckoning</strong>. Any creature who steals from The Wandering Merchant develops a curse. Over the next 2d8 days, that creature turns into a cockatrice. This curse can only be lifted by a wish spell or by returning the stolen goods.</p><p><strong>Strange Lands</strong>. The Wandering Merchant does not suffer any ill effects from the natural environment he does not wish to suffer.</p>"
