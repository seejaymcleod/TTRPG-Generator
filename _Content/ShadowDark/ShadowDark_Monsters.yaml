    move: near
    moveNote: ''
    notes: "\n\t<p><i> A skinless mummy-lich wearing a crown set with nine bright gems. Once the head of the ancient, wizardly order of Gehemna, Mordanticus now lives in secret within the sanctum of Gehemna's reigning archmage. He has served as an advisor and historian for centuries, but an enduring enchantment prevents him from speaking of two topics: his origins, and The Ten-Eyed Oracle. </i></p>\n\t\n\t<p><strong>AC</strong> 17, <strong>HP</strong> 89, <strong>ATK</strong> 1 rot touch +8 (1d10 + necrosis) and 3 spell +8, <strong>MV</strong> near, <strong>S</strong> +4, <strong>D</strong> +4, <strong>C</strong> +4, <strong>I</strong> +5, <strong>W</strong> +4, <strong>Ch</strong> +5, <strong>AL</strong> N, <strong>LV</strong> 19</p>\n\t<p><strong> Legendary Undead</strong>. Immune to morale checks. Only damaged by magical sources. Hostile spells targeting Mordanticus are DC 18 to cast.</p><p><strong>Crown of Gehemna</strong>. 3/day, cause a spell being cast within far to fail.</p><p><strong>Necrosis</strong>. [[check 15 con]] or go to 0 HP. Healing spells are DC 15 to cast on target while at 0 HP due to this effect.</p><p><strong>Phylactery</strong>. Cannot be killed while spirit vessel (a diamond) is intact.</p><p><strong>Absorb (INT Spell)</strong>. DC 13. Near, one target. Target loses the ability to cast one random spell until completing a rest, and Mordanticus regains a lost spell of the same tier or less.</p><p><strong>Banish (INT Spell)</strong>. DC 14. All extradimensional creatures within near [[check 15 cha]] or sent back to their home planes.</p><p><strong>Bind (INT Spell)</strong>. DC 12. One humanoid in far paralyzed 1d4 rounds.</p><p><strong>Blast (INT Spell)</strong>. DC 14. One creature in near takes 5d8 damage.</p><p><strong>Phase (INT Spell)</strong>. DC 13. Self. Teleport up to one mile.</p><p><strong>True Name (INT Spell)</strong>. DC 15. Near. Learn the True Name of target.</p>"
    spellcastingAbility: int
    spellcastingAttackNum: 3
    spellcastingBonus: 8
  type: NPC
  game: ShadowDark
  source: ShadowDark Core
