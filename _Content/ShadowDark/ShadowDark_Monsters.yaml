    move: doubleNear
    moveNote: fly
    notes: "\n\t<p><i> A pearl-white lion with feathered wings that stands twenty feet tall. Rathgamnon is Madeera the Covenant's mightiest servant; his blank eyes see far into the depths of time and space. He spends all eternity watching the whirl of the stars from the highest mountain in the realm of mortals, waiting for the celestial alignments that prophesy epochs of weal and woe, titanic changes to the balance of power in the cosmos, or threats to the laws of reality itself. </i></p>\n\t\n\t<p><strong>AC</strong> 17, <strong>HP</strong> 89, <strong>ATK</strong> 2 rend (near) +9 (2d10) and 2 spell +8, <strong>MV</strong> double near (fly), <strong>S</strong> +5, <strong>D</strong> +3, <strong>C</strong> +4, <strong>I</strong> +5, <strong>W</strong> +6, <strong>Ch</strong> +5, <strong>AL</strong> L, <strong>LV</strong> 19</p>\n\t<p><strong> Legendary</strong>. Only damaged by magical sources. Hostile spells targeting Rathgamnon are DC 18 to cast.</p><p><strong>Roar</strong>. In place of attacks, all creatures who can hear within far [[check 18 cha]] or be rendered blind and speechless for 1d4 days.</p><p><strong>Abjure (WIS Spell)</strong>. DC 13. Self. End any hostile magical effects affecting Rathgamnon.</p><p><strong>Abolish (WIS Spell)</strong>. DC 13. One target in far takes 5d8 damage.</p><p><strong>Anchor (WIS Spell)</strong>. DC 14. One target in far [[check 18 str]] or bound and anchored by chains of golden runes for 1d4 rounds.</p><p><strong>Gate (WIS Spell)</strong>. DC 14. Open a portal at a point within near to another location on any plane. Lasts 1d6 rounds or until dismissed.</p><p><strong>Portent (WIS Spell)</strong>. DC 14. Lasts 2d4 rounds. One target in near has advantage or disadvantage on all attack rolls and checks.</p><p><strong>Time Stop (WIS Spell)</strong>. DC 15. Self. Time freezes for everyone except Rathgamnon for 1d4 rounds. Everything that occurs during the time freeze happens simultaneously when the spell ends.</p>"
