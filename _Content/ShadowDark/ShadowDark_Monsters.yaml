    move: tripleNear
    moveNote: burrow, swim
    notes: "\n\t<p><i> A colossal, four-legged reptile with crocodilian jaws, amber scales, and a diamond-hard, spiked carapace. It towers overhead like a mountain, able to swallow entire villages in one gulp. The tarrasque hibernates deep in the earth or at the bottom of the sea for centuries, only awakening long enough to fill its vast belly in an indiscriminate rampage of terror and destruction. There is only one tarrasque, and it is the most dreaded creature to walk the earth. </i></p>\n\t\n\t<p><strong>AC</strong> 22, <strong>HP</strong> 140, <strong>ATK</strong> 4 thrash (near) +13 (3d10 + sever) and 1 bite (near) +13 (5d10 + sever + swallow), <strong>MV</strong> triple near (burrow, swim), <strong>S</strong> +7, <strong>D</strong> +2, <strong>C</strong> +5, <strong>I</strong> -3, <strong>W</strong> +1, <strong>Ch</strong> -3, <strong>AL</strong> N, <strong>LV</strong> 30</p>\n\t<p><strong> Legendary</strong>. Only damaged by magical sources. Hostile spells targeting the tarrasque are DC 18 to cast.</p><p><strong>Deep Dweller</strong>. Immune to harm from fire and cold. Amphibious.</p><p><strong>Permanent Death</strong>. Cannot be permanently killed unless a wish spell is cast on it while it is at 0 HP.</p><p><strong>Rampage</strong>. In place of attacks, move far in a straight line and make one bite attack. On a hit, triple damage.</p><p><strong>Reflective Carapace</strong>. Immune to rays, blasts, or bolts of energy. 1:6 chance these are reflected back at their originator.</p><p><strong>Regeneration</strong>. Regains 4d10 lost HP at the beginning of its turn.</p><p><strong>Sever</strong>. On a natural attack roll of 18+, the attack also severs a random limb. 1d6: 1. Head, 2-4. Arm, 5-6. Leg.</p><p><strong>Swallow</strong>. [[check 18 str]] or swallowed whole. Total darkness inside and 4d10 damage per round. Tarrasque regurgitates all swallowed if dealt at least 30 damage in one round to the inside of its gullet.</p>"
    spellcastingAbility: ''
    spellcastingAttackNum: 0
    spellcastingBonus: 0
  type: NPC
  game: ShadowDark
  source: ShadowDark Core
