    move: near
    moveNote: ''
    notes: "\n\t<p><i> A pale, angular woman in translucent plate mail fashioned from giant scorpion chitin. Obe-Ixx, daughter of Azarumme, rose up from the prehistoric barbarian tribes of Tal-Yool to conquer all in her path. One day, she stood at the steps of an obsidian ziggurat deep within the trackless jungle. Forty nights later, Obe-Ixx emerged as the ur-vampire, bloodlust made flesh. Her dynasty would rise and fall again and again over the coming millennia. </i></p>\n\t\n\t<p><strong>AC</strong> 18 ( +3 plate mail ), <strong>HP</strong> 76, <strong>ATK</strong> 4 greatsword (near) +11 (1d12 + 2 + Moonbite properties) and 1 bite +9 (1d8 + blood drain) and 1 charm, <strong>MV</strong> near (climb, fly), <strong>S</strong> +5, <strong>D</strong> +3, <strong>C</strong> +4, <strong>I</strong> +3, <strong>W</strong> +4, <strong>Ch</strong> +5, <strong>AL</strong> <strong>C</strong>, <strong>LV</strong> 16</p>\n\t<p><strong> Legendary Undead</strong>. Immune to morale checks. Only damaged by magical sources. Hostile spells targeting Obe-Ixx are DC 18 to cast.</p><p><strong>Blood Drain</strong>. Obe-Ixx heals 2d8 HP, target permanently loses 1d6 CON. At 0 CON, target dies and rises as a loyal vampire or vampire spawn (Obe-Ixx chooses).</p><p><strong>Charm</strong>. One humanoid target who can see Obe-Ixx within near, [[check 15 cha]] or under Obe-Ixx's control for 1d4 days.</p><p><strong>Dire Shapechange</strong>. In place of attacks, turn into a giant bat, dire wolf, or back into regular form.</p><p><strong>Moonbite Properties</strong>. +2 greatsword , thrown weapon, returns after being thrown. Spells to heal damage it inflicts are DC 15 to cast.</p><p><strong>Ur-Vampire</strong>. Must sleep in sarcophagus at least once per moon cycle or loses 2d8 HP per day that cannot heal until sleeping in sarcophagus. Takes 3d8 damage each round while in direct sunlight. Cannot be killed unless pierced through heart while at 0 HP with a wooden stake carved from a tree from the Tal-Yool jungle.</p>"
    spellcastingAbility: ''
    spellcastingAttackNum: 0
    spellcastingBonus: 0
  type: NPC
  game: ShadowDark
  source: ShadowDark Core
