- id: sd_spell_acid_arrow
  name: Acid Arrow
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Focus
    range: Far
  description: You conjure a corrosive bolt that hits one foe, dealing 1d6 damage a round. The bolt remains in the target for as long as you focus.
- id: sd_spell_alarm
  name: Alarm
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: 1 day
    range: Close
  description: Send a strobing orb of energy streaking toward a target within range. Choose an energy type from fire, cold, or electricity. The orb deals 3d8 damage and delivers a concussive blast of the chosen energy type. If the energy type is anathema to the target's existence, the orb deals double damage to it.
- id: sd_spell_alchemy
  name: Alchemy
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "3"
    class: Wizard
    duration: Instant
    range: Close
  description: |
    One inanimate object of human size or less you touch turns into another material of equal or lesser value.
- id: sd_spell_alter_self
  name: Alter Self
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard, Witch
    duration: 5 rounds
    range: Self
  description: You magically change your physical form, gaining one feature that modifies your existing anatomy. For example, you can grow functional gills on your neck or bear claws on your fingers. This spell can’t grow wings or limbs.
- id: sd_spell_anathema
  name: Anathema
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Instant
    range: Close
  description: All allies revile and abandon the creature you touch for 1 day. Each time you or your allies harm the target, its former allies may pass a DC 15 Wisdom check to end the effects of the spell.
- id: sd_spell_anima
  name: Anima
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "3"
    class: Wizard
    duration: Focus
    range: Close
  description: |
    You animate the life force of one natural object you touch the size of a horse or less.
    The object becomes a loyal creature for the spell's duration using the below stats. Its level is equal to yours.
    The creature acts on your turn. You may use your action to command it, which it obeys. Otherwise, it does not act.
    AC 10 + LV, HP 4.5 x LV, ATK 2 bash +7 (1d12), MV near, S +4, D +0, C +0, I -4, W +0, Ch +0, AL N, LV *
- id: sd_spell_animate_dead
  name: Animate Dead
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: 1 day
    range: Close
  description: You touch one humanoid’s remains, and it rises as a zombie or skeleton under your control. The remains must have at least three limbs and its head intact. The undead creature acts on your turn. After 1 day, the creature collapses into grave dust.
- id: sd_spell_antimagic_shell
  name: Antimagic Shell
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Focus
    range: Self
  description: An invisible, near-sized cube of null-magic appears centered on you. Within the cube, no spells can be cast. Magic items and spells have no effect in the zone, and no magic can enter. The cube moves with you. Spells such as dispel magic have no effect on it. Another antimagic shell does not affect this one.
- id: sd_spell_arcane_eye
  name: Arcane Eye
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: Focus
    range: Near
  description: You conjure an invisible, grape-sized eye within range. You can see through the eye. It can see in the dark out to near range, fly near on your turn, and squeeze through openings as narrow as a keyhole.
- id: sd_spell_augury
  name: Augury
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest, Witch
    duration: Instant
    range: Self
  description: You interpret the meaning of supernatural portents and omens. Ask the GM one question about a specific course of action. The GM says whether the action will lead to “weal” or “woe.”
- id: sd_spell_barkskin
  name: Barkskin
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "2"
    class: Wizard
    duration: 1 day
    range: Self
  description: |
    Your skin hardens into tough tree bark. Your AC becomes 15 (18 on a critical spellcasting check) for the spell's duration.
    You take double damage from fire while you are under the spell's effects.
- id: sd_spell_befriend
  name: Befriend
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "2"
    class: Wizard
    duration: 5 rounds
    range: Close
  description: |
    A tiny natural creature you touch (such as a mouse or moth) regards you as a friend for the spell's duration.
    You may give the creature one command, which it tries to complete to the best of its ability and intelligence even after the spell ends.
    If the command would directly harm the creature, it abandons the task.
- id: sd_spell_beguile
  name: Beguile
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: Focus
    range: Near
  description: |
    You conjure a convincing visible and audible illusion within range. Creatures who perceive the illusion react to it as though it were real, although it can't cause actual harm. Touching the illusion instantly reveals its false nature.
    You may force a creature who interacts with the illusion to make a DC 15 Wisdom check. If the creature fails, it is enchanted by the illusion for the spell's duration and seeks to protect it.
- id: sd_spell_bless
  name: Bless
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest
    duration: Instant
    range: Close
  description: One creature you touch gains a luck token.
- id: sd_spell_blind_deafen
  name: Blind/Deafen
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest
    duration: Focus
    range: Near
  description: You utter a divine censure, blinding or deafening one creature you can see in range. The creature has disadvantage on tasks requiring the lost sense.
- id: sd_spell_bogboil
  name: Bogboil
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: 5 rounds
    range: Far
  description: You turn a near-sized cube of ground within range into a muddy, boiling bog of quicksand. A creature stuck in the bog can't move and must succeed on a Dexterity check vs. your spellcasting check to free itself.
- id: sd_spell_breath
  name: Breath
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "1"
    class: Wizard
    duration: 10 rounds
    range: Self
  description: |
    You can hold your breath for the spell's duration.
- id: sd_spell_broomstick
  name: Broomstick
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Focus
    range: Self
  description: You conjure a flying broomstick in your hand. The broomstick's rider can fly a near distance each round and can hover in place.
- id: sd_spell_burning_hands
  name: Burning Hands
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Close
  description: You spread your fingers with thumbs touching, unleashing a circle of flame that roars out to a close area around where you stand. Creatures within the area of effect take 1d6 damage, and flammable objects catch fire.
- id: sd_spell_cacklerot
  name: Cacklerot
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: Focus
    range: Close
  description: One target you touch of LV 4 or less collapses helplessly with disturbing, pained laughter for the spell's duration.
- id: sd_spell_cast_out
  name: Cast Out
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "3"
    class: Seer
    duration: Focus
    range: Far
  description: |
    You turn a creature aside, throwing it out of your presence.

    Choose a creature you can see. For the spell's duration, that creature can't come within near range of you. It can still attack you from outside of near range.
- id: sd_spell_cat_s_eye
  name: Cat's Eye
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: Focus
    range: Self
  description: Your irises grow to fill your eyes and your pupils turn into black, vertical slits. You can see invisible creatures and secret doors for the spell's duration.
- id: sd_spell_cauldron
  name: Cauldron
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: 1 round
    range: Close
  description: |
    You conjure a bubbling cauldron next to you. It can produce one of the following effects:
    - Any broken mundane item placed inside the cauldron is repaired.
    - A fat, croaking toad leaps out and follows your instructions for the next 3 rounds.
    - You can place up to 3 item slots of items inside the cauldron. The cauldron expels these items the next time you cast this spell (expelling items counts as the cauldron's single effect).
- id: sd_spell_chant
  name: Chant
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "1"
    class: Seer
    duration: Focus
    range: Self
  description: |
    You begin an unearthly chant that lifts your vision beyond its ordinary limitations.

    For the spell's duration, you can see all invisible and hidden things as though they were plainly visible. This spell does not allow you to see in a way that you could not normally, such as in darkness or through walls.
- id: sd_spell_charm_person
  name: Charm Person
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard, Witch
    duration: 1d8 days
    range: Near
  description: You magically beguile one humanoid of LV 2 or less within near range, who regards you as a friend for the duration. The spell ends if you or your allies do anything harmful to the target. The target knows it was magically charmed after the spell ends.
- id: sd_spell_cleansing_weapon
  name: Cleansing Weapon
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest
    duration: 5 rounds
    range: Close
  description: One weapon you touch is wreathed in purifying flames. It deals an additional 1d4 damage (1d6 vs. undead) for the duration.
- id: sd_spell_cloak_of_night
  name: Cloak of Night
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: 8 rounds
    range: Self
  description: Your wrap yourself in a swirling cloak of shadows. For the spell's duration, your armor class becomes 17 (20 on a critical spellcasting check). You have advantage on Dexterity checks to sneak and hide for the spell's duration.
- id: sd_spell_cloudkill
  name: Cloudkill
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: 5 rounds
    range: Far
  description: A putrid cloud of yellow poison fills a near-sized cube within range. It spreads around corners. Creatures inside the cloud are blinded and take 2d6 damage at the beginning of their turns. A creature of LV 9 or less that ends its turn fully inside the cloud dies.
- id: sd_spell_command
  name: Command
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest
    duration: Focus
    range: Far
  description: You issue a verbal command to one creature in range who can understand you. The command must be one word, such as “kneel.” The target obeys the command for as long as you focus. If your command is ever directly harmful to the creature, it may make a Charisma check vs. your last spellcasting check. On a success, the spell ends.
- id: sd_spell_commune
  name: Commune
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest
    duration: Instant
    range: Self
  description: You seek your god's counsel. Ask the GM up to three yes or no questions. The GM truthfully answers "yes" or "no" to each. If you cast this spell more than once in 24 hours, treat a failed spellcasting check for it as a critical failure, instead.
- id: sd_spell_confusion
  name: Confusion
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: Focus
    range: Near
  description: You mesmerize one creature you can see in range. The target can't take actions, and it moves in a random direction on its turn. If the target is LV 9+, it may make a WIS check vs. your last spellcasting check at the start of its turn to end the spell.
- id: sd_spell_control_water
  name: Control Water
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest, Wizard
    duration: Focus
    range: Far
  description: You move and shape water. You can cause a section of water up to 100 feet in width and depth to change shape, defy gravity, or flow in a different direction.
- id: sd_spell_coven
  name: Coven
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Instant
    range: Self
  description: You call upon the magic you share with your fellow witches. You regain the use of one tier 3 spell or lower that you can no longer cast for the day. After successfully casting this spell, you can't do so again until you complete a rest.
- id: sd_spell_create_undead
  name: Create Undead
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: 1 day
    range: Close
  description: You conjure a vengeful undead creature to do your bidding. When you cast this spell, you choose to summon either a wight or wraith. It appears next to you and is under your control. The undead creature acts on your turn. After 1 day, it melts away into smoke.
- id: sd_spell_cure_wounds
  name: Cure Wounds
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Priest
    duration: Instant
    range: Close
  description: Your touch restores ebbing life. Roll a number of d6s equal to 1 + half your level (rounded down). One target you touch regains that many hit points.
- id: sd_spell_curse
  name: Curse
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: Permanent
    range: Close
  description: |
    A creature you touch is afflicted by one of the following curses:
    - Hideous boils and warts
    - All food tastes of ash
    - Voice becomes shrill
    - Disturbing nightmares
    - Always lose at gambling
    - An ally turns into an enemy
    - Fear of something ordinary
- id: sd_spell_detect_magic
  name: Detect Magic
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: Focus
    range: Near
  description: You can sense the presence of magic within near range for the spell's duration. If you focus for two rounds, you discern its general properties. Full barriers block this spell.
- id: sd_spell_detect_thoughts
  name: Detect Thoughts
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Focus
    range: Near
  description: You peer into the mind of one creature you can see within range. Each round, you learn the target’s immediate thoughts. On its turn, the target makes a Wisdom check vs. your last spellcasting check. If the target succeeds, it notices your presence in its mind and the spell ends. "Magic is simply the art of doing and undoing." -Creeg, human wizard
- id: sd_spell_dimension_door
  name: Dimension Door
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard, Witch
    duration: Instant
    range: Self
  description: You teleport yourself and up to one other willing creature to any point you can see.
- id: sd_spell_disintegrate
  name: Disintegrate
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Far
  description: A green ray shoots from your finger and turns a creature or object into ash. A target creature of LV 5 or less instantly dies. If it is LV 6+, it takes 3d8 damage, instead. A non-magical object up to the size of a large tree is destroyed.
- id: sd_spell_dispel_magic
  name: Dispel Magic
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Instant
    range: Near
  description: End one spell that affects one target you can see in range.
- id: sd_spell_divination
  name: Divination
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard, Witch
    duration: Instant
    range: Self
  description: You throw the divining bones or peer into the blackness between the stars, seeking a portent. You can ask the GM one yes or no question. The GM truthfully answers "yes" or "no." If you cast this spell more than once in 24 hours, treat a failed spellcasting check for it as a critical failure, instead.
- id: sd_spell_divine_vengeance
  name: Divine Vengeance
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest
    duration: 10 rounds
    range: Self
  description: You become the divine avatar of your god's wrath, wreathed in holy flames or a black aura of smoldering corruption. For the spell's duration, you can fly a near distance, your weapons are magical, and you have a +4 bonus to your weapon attacks and damage.
- id: sd_spell_dominion
  name: Dominion
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest
    duration: 10 rounds
    range: Near
  description: Mighty beings come to your aid. The beings must have a combined total of 16 levels or less. Chaotic PCs summon demons/devils, and lawful or neutral PCs summon angels. The beings act of free will to aid you on your turn. After 10 rounds, they return to their realms. You cannot cast this spell again until you complete penance.
- id: sd_spell_dreamwalk
  name: Dreamwalk
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Instant
    range: Close
  description: You and any willing creatures you choose within close range step into the dream of a sleeping creature you name that is on your same plane. You and anyone traveling with you can step out of the creature, appearing next to it as if having teleported there.
- id: sd_spell_earthquake
  name: Earthquake
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Double near
  description: |
    The earth shakes violently and splits open, swallowing creatures down to their doom.
    All creatures standing on the ground within double near of you take 4d6 damage.
    Each affected creature of LV 9 or less must pass a DEX check equal to the damage they took or else be swallowed by the earth, never to be seen again.
- id: sd_spell_enfeeble
  name: Enfeeble
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Instant
    range: Close
  description: "A creature you touch has a random stat reduced to 3 (-4) for one week. Roll a d6 to determine which stat: 1. Strength, 2. Dexterity, 3. Constitution, 4. Intelligence, 5. Wisdom, 6. Charisma. If you fail the spellcasting check, you have a random stat reduced to 3 for a week instead."
- id: sd_spell_evoke_rage
  name: Evoke Rage
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "1"
    class: Seer
    duration: 1d4 rounds
    range: Close
  description: |
    You call out the berserk rage locked inside someone.

    One willing humanoid you touch enters a berserk state. The target is immune to morale checks, has ADV on STR checks and melee attacks, and deals +1d4 damage for the spell's duration.

    If the target does not attack another creature on its turn, the spell ends.
- id: sd_spell_eyebite
  name: Eyebite
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Instant
    range: Near
  description: One creature you target takes 1d4 damage, and it can't see you until the end of its next turn.
- id: sd_spell_fabricate
  name: Fabricate
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: 10 rounds
    range: Near
  description: This spell can't target creatures. You turn a tree-sized collection of raw materials into a finished work. For example, you convert a pile of bricks or rocks into a bridge. The finished work converts back to raw materials when the spell ends.
- id: sd_spell_fate
  name: Fate
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "2"
    class: Seer
    duration: Instant
    range: Near
  description: |
    You painfully twist the golden threads of a creature's fate.

    One creature you target in range takes 1d10 damage and loses any luck tokens it has.
- id: sd_spell_feather_fall
  name: Feather Fall
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Self
  description: You may make an attempt to cast this spell when you fall. Your rate of descent slows so that you land safely on your feet.
- id: sd_spell_finger_of_death
  name: Finger of Death
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Instant
    range: Close
  description: One creature you touch of LV 9 or less dies. Treat a failed spellcasting check for this spell as a critical failure, and roll the mishap with disadvantage.
- id: sd_spell_fireball
  name: Fireball
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Instant
    range: Far
  description: You hurl a small flame that erupts into a fiery blast. All creatures in a near-sized cube around where the flame lands take 4d6 damage.
- id: sd_spell_fixed_object
  name: Fixed Object
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: 5 rounds
    range: Close
  description: An object you touch that weighs no more than 5 pounds becomes fixed in its current location. It can support up to 5,000 pounds of weight for the duration of the spell.
- id: sd_spell_flame_strike
  name: Flame Strike
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest
    duration: Instant
    range: Far
  description: You call down a holy pillar of fire, immolating one creature you can see within range. The target takes 2d6 damage.
- id: sd_spell_floating_disk
  name: Floating Disk
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: 10 rounds
    range: Near
  description: You create a floating, circular disk of force with a concave center. It can carry up to 20 gear slots. It hovers at waist level and automatically stays within near of you. It can’t cross over drop-offs or pits taller than a human.
- id: sd_spell_fly
  name: Fly
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: 5 rounds
    range: Self
  description: Your feet lift from the ground, and you take to the air like a hummingbird. You can fly near for the spell's duration and are able to hover in place.
- id: sd_spell_fog
  name: Fog
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Focus
    range: Close
  description: A thick cloud of fog blooms in a close area around you, making you hard to see. The cloud moves with you. Attacks against creatures in the cloud have disadvantage.
- id: sd_spell_freyas_omen
  name: Freya's Omen
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "4"
    class: Seer
    duration: 1d6 rounds
    range: Self
  description: |
    For the spell's duration, you do not lose the ability to cast a spell if you fail its spellcasting check.

    If you critically fail a spellcasting check, you may reroll your check once. You must use the new result.
- id: sd_spell_frog_rain
  name: Frog Rain
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: Instant
    range: Far
  description: A rain of indignant frogs pelts a near-sized cube around a point you can see within range. All creatures within the frog rain take 1d6 damage. Any surviving frogs hop away and disappear.
- id: sd_spell_gaseous_form
  name: Gaseous Form
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: 10 rounds
    range: Self
  description: You and your gear turn into a cloud of smoke for the spell's duration. You can fly and pass through any gap that smoke could. You can sense the terrain and any movement around you out to a near distance. You can't cast spells while in this form.
- id: sd_spell_glassbones
  name: Glassbones
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: Focus
    range: Close
  description: A creature you touch becomes fragile. It takes double damage for the spell's duration.
- id: sd_spell_hallucinate
  name: Hallucinate
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "3"
    class: Seer
    duration: Focus
    range: Near
  description: |
    One creature you target in near whose level is less than or equal to your own is overcome by visions of what might yet come to pass.

    For the spell's duration, the target cannot act on its turn unless it passes a Wisdom check equal to your last spellcasting check.
- id: sd_spell_heal
  name: Heal
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest
    duration: Instant
    range: Close
  description: One creature you touch is healed to full hit points. You cannot cast this spell again until you complete a rest.
- id: sd_spell_hold_monster
  name: Hold Monster
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Focus
    range: Near
  description: You paralyze one creature you can see within range. If the target is LV 9+, it may make a STR check vs. your last spellcasting check at the start of its turn to end the spell.
- id: sd_spell_hold_person
  name: Hold Person
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Focus
    range: Near
  description: You magically paralyze one humanoid creature of LV 4 or less you can see within range.
- id: sd_spell_hold_portal
  name: Hold Portal
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: 10 rounds
    range: Near
  description: You magically hold a portal closed for the duration. A creature must make a successful STR check vs. your spellcasting check to open the portal. The knock spell ends this spell.
- id: sd_spell_holy_weapon
  name: Holy Weapon
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Priest
    duration: 5 rounds
    range: Close
  description: One weapon you touch is imbued with a sacred blessing. The weapon becomes magical and has +1 to attack and damage rolls for the duration.
- id: sd_spell_howl
  name: Howl
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Instant
    range: Near
  description: All enemies within near range of you must immediately make a morale check. This spell does not affect creatures that are immune to morale checks.
- id: sd_spell_hypnotize
  name: Hypnotize
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Focus
    range: Near
  description: One creature of LV 3 or less that can see you is rendered stupefied. Breaking the creature's line of sight to you allows it to make a DC 15 Charisma check. On a success, the spell ends.
- id: sd_spell_illusion
  name: Illusion
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Focus
    range: Far
  description: You create a convincing visible and audible illusion that fills up to a near-sized cube in range. The illusion cannot cause harm, but creatures who believe the illusion is real react to it as though it were. A creature who inspects the illusion from afar must pass a Wisdom check vs. your last spellcasting check to perceive the false nature of the illusion. Touching the illusion also reveals its false nature.
- id: sd_spell_instill
  name: Instill
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "1"
    class: Wizard
    duration: 5 rounds
    range: Self
  description: |
    One weapon you wield is imbued with life force. It becomes a +1 weapon for the spell's duration.
    If the weapon is a staff, it deals d6 damage instead of d4.
- id: sd_spell_invisibility
  name: Invisibility
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard, Witch
    duration: 10 rounds
    range: Close
  description: A creature you touch becomes invisible for the spell’s duration. The spell ends if the target attacks or casts a spell.
- id: sd_spell_judgment
  name: Judgment
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest
    duration: 5 rounds
    range: Close
  description: You instantly banish a creature you touch, sending it and all possessions it carries to face the judgment of your god. You can banish an intelligent creature of LV 10 or less. When the creature returns in 5 rounds, it has been healed to full hit points if its deeds pleased your god. It has been reduced to 1 hit point if its deeds angered your god. If your god can't judge its actions, it is unchanged.
- id: sd_spell_knock
  name: Knock
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Instant
    range: Near
  description: A door, window, gate, chest, or portal you can see within range instantly opens, defeating all mundane locks and barriers. This spell creates a loud knock audible to all within earshot.
- id: sd_spell_lay_to_rest
  name: Lay To Rest
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest
    duration: Instant
    range: Close
  description: You instantly send an undead creature you touch to its final afterlife, destroying it utterly. You can target an undead creature of LV 9 or less.
- id: sd_spell_levitate
  name: Levitate
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Focus
    range: Self
  description: You can float a near distance vertically per round on your turn. You can also push against solid objects to move horizontally.
- id: sd_spell_lightning_bolt
  name: Lightning Bolt
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Instant
    range: Far
  description: You shoot a blue-white ray of lightning from your hands, hitting all creatures in a straight line out to a far distance. Creatures struck by the lightning take 3d6 damage.
- id: sd_spell_locusts
  name: Locusts
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "3"
    class: Wizard
    duration: Focus
    range: Near
  description: |
    A disorienting cloud of angry, biting locusts fills an area around you out to near.
    The cloud moves with you as you move. You are not affected by it.
    Creatures in the area of effect take 1d10 damage per round at the start of their turn. They must pass a CON check equal to your last spellcasting check or be unable to move on their turn.
- id: sd_spell_lokis_trickery
  name: Loki's Trickery
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "4"
    class: Seer
    duration: Instant
    range: Near
  description: |
    You are filled with Loki's hypnotic guile. Creatures who hear you speak will alter their own beliefs and memories to match your suggestion.

    Target one creature who can hear and understand you within range. You make one plausible statement, true or not.

    The target must make a Wisdom check vs. your spellcasting check. If it fails, it now believes what you stated as though it were fact, regardless of what it knows.
- id: sd_spell_mage_armor
  name: Mage Armor
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: 10 rounds
    range: Self
  description: An invisible layer of magical force protects your vitals. Your armor class becomes 14 (18 on a critical spellcasting check) for the spell’s duration.
- id: sd_spell_magic_circle
  name: Magic Circle
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Focus
    range: Near
  description: Conjure a circle of runes around yourself and name a type of creature. Creatures of the chosen type cannot attack or cast hostile spells on anyone inside the circle, and can't possess, compel, or beguile anyone inside the circle.
- id: sd_spell_magic_missile
  name: Magic Missile
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Far
  description: You have advantage on your check to cast this spell. A glowing bolt of force streaks from your open hand, dealing 1d4 damage to one target.
- id: sd_spell_magnetize
  name: Magnetize
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "2"
    class: Wizard
    duration: 5 rounds
    range: Close
  description: |
    One object you touch up to the size of a horse becomes powerfully magnetized.
    It attracts all smaller magnetic objects within near.
    If it can move, it is pulled toward larger magnetic objects within near. A metal creature must pass a STR check equal to your spellcasting check to resist.
- id: sd_spell_mass_cure
  name: Mass Cure
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest
    duration: Instant
    range: Near
  description: All allies within near range of you regain 2d6 hit points.
- id: sd_spell_mirror_image
  name: Mirror Image
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: 5 rounds
    range: Self
  description: Create a number of illusory duplicates of yourself equal to half your level rounded down (minimum 1). Each time a creature attacks you, the attack misses and causes one of the duplicates to evaporate. If all the illusions have disappeared, the spell ends.
- id: sd_spell_mistletoe
  name: Mistletoe
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: 1d8 days
    range: Near
  description: Two creatures you can see within near of you become enchanted with each other for 1d8 days. Each time one of the affected creatures takes damage, it may make a DC 15 Charisma check. On a success, the spell ends.
- id: sd_spell_misty_step
  name: Misty Step
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Instant
    range: Self
  description: In a puff of smoke, you teleport a near distance to an area you can see.
- id: sd_spell_moonbeam
  name: Moonbeam
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: Instant
    range: Far
  description: A wavering ray of silvery moonlight strikes one creature within far. It takes 3d6 damage.
- id: sd_spell_mother_of_night
  name: Mother of Night
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Instant
    range: Self
  description: You beseech the Mother of Night to lend you power. Make a single wish, stating it as exactly as possible. Your wish occurs, as interpreted by the GM. If you fail this spellcasting check, the Mother of Night pulls you into The Nightfall for judgment. You can't cast this spell again until you appease her demands.
- id: sd_spell_mycelium
  name: Mycelium
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "4"
    class: Wizard
    duration: Instant
    range: Self
  description: |
    You connect your mind with the earth's vast fungi network.
    Ask the GM one question of up to 15 words. The GM answers truthfully using up to 15 words.
    If you cast this spell more than once in 24 hours, treat a failed spellcasting check for it as a critical failure instead.
- id: sd_spell_naming
  name: Naming
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Close
  description: |
    You learn the True Name ( ß RPG pg. 319) of one creature you touch.
    If the creature is willing, you may give it a new True Name . A creature may only change its True Name once in its lifetime.
    If it does so, its alignment changes to your alignment.
- id: sd_spell_nightmare
  name: Nightmare
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "4"
    class: Witch
    duration: Focus
    range: On the same plane
  description: You visit the dreams of one sleeping creature, sending it heart-stopping nightmares. You can target a creature whose level is less than or equal to half your level rounded down (minimum 1). The target must be sleeping, and you must have seen it before in person. If you successfully focus on this spell for 3 rounds in a row, the creature dies of fright.
- id: sd_spell_oak_ash_thorn
  name: Oak, Ash, Thorn
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Focus
    range: Self
  description: For the spell's duration, faeries, demons, and devils can't attack you. These beings also can't possess, compel, or beguile you.
- id: sd_spell_odins_wisdom
  name: Odin's Wisdom
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "4"
    class: Seer
    duration: 1d6 rounds
    range: Self
  description: |
    For the spell's duration, add your level as an additional bonus to your Wisdom checks and spellcasting checks.
- id: sd_spell_oxidize
  name: Oxidize
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Close
  description: |
    One inanimate object you touch the size of a door or less ages d100 years.
- id: sd_spell_passwall
  name: Passwall
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: 5 rounds
    range: Close
  description: A tunnel of your height opens in a barrier you touch and lasts for the duration. The passage can be up to near distance in length and must be in a straight line.
- id: sd_spell_pillar_of_salt
  name: Pillar Of Salt
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest
    duration: Focus
    range: Near
  description: A creature you target turns into a statue made of hardened salt. You can target a creature you can see of LV 5 or less. If you focus on this spell for 3 rounds in a row, the transformation becomes permanent.
- id: sd_spell_pin_doll
  name: Pin Doll
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Focus
    range: On the same plane
  description: You pin a piece of hair or flesh taken from one creature to a small, burlap doll the spell conjures. On your turn while focusing on this spell, you can push a pin into the doll. Each time you do this, the creature who the hair or flesh belonged to takes 2d6 damage. After this spell ends, the piece of hair or flesh burns to ash.
- id: sd_spell_plane_shift
  name: Plane Shift
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest, Wizard
    duration: Instant
    range: Close
  description: You fold space and time, transporting yourself and all willing creatures within close range to a location on another plane of your choice. Unless you have been to your intended location before, you appear in a random place on the destination plane.
- id: sd_spell_poison
  name: Poison
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: 5 rounds
    range: Close
  description: One worn or carried object you touch becomes toxic for the spell's duration. Any creature in contact with the object at the start of its turn takes 1d6 damage.
- id: sd_spell_polymorph
  name: Polymorph
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard, Witch
    duration: 10 rounds
    range: Touch
  description: You transform a creature you touch into another natural creature you choose of equal or smaller size. Any gear the target carries melds into its new form. The target gains the creature's hit points, armor class, and attacks, but retains its intellect. If the target goes to 0 hit points, it reverts to its true form at half its prior hit points. You can target any willing creature with this spell, or an unwilling creature whose level is less than or equal to half your level rounded down (minimum 1).
- id: sd_spell_potion
  name: Potion
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "1"
    class: Seer
    duration: Instant
    range: Close
  description: |
    As a part of casting this spell, you must bless a single drink of any liquid.

    The liquid gains healing properties for 1 day. A creature who imbibes it may end the effects of one poison or may immediately stop dying (the creature remains at 0 HP).
- id: sd_spell_power_word_kill
  name: Power Word Kill
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Near
  description: Utter the Word of Doom. One creature you target of LV 9 or less dies if it hears you. Treat a failed spellcasting check for this spell as a critical failure, and roll the mishap with disadvantage.
- id: sd_spell_prismatic_orb
  name: Prismatic Orb
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Far
  description: Send a strobing orb of energy streaking toward a target within range. Choose an energy type from fire, cold, or electricity. The orb deals 3d8 damage and delivers a concussive blast of the chosen energy type. If the energy type is anathema to the target's existence, the orb deals double damage to it.
- id: sd_spell_prophecy
  name: Prophecy
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Priest
    duration: Instant
    range: Self
  description: Commune directly with your god for guidance. Ask the GM one question. The GM answers the question truthfully using the knowledge your god possesses. You cannot cast this spell again until you complete penance.
- id: sd_spell_protection_from_energy
  name: Protection From Energy
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: 10 minutes
    range: Close
  description: One creature you touch becomes impervious to the wild fury of the elements. Choose fire, cold, or electricity. For the spell's duration, the target is immune to harm from energy of the chosen type.
- id: sd_spell_protection_from_evil
  name: Protection From Evil
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Priest, Wizard
    duration: Focus
    range: Close
  description: For the spell's duration, chaotic beings have disadvantage on attack rolls and hostile spellcasting checks against the target. These beings also can't possess, compel, or beguile it. When cast on an already-possessed target, the possessing entity makes a CHA check vs. the last spellcasting check. On a failure, the entity is expelled.
- id: sd_spell_puppet
  name: Puppet
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Focus
    range: Close
  description: One humanoid creature of LV 2 or less you touch becomes ensnared by your movements. On your turn, the creature mimics all your movements. If mimicking you would cause the creature to directly harm itself or an ally, it can make a DC 15 Charisma check. On a success, it resists mimicking you.
- id: sd_spell_ragnarok
  name: Ragnarok
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "5"
    class: Seer
    duration: Instant
    range: Far
  description: |
    You look deep into the strands of fate, learning the final destiny of one soul after the battle of Ragnarok. Do they live, or die?

    Choose one creature in range. You can only target the same creature with this spell one time.

    That creature must pass a CON check equal to your spellcasting check or die instantly.
- id: sd_spell_raven
  name: Raven
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "2"
    class: Seer
    duration: Instant
    range: Unlimited
  description: |
    You whisper a message to Odin's own ravens, and they carry it across all worlds to its recipient.

    Speak a short sentence, and the name of its recipient, dead or alive. That creature hears your utterance whispered in its mind.
- id: sd_spell_read_the_runes
  name: Read The Runes
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "2"
    class: Seer
    duration: Instant
    range: Self
  description: |
    You ask the gods a question and cast the runestones, interpreting the meaning of the results.

    Ask the Game Master one yes or no question. The Game Master truthfully answers "yes" or "no."
- id: sd_spell_rebuke_unholy
  name: Rebuke Unholy
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest
    duration: Instant
    range: Near
  description: Rebuke creatures who oppose your alignment, forcing them to flee. You must present a holy symbol to cast this spell. If you are lawful or neutral, this spell affects demons, devils, and outsiders. If you are chaotic, this spell affects angels and natural creatures of the wild. Affected creatures within near of you must make a CHA check vs. your spellcasting check. If a creature fails by 10+ points and is equal to or less than your level, it is destroyed. Otherwise, on a fail, it flees from you for 5 rounds.
- id: sd_spell_regenerate
  name: Regenerate
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest
    duration: Focus
    range: Close
  description: A creature you touch regains 1d4 hit points on your turn for the duration. This spell also regrows lost body parts.
- id: sd_spell_resilient_sphere
  name: Resilient Sphere
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: 5 rounds
    range: Close
  description: You conjure a weightless, glassy sphere around you that extends out to close range. For the spell's duration, nothing can pass through or crush the sphere. You can roll the sphere a near distance on your turn.
- id: sd_spell_restoration
  name: Restoration
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest
    duration: Instant
    range: Close
  description: With the touch of your hands, you expunge curses and illnesses. One curse, illness, or affliction of your choice affecting the target creature ends.
- id: sd_spell_sacrifice
  name: Sacrifice
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "2"
    class: Seer
    duration: Instant
    range: Close
  description: |
    As a part of casting this spell, you must ritually sacrifice a living creature of LV 2 or higher.

    The target you touch gains a bonus to their next check or attack roll equal to the sacrificed creature's level.
- id: sd_spell_scrying
  name: Scrying
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard, Witch
    duration: Focus
    range: Self
  description: You look into a crystal ball or reflecting pool, calling up images of a distant place. For the spell's duration, you can see and hear a creature or location you choose that is on the same plane. This spell is DC 18 to cast if you try to scry on a creature or location that is unfamiliar to you. Each round, creatures you view may make a Wisdom check vs. your last spellcasting check. On a success, they become aware of your magical observation.
- id: sd_spell_sending
  name: Sending
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Wizard
    duration: Instant
    range: Unlimited
  description: You send a brief, mental message to any creature with whom you are familiar who is on the same plane.
- id: sd_spell_shadowdance
  name: Shadowdance
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: 3 rounds
    range: Near
  description: You spin shadowstuff into a convincing visible and audible illusion at a point within near. The illusion can be as big as a person and can move within a near range of where it appeared. The illusion can't affect physical objects. Touching the illusion reveals its false nature.
- id: sd_spell_shapechange
  name: Shapechange
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard, Witch
    duration: Focus
    range: Self
  description: You transform yourself and any gear you carry into another natural creature you've seen of level 10 or less. You gain the creature's hit points, armor class, and attacks, but retain your intellect. If you go to 0 hit points while under the effects of this spell, you revert to your true form at 1 hit point.
- id: sd_spell_shield_of_faith
  name: Shield Of Faith
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Priest
    duration: 5 rounds
    range: Self
  description: A protective force wrought of your holy conviction surrounds you. You gain a +2 bonus to your armor class for the duration.
- id: sd_spell_silence
  name: Silence
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: Focus
    range: Far
  description: You magically mute sound in a near cube within the spell’s range. Creatures inside the area are deafened, and any sounds they create cannot be heard.
- id: sd_spell_sleep
  name: Sleep
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Near
  description: You weave a lulling spell that fills a near-sized cube extending from you. Living creatures in the area of effect fall into a deep sleep if they are LV 2 or less.
- id: sd_spell_smite
  name: Smite
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest
    duration: Instant
    range: Near
  description: You call down punishing flames on a creature you can see within range. It takes 1d6 damage.
- id: sd_spell_soul_jar
  name: Soul Jar
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "5"
    class: Witch
    duration: Permanent
    range: Close
  description: You transfer the soul of one creature you touch of LV 9 or less into a vessel, such as a jar. The creature's body becomes comatose, but it doesn't die. If the vessel opens or breaks, the creature's soul returns to its body. You can possess the empty body with your own spirit, taking control of it. Your body becomes comatose during this time. If the body dies while you possess it, your soul returns to your body.
- id: sd_spell_soulbind
  name: Soulbind
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "2"
    class: Seer
    duration: Focus
    range: Close
  description: |
    You seal the soul of a living creature, preventing magic from leeching into it.

    One creature you touch becomes nearly impervious to all magic. For the spell's duration, all other spells targeting the creature (harmful or helpful) are DC 18 to cast.

    This spell ends as soon as the target is affected by another spell.
- id: sd_spell_speak_with_dead
  name: Speak With Dead
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "3"
    class: Priest, Wizard, Witch
    duration: Instant
    range: Close
  description: A dead body you touch answers your questions in a distant, wheezing voice. You can ask the dead body up to three yes or no questions (one at a time). The GM truthfully answers "yes" or "no" to each. If you cast this spell more than once in 24 hours, treat a failed spellcasting check for it as a critical failure, instead.
- id: sd_spell_spidersilk
  name: Spidersilk
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: Focus
    range: Self
  description: Sticky spidersilk covers your hands and feet. For the spell's duration, you can walk on vertical surfaces as easily as if it were flat ground.
- id: sd_spell_stoneskin
  name: Stoneskin
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: 10 rounds
    range: Self
  description: Your skin becomes like granite. For the spell's duration, your armor class becomes 17 (20 on a critical spellcasting check).
- id: sd_spell_summon_extraplanar
  name: Summon Extraplanar
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Focus
    range: Near
  description: Reach into the outer planes and summon an elemental or outsider of LV 7 or less under your control. If you lose focus, you lose control and the creature becomes hostile towards you and your allies. A spellcasting check is required to return the creature to the outer planes.
- id: sd_spell_summon_storm
  name: Summon Storm
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "4"
    class: Wizard
    duration: 10 rounds
    range: 1 mile
  description: |
    You summon a violent storm that affects an area around you out to one mile for the duration.
    The storm brings darkened skies, severe wind, and driving rain.
    For the duration of the spell, you can cast control water ( ShadowDark RPG pg. 57), even if you do not know the spell.
    For the duration of the spell, you can cast lightning bolt (ShadowDark RPG pg. 64 ) , even if you do not know the spell.
- id: sd_spell_swarm
  name: Swarm
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Focus
    range: Far
  description: A dense swarm of biting bats, rats, or locusts appears in a nearsized cube around a point you can see within range. All creatures that start their turn within the swarm take 2d6 damage and are blinded.
- id: sd_spell_telekinesis
  name: Telekinesis
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: Focus
    range: Far
  description: Lift a creature or object weighing 1,000 pounds or less and move it in any direction or hold it in place.
- id: sd_spell_teleport
  name: Teleport
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Close
  description: Teleport yourself and willing creatures within close range to a specified location on your same plane with a 50% chance of arriving off-target if the location is unknown.
- id: sd_spell_thors_thunder
  name: Thor's Thunder
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "4"
    class: Seer
    duration: Instant
    range: Far
  description: |
    Thor casts down a bolt of lightning to strike one target. The target takes 3d6 damage.
- id: sd_spell_toadstool
  name: Toadstool
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "2"
    class: Witch
    duration: Instant
    range: Self
  description: You conjure a plump, speckled toadstool in your hand. It disappears at the end of your next turn. A creature that eats the toadstool regains 1d6 hit points.
- id: sd_spell_trance
  name: Trance
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "1"
    class: Seer
    duration: Instant
    range: Close
  description: |
    You enter a trance, catching small glimpses of a creature's fate. One humanoid creature you touch (you can't target yourself) gains a luck token. It can't have more than one luck token at once.
- id: sd_spell_treeshape
  name: Treeshape
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "3"
    class: Wizard
    duration: 10 rounds
    range: Self
  description: |
    You and your gear turn into a treant with the below stats for the spell's duration.
    You do not have the treant's Animate Tree talent.
    You cannot cast spells while under the effect of this spell.
    You retain your INT, WIS, and CHA stats.
    AC 14, HP 38, ATK 2 slam +8 (1d12) or 1 rock (far) +8 (2d6), MV near, S +4, D -1, C +2, I *, W *, Ch *, AL N, LV 8
- id: sd_spell_truespeech
  name: Truespeech
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "2"
    class: Wizard
    duration: Instant
    range: Close
  description: |
    A natural creature you touch understands and can communicate with you in the true language of all animals.
    You can ask the creature one yes or no question. The GM truthfully answers "yes" or "no."
    If you cast this spell more than once on the same creature in 24 hours, treat a failed spellcasting check for it as a critical failure instead.
- id: sd_spell_valkyrie
  name: Valkyrie
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "5"
    class: Seer
    duration: 10 rounds
    range: Near
  description: |
    You summon a valkyrie to your aid. She appears in a location within near and acts of her own free will to help you. She returns to Valhalla when the spell ends.

    You can't cast this again until you complete penance.
- id: sd_spell_void_stare
  name: Void Stare
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Focus
    range: Far
  description: Your eyes turn black as you look into the dark between the stars. One creature of LV 6 or less you can see falls under your control. You decide its actions during its turn.
- id: sd_spell_wall_of_force
  name: Wall Of Force
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Wizard
    duration: 5 rounds
    range: Near
  description: Conjures a contiguous, transparent wall of force in a near-sized area of your choice that blocks physical objects on the same plane.
- id: sd_spell_web
  name: Web
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Wizard
    duration: 5 rounds
    range: Far
  description: Creates a near-sized cube of sticky spider web within range. Creatures stuck in the web must succeed on a Strength check vs. your spellcasting check to free themselves.
- id: sd_spell_whisper
  name: Whisper
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "3"
    class: Witch
    duration: Instant
    range: Close
  description: You whisper into another creature's ear, planting a false memory in its mind. You describe one brief, false memory that the target believes is true going forward. If you fail this spellcasting check, the GM chooses a short, false memory to plant in your mind instead.
- id: sd_spell_whisperwind
  name: Whisperwind
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 4
  properties:
    tier: "1"
    class: Wizard
    duration: Instant
    range: Far
  description: |
    You send a brief, whispered message that reaches any creature in range.
- id: sd_spell_willowman
  name: Willowman
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Instant
    range: Near
  description: You call upon the Willowman to appear in one creature's mind, filling it with supernatural terror. Choose one creature of LV 2 or less within range. That creature must immediately make a morale check. Even creatures that are not normally subject to morale checks (such as undead) must do so.
- id: sd_spell_wish
  name: Wish
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "5"
    class: Wizard
    duration: Instant
    range: Self
  description: Alter reality with a single wish, interpreted by the GM. A failed spellcasting check is treated as a critical failure and rolls the mishap with disadvantage.
- id: sd_spell_witchlight
  name: Witchlight
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 1
  properties:
    tier: "1"
    class: Witch
    duration: Focus
    range: Near
  description: You summon a floating marsh light that bobs in the air and casts light out to a close radius around it. The light can change colors and take on vague shapes. It can float up to a near distance on your turn.
- id: sd_spell_wolfshape
  name: Wolfshape
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "3"
    class: Seer
    duration: Focus
    range: Self
  description: |
    You and your gear transform into a wolf for the spell's duration. You assume the wolf's STR, DEX, CON, HP, AC, speed, attacks, and physical characteristics, but retain your INT, WIS, and CHA.

    You can cast spells in this form. If you go to 0 HP, you revert to your true shape at 0 HP.

    If you are level 5+, you can transform into a dire wolf or a winter wolf instead.
- id: sd_spell_world_serpent
  name: World Serpent
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "5"
    class: Seer
    duration: Focus
    range: Close
  description: |
    The torturous venom of the World
- id: sd_spell_world_tree
  name: World Tree
  type: Spell
  game: ShadowDark
  source: Cursed Scroll 3
  properties:
    tier: "5"
    class: Seer
    duration: Focus
    range: Close
  description: |
    The roots of the life-giving World Tree wrap around the soul of a creature you touch.

    For the spell's duration, the target can't be brought below 1 HP.
- id: sd_spell_wrath
  name: Wrath
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "4"
    class: Priest
    duration: 10 rounds
    range: Self
  description: Weapons become magical +2 and deal an additional d8 damage for the spell's duration.
- id: sd_spell_zone_of_truth
  name: Zone Of Truth
  type: Spell
  game: ShadowDark
  source: Core
  properties:
    tier: "2"
    class: Priest
    duration: Focus
    range: Near
  description: Compel a creature you can see to speak the truth while within range. They cannot utter a deliberate lie.
