# ShadowDark Input Schema v1.1
# Instructions for parsing raw content into the Content Schema.

game: ShadowDark
version: "1.1"

conventions:
  stats:
    S: "str"
    D: "dex"
    C: "con"
    I: "int"
    W: "wis"
    Ch: "cha"
  
  alignments:
    L: "Lawful"
    N: "Neutral"
    C: "Chaotic"

extraction_rules:
  # Global formatting rules
  id_format: "sd_{type}_{snake_case_name}"

  # Content Types Detection & Schema
  types:
    Monster:
      detection: "Contains 'AC', 'HP', 'ATK' headers in a block"
      type_prefix: "monster"
      instructions: "Extract standard monster stat block. IGNORE independent bold headers that lack stats (e.g. Group Headers like 'BASILISK CULTISTS'). A Monster MUST have AC and HP lines immediately following the name or flavor text."
      sections:
        required: ["Header", "Stats", "Actions"]
        optional: ["Flavor", "Abilities"]

  # Section Mapping
  sections:
    header:
      instructions: "Extract Name and Flavor text. WARN: If multiple names appear, ensure each is a distinct stat block. Do not merge siblings."
      fields:
        name: "ALL CAPS name line (Must be followed by Flavor or AC/HP)"
        flavor: "Italicized text immediately following name"

    stats_block:
      instructions: "Extract core stats. AC and HP are mandatory."
      fields:
        ac: "AC {value}"
        hp: "HP {value}"
        mv: "MV {value}"
        atk: "ATK {value}"
        level: "LV {value}"
        alignment: "AL {value}"
    
    attributes:
      instructions: "Extract the single line containing all ability modifiers."
      fields:
        stats_line: "The full stats string (e.g. 'S +3, D +1, C +1, I -3, W +0, Ch -3')"

    properties:
      instructions: "Extract Spell/Item properties."
      fields:
        tier: "Tier {value}"
        class: "class {value}"
        duration: "Duration: {value}"
        range: "Range: {value}"
