filename: DreadThingonomicon_1000AbnormalWights.yaml
game: DreadThingonomicon
setting: Fantasy
type: Bestiary
tablename: 1000AbnormalWights
tables: 
  - tablename: Physical Description
    results:
      - One of the creature’s arms has lost all its flesh; nothing but gleaming white bone remains.
      - Still clad in ripped and torn furs, this creature had its throat ripped out before it died.
      - The creature’s face is horridly decomposed; muscles and sinew can easily be made out through the ruin of its rotting cheeks.
      - The back of this creature’s skull is caved in; a putrid mass of dark grey brain is clearly visible.
      - The foul creature’s shriveled throat is horribly blackened and desiccated.
      - Long claw marks run up the creature’s legs. The rotting flesh around the wounds is mottled with sullen red splotches and part-healed scars.
      - The creature has suffered a vicious head wound; one of its eyes hangs from its socket and jiggles disconcertingly when the creature moves.
      - This creature’s face is locked into a horrible grimace of fear and revulsion.
      - As it advances, this creature begins to weep thick, oozing dark-red tears.
      - This creature’s back is a mass of claw and bite marks. The wounds are so deep, gleaming white ribs are visible.
  
  - tablename: Battle Tactics
    results:
      - This wight tries to sneak around the back and prefers to fight weak, unarmored opponents.
      - This wight clutches a spear and hurls it before charging.
      - Before it charges, the creature screams unintelligibly at the top of its lungs.
      - Hungry for flesh, but cautious, this wight fights defensively unless it believes its foe is no real threat.
      - If injured by a melee weapon, the wight tries to rip it from its attacker’s hands.
      - If the wight slays an opponent, it immediately feasts on the yet-warm corpse (until it rises to join the undead).
      - This creature has a shattered left leg. It uses a broken spear as a crutch and only moves at half speed.
      - This wight wields a huge two-handed axe. It seeks out the toughest-looking opponent and hacks it to death.
      - Sneaky and cunning, this wight always seeks a flanking position in battle.
      - This wight tries to rip a defender’s shield from its target’s hand. If successful, it uses the shield as a missile weapon.
  
  - tablename: Treasure
    results:
      - Four golden rings gleam on the fingers of this wight’s right hand. Three are plain (worth 20 gp each). The fourth is a signet ring (worth 50 gp) and bears a rampant swan sigil.
      - This wight yet wears a belt with a pouch attached. The pouch holds a score of marbles and a set of slender lock picks in their own small supple leather pouch.
      - The wight has a sheathed dagger at its belt. The wickedly sharp dagger is of gleaming steel and shimmers when exposed to the light.
      - The wight wears a grimy silver necklace festooned with charms. The charms—also silver but covered in dirt and dried gore—depict several good-aligned deities' symbols. The whole is worth 50 gp.
      - A steel potion vial fills a secret compartment in the heel of one of the wight’s knee-length hard leather boots. The vial is broad and flat to fit into the heel but is sadly empty. Only perceptive characters find the vial.
      - A packet of moldy trail rations fills the wight’s pouch. The food is inedible but is packed in a cloth wrapping decorated with a simple map of the surrounding wilderness. The cloth must be cleaned to reveal the map’s secrets—which could feature a hitherto unknown adventure site.
      - "The wight has a longsword scabbard on its belt. The sword is long lost, but the sheath is a thing of beauty: black leather picked out with silvered thread. An intricate design of a fishing net decorates the scabbard’s tip. It is worth 15 gp."
      - The wight carries a moldy pouch full of coins (17 cp, 45 sp, and 3 gp). When slain, the wight falls, which bursts open the pouch. Coins spill all over the floor.
      - This wight has a pair of battered, gold-rimmed spectacles shoved into a pocket in its cloak. The lenses are missing, but the spectacles are worth 4 gp as scrap.
      - A broken arrow protrudes from the wight’s left calf. The missile's tip is of a preternaturally tough, dark grey metal—the fabulously rare and valuable adamantine.