filename: ShadowDark_MishapsDiabolic.yaml
game: ShadowDark
setting: Fantasy
type: Adventure, Powers
tablename: MishapsDiabolic
tables:
  - tablename: Tier1-3
    results:
      # Corrected: Multi-roll directive should be directly in the array
      - ["Diablerie! ", { roll: 2, exclude: true }]
      - "Wither! You take 1d6 damage per spell tier"
      - "Newt! You turn into a tiny, 1 hit point newt for 3 rounds. You can't cast spells in this form"
      - "Shune's baleful gaze! You can't cast this spell and another random spell again for a week"
      - "Thieving fairies! You lose a random piece of gear"
      - "Cobwebs! Mental cobwebs cloud your mind; you can't cast this spell again for a week"
      - "Cackles! You fall to the ground in a fit of cackling, unable to do anything but laugh for the next 3 rounds"
      - "Double trouble! You lose the ability to cast a random spell until you complete a rest"
      - "Swamp gas! The air fills with sulfurous gas in a near-sized cube around you. All creatures who end their turn in it are blinded and take 1d6 damage. It lasts 3 rounds"
      - "Bat! An angry bat appears on your head, flapping and clinging to your face. You are blinded for 3 rounds or until you can toss the beastie away from you"
      - "Salt! You're surrounded by a ring of salt and can't touch it or pass through it until something breaks the ring"
      - "Siphon! You have disadvantage on casting spells of the same tier or lower for the next 10 rounds"
  - tablename: Tier4-5
    results:
      # Corrected: Multi-roll directive should be directly in the array
      - ["Maelstrom! ", { roll: 2, exclude: false }]
      - "Ruin! You take 1d8 damage per spell tier"
      - "Mind rot! You permanently forget one random spell"
      - "The Willowman! You summon The Willowman (who is angry with you) in a space near to you. He stays for 1d6 rounds before disappearing from whence he came"
      - "Accursed imps! Cackling imps from hell swarm you, stealing three pieces of random gear and flapping away"
      - "Lightning blast! You deal 3d6 damage to yourself and all nearby creatures"
      - "Cold iron! Spikes of cold iron lance from the ethereal realm, piercing you. You take 2d6 damage and are paralyzed for 2 rounds"
      - "Mother of Night! You displease the Dark Mother and lose the ability to cast this spell until atoning to her"
      - "Catatonia! You stare blankly and can't take any actions for the next hour"
      - "Tongue of dog! Your tongue lolls every time you try to cast a spell of a random tier, ruining the magic. This persists until you complete a rest"
      - "Fiddlesticks! You have disadvantage on casting all spells for the next 10 rounds"
      - "Nemesis! Somewhere, a child is born who will grow up to become a mighty, sworn enemy to you"
