filename: DreadThingonomicon_1000AbnormalGhouls.yaml
game: DreadThingonomicon
setting: Fantasy
type: Bestiary
tablename: 1000AbnormalGhouls
tables: 
  - tablename: Physical Description
    results:
      - This foul beast wears blood-spattered once-fine clothes.
      - One of the creature’s ears is missing—all that remains is a livid red scar.
      - More emaciated than its fellows, the claws on this creature’s left hand are broken.
      - With but one eye, this ghoul looks almost comical; however, its remaining eye blazes with hate and hunger.
      - Tufts of blond hair cling to the creature’s scalp.
      - Dried blood coats the creature’s chin and chest.
      - Still wearing torn and bloody clothes, this creature only has one boot; its other foot is little more than a stump—its toes seemingly gnawed away.
      - The creature clutches the shard of a jagged sword in its right hand and licks the weapon’s splintered blade as it stalks forward.
      - This creature’s neck is laid open—the white glimmer of its spine is visible behind its writhing muscles and pallid, shriveled skin.
      - Bizarrely elongated ears—perhaps reminiscent of an elf’s—grow from this horrid creature’s head.
  - tablename: Battle Tactics
    results:
      - This starving ghoul immediately feasts on any slain combatant—even one of its own—and only resumes fighting if attacked.
      - The ghoul stays low and goes for its opponent’s legs, in an attempt to trip its target.
      - The ghoul screeches as it rushes into combat and loudly howls every time it injures its prey.
      - As it stalks forward, this ghoul licks dried blood from its chin with its elongated, blackened tongue.
      - Clutching two skulls, which it uses as improved missile weapons, the ghoul skirts combat in an attempt to get at the party’s (soft-skinned and vulnerable) spellcasters.
      - This ghoul unhesitatingly attacks the nearest opponent.
      - This ghoul is ravenous. If it downs an opponent, it immediately drags it away to feast in private.
      - Stronger than its fellow, this ghoul grapples and pins its opponent so its allies may feast on living prey.
      - This ghoul has a dim recollection of its previous life. If it finds a discarded weapon, it uses it in battle.
      - This ghoul is a rarity of its kind. It is a coward and flees if the battle seems lost. If captured, it is very talkative if it seems cooperation may save its “life.”
  - tablename: Treasure
    results:
      - The ghoul wears a silver earring (worth 5 gp); its twin is missing—long since torn from the creature’s ear.
      - Three small bronze rings set with colored glass—nothing more than costume jewelry—adorn the ghoul’s left hand. Each ring is worth 1 sp.
      - The creature wears a belt from which hangs a bloodstained pouch containing 3 gp.
      - The creature was once a thief. Its worn boots contain a hidden compartment in each heel; each holds a single platinum coin (but only perceptive characters find this hidden treasure).
      - In life, this poor unfortunate had a penchant for piercings and wore four small silver bars (each worth 1 gp) in each ear.
      - The ghoul wears a shredded once-fine shirt; silver thread (worth 5 gp) decorates its collar and cuffs.
      - Incongruously, in life, this poor fellow had three false gold teeth. If they are extracted—a foul, dangerous task during which the character could contract ghoul fever—they are worth 3 gp.
      - The ghoul wears thick, torn trousers. It has a hidden fine silver dagger (worth 90 gp) strapped to its left shin.
      - The creature wears a single gold ring set with a tiny black stone (an onyx) on a broken, swollen finger. The ring (worth 50 gp) can only be removed by cutting off the finger.
      - This creature has a stud piercing its overly-long, blackened tongue. Only a perceptive character searching the body spots the stud (worth 20 gp), which can only be salvaged by removing the tongue.
