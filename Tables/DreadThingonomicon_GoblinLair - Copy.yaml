filename: DreadThingonomicon_GoblinLair.yaml
game: DreadThingonomicon
setting: Fantasy
type: Lair
tablename: Goblin Lair
tables:
  - name: General Activities
    results:
      - Patrolling their lair
      - Shirking their duties (drinking, gambling, sleeping etc.)
      - Carrying water
      - Disposing of rubbish
      - Escorting a prisoner
      - Watching for intruders
      - Chasing an escaped slave or prisoner
      - Repairing something such as a door, weapon etc.
      - Moving foodstuffs or other heavy items about the lair
      - Loitering
      - Decorating something with graffiti
      - Arguing
      - Baiting a prisoner or small animal
      - Eating
      - Failing to watch for intruders (they could be asleep, drunk etc.)
      - Preparing to go on a scouting mission
      - Brawling with each other
      - Plotting against their chieftain, leader, or another enemy
      - Nefariously sneaking about
      - Making a lot of noise—perhaps shouting or singing
  - name: Minor Random Encounters
    results:
      - The characters hear whistling from the direction they are heading. A few moments later, a goblin female carrying an empty water jug wanders around the corner. If she gets the chance, she screams, hurls the jug at the nearest intruder's head, and then flees.
      - The characters hear whistling from the direction they are heading. A few moments later, a goblin female carrying a young child with her. She screams for help and tries to hold off the characters while her child escapes to raise the alarm.
      - The characters discover a goblin scratching some graffiti into the wall with a sharp stone. The goblin has not noticed them. Investigations reveal the goblin is writing derogatory comments about the tribe's chief.
      - These two young warriors have stolen a flask of watery wine and are enjoying it somewhere out of the way. They are drunk.
      - The characters interrupt two goblins brawling. Totally caught up in their own fight, they have not heard the characters' approach.
      - Suddenly the sound of many goblins chanting a battle song reaches the party's ears. After a few ragged verses, the singing fades away.
      - Two goblins each drag a sack of rubbish toward the entrance. At the sight of the characters, they drop the sacks and flee. The rubbish spills onto the floor creating an area of difficult, slippery (and smelly) terrain.
      - Two goblin children have cornered a rat and are poking at it with sharp sticks. Their rapacious cries betray their presence before the characters stumble into view. If left to their own devices, they quickly kill the rat and begin skinning it.
      - Two goblins have sneaked off for some “quiet time” together. Lost in each other’s company, they are completely oblivious to the characters.
      - This goblin is lurking in the hopes of catching and killing his rival. The characters’ arrival gives him an idea. He offers to give them information on the layout of the lair, where the guards are and so on, if they promise to kill his enemy (a particularly large goblin who always wears a black hood and carries a wickedly notched sword).
  - name: Outside a Goblin Lair
    results:
      - Yellowing bones are tied to the branches of a stunted bush growing nearby the entrance to the tribe’s lair. Tied onto the bush with ribbons, bits of twine, and thin strips of leather, the bones clack together in the breeze.
      - A gallimaufry of tracks mars the ground. Scraps of broken equipment lie scattered about.
      - Scorch marks mar several trees in the immediate vicinity (showing where the goblins have practiced with fire).
      - A deep, wide fire pit has been dug into the ground a score of paces from the entrance tunnel. Ash and fragments of burnt wood fill the hole and on windy days, the ash fills the air like a fine mist. Inquisitive characters also find bones of several animals (probably horses or ponies and suchlike) buried amongst the ash.
      - A fallen tree lies across the obvious trail leading to the goblin lair. Perceptive characters can spot the tell-tale signs of tracks behind the tree, suggesting the goblins sometimes keep watch here for intruders.
      - A rudimentary campsite lies amid a small stand of trees filling a nearby hollow. The slashed and bloody remains of several tents still flap listlessly in the breeze. Nothing of value remains at the site, which appears to be at least several months old.
      - Crude paintings of humanoids with big ears carrying wicked knives and serrated swords decorate several boulders. The artwork is simplistic at best.
      - About 100-foot from the lair, the beginnings of a pit block the trail where it passes between two large boulders. Nearby are cut tree branches and a pile of leaves (or other suitable camouflage) destined to cover the pit when it is finished. The pit is only about three-foot deep when discovered.
      - A moldy goblin corpse lies on its front, partially hidden from view. A serrated dagger juts from its back. The corpse has been comprehensively looted of all valuables—even its shoes have been stolen—but the killer could not remove the dagger as it's tightly wedged between two bones.
      - A large tree—much bigger than its companions—looms over the approaches to the lair. Perceptive characters spot a knotted rope hanging down from its trunk and a small (currently unoccupied) observation platform built high up amid its branches. Is it the breeze making the knotted rope sway gently or has a goblin sentry recently rushed to warn the tribe of the party's approach?
