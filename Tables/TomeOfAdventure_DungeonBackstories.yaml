filename: TomeOfAdventure_DungeonBackstories.yaml
game: TomeOfAdventure
setting: Fantasy
type: Places
tablename: DungeonBackstories
tables:
  - tablename: BigPictureBackstories
    subTables:
      - tablename: WhyNowDangerous_FactorOne
        results: 
          - Inhabitants were changed
          - Inhabitants defeated
          - Inhabitants massacred
          - Inhabitants abandoned place
          - Inhabitants physically altered
          - Construction (recent or ancient) was done
          - Inhabitants changed beliefs          
          - Inhabitants mentally altered
          - Inhabitants mentally and physically altered
          - Original inhabitants departed the place
          - The place became hostile to civilization
          - The place became filled with traps or deadly barriers
          - The place was shut off from the world
          - The original inhabitants became decadent
          - The inhabitants broke into two groups
          - A cataclysm or natural disaster took place
          - Poisons were used
          - Deadly beings were made
          - Leaders were slain or imprisoned
          - Raiding began
      - tablename: WhyNowDangerous_FactorTwo
        results:           
          - In connection with an ancient curse
          - In connection with savages
          - In connection with rampaging nonhuman tribes
          - In connection with a dispute between powerful monsters/individuals
          - In connection with something unexpected being unearthed
          - In connection with forbidden knowledge
          - In connection with unexpected facts being discovered
          - In connection with a disease
          - In connection with magical research
          - In connection with a strange belief
          - In connection with promises made by a powerful being
          - In connection with the use of strange substances
          - In connection with the discovery of valuable substances
          - After contact with sinister beings
          - After a religious or philosophical dispute
          - After strange omens 
          - In connection with excessive pride and hubris
          - In connection with the theft of an important item
          - In connection with black magic
          - In connection with a war
      - tablename: RoughTimeframe
        results:
        - "1000 years ago"
        - "[100 years ago, 5]"
        - "[10 years ago, 5]"
        - "[1 year ago, 5]"
        - "[1 month ago, 4]"
  - tablename: CapsuleAreaBackstories
    customDisplay: "[{selectedResult, CapsuleAreaTypes}]"
    subTables:
      - tablename: ItemBasedBackstories
        customDisplay: "{Items} {ItemLocationRelationships} {ItemOtherFactorInvolved} {RoughTimeframe}"
        subTables: 
        - tablename: Items
          results: 
            - Body or corpse
            - Cargo
            - Cattle or livestock
            - Clue
            - Evidence of crime
            - Evidence of
            - innocence
            - Gold or jewelry
            - Magic item
            - Map
            - Message or letter
            - Monster
            - Mysterious sealed
            - container
            - Ownership papers
            - Religious item
            - Ship or unusual means of travel
            - Statue or idol
            - Symbol of authority
            - Unusual animal (familiar, mascot, pet, prize cow, etc.)
            - Vehicle (possibly with cargo)
            - Weapon (siege engine, sword, etc)
        - tablename: ItemLocationRelationships
          results: 
            - Allowed something to happen that never should have happened
            - Arrived mysteriously
            - Caused a tragic course of events here
            - Could have changed the tragic course of events here
            - Disappeared mysteriously
            - Is/are stored here
            - Prevented a terrible mistake at the last minute
            - Was brought here against orders, against tradition, or against laws
            - Was created here and remains here
            - Was created here but is now gone
            - Was introduced in order to cause a problem
            - Was once, or is now, needed to complete an important project here
            - Was supposed to be created here, but the attempt failed or was interrupted
            - Was supposed to have been delivered here by owner, creator, or purchaser
            - Was supposed to have been delivered here by thieves
            - Was used here as the evidence (whether true or false) causing a person to be killed by a mob, by associates, by followers, or by the verdict of one who judges.
            - Was used here for a crime such as arson, murder, kidnapping.
            - Was used in a rescue, liberation, release, healing, or reconciliation
            - Was/were destroyed here 
            - Was/were stored here but now gone
        - tablename: ItemOtherFactorInvolved
          results: 
            - A long-standing hatred or feud
            - A new plan or change in direction
            - A person with a false identity
            - A physical accident
            - An accident involving the timing of events
            - An invasion, incursion, intrusion, infestation, or unwanted guest
            - An unexpected transformation
            - Bragging, showing off, or showing power (possibly catastrophically)
            - Calling in a favor, debt, or agreement
            - Family identity
            - Forgery
            - Inability to act
            - Insanity
            - Living, existing, or surviving  longer than normal (longevity, immortality, Undeath, or preservation).
            - Love affair
            - No honor among thieves
            - Preservation of tradition or status quo
            - Rightful inheritance
            - Sickness
            - Unquestioning loyalty to a person or a cause
        - tablename: RoughTimeframe
          results:
            - "1000 years ago"
            - "[100 years ago, 5]"
            - "[10 years ago, 5]"
            - "[1 year ago, 5]"
            - "[1 month ago, 4]"    
      - tablename: PersonBasedBackstories
        customDisplay: "{PersonInvolvedWithLocation} {PersonRelationshipToLocation} {LastImportantEventAtLocation} {OptionalAdditionalFactor} {RoughTimeframe}"
        subTables: 
          - tablename: PersonInvolvedWithLocation
            results: 
              - Adventurer(s)
              - Agent or diplomat
              - Cleric or religious leader such as shaman
              - Criminal/outlaw
              - Intelligent monster
              - Noble or leader
              - Magic-user (relatively weak)
              - Messenger
              - Saboteur
              - Demon or similar creature
              - Horrible thing
              - Secret murderer or assassin
              - Magic-user (powerful, or known in legends or songs)
              - One with control over the physical surroundings
              - One who is known to help others, but exacts a heavy price
              - One with a changeable nature, multiple forms, or multiple identities.
              - One with a sense of humor, possibly macabre
              - One who interprets laws of some kind, possibly a secret law
              - One whose power resides in being believed by others
          - tablename: PersonRelationshipToLocation
            results:
              - Hideout
              - Place of burial
              - Prison
              - Place of delivery
              - Place of training
              - Secret hiding place for possession(s)
              - Place of auguries or receiving advice. Note- the advice could be quite mundane, such as financial advice, or might be very unusual specific. 
              - Place where things are processed or changed
              - Normal place of residence
              - Place where things are grown
              - Place where things are destroyed or deconstructed
              - Place where something (possibly the person) manifests itself
              - Place whence communication is possible
              - Place for friend, ally, pet, familiar, steed, or companion
              - Place of birth, creation, or where personal power was originally gained
              - Place where person’s identity or appearance changes or was changed
              - Place of guilt
              - Place where the evidence of person’s secret is stored, concealed, or cannot be removed
              - Place where there is a source
          - tablename: LastImportantEventAtLocation
            results: 
              - Food, drink, or something being eaten
              - Music
              - Murder
              - Theatrical performance or a faked event
              - Gambling
              - Lovers’ tryst
              - Gladiatorial type of contest
              - Execution
              - Singing or an unusual sound     
              - Treachery, cheating, or a rigged event
              - The fuel for an event
              - A surprising document (or other message)
              - The escape of something or someone- maybe the person, maybe someone (thing) else.
              - An assassination attempt
              - An argument
              - The completion of a promise or obligation       
              - Rendering of a judgment
              - Long-awaited revenge
              - A discovery            
          - tablename: OptionalAdditionalFactor
            results:      
            - Someone or something knew more than it was expected to know
            - An accident of timing
            - Something had become impure or tainted
            - The person engineered a double-cross, or was the victim of one
            - Justice was served in an ironic fashion
            - A Pyrrhic victory (victory that leaves the victor catastrophically damaged in some way)
            - A Hobson’s choice (neither option is desirable)
            - The outcome was absolutely the opposite of what one would have expected or could have anticipated
            - The outcome left an unusual but valuable treasure behind 10 yrs
            - The outcome created an item that is magical, significant, or otherwise very useful to a band of adventurers
            - The outcome created an item, resonance, or situation that is very dangerous to intruders
            - The outcome is generally known and perhaps is even legendary, but no one knew where it happened … until now.
            - History tries to repeat itself in this location, for some reason
            - The event was intended by someone to affect the person’ssuperior
            - The event was intended by someone to establish the person’s power
            - The event was intended to erase the effect of something, or to return things tonormal
            - The event was cunningly orchestrated by a third party
            - The event was accidental and unintended 
            - The event involved secret knowledge or secret power – either an attempt to gain it, or an attempt to use it.            
          - tablename: RoughTimeframe
            results:
              - "1000 years ago"
              - "[100 years ago, 5]"
              - "[10 years ago, 5]"
              - "[1 year ago, 5]"
              - "[1 month ago, 4]"    
  - tablename: CapsuleAreaTypes
    results:
      - "{ItemBasedBackstories}"
      - "{PersonBasedBackstories}"
        
