filename: DreadThingonomicon_1000AbnormalZombies.yaml
game: DreadThingonomicon
setting: Fantasy
type: Bestiary
tablename: 1000AbnormalZombies
tables: 
  - name: Physical Description
    results:
      - One side of the creature’s face is nothing more than a suppurating, bloody mess; one of its eyes is missing.
      - The zombie’s left arm is unnaturally bent at the elbow. As the zombie moves, shards of bone break through its rotting flesh.
      - Clad in blood-soaked peasant clothes, this person clearly suffered horrendous wounds before death.
      - A huge chunk of this zombie’s stomach is missing; a few strands of entrails droop from the gaping wound, creating a skirt of sorts hanging down toward the zombie’s knees.
      - This zombie’s head lolls from side to side in a disturbing, unnatural fashion; its neck is clearly broken.
      - This zombie has no legs below the knee. Consequently, it crawls about, leaving a bloody slime trail in its wake.
      - This zombie’s neck is partially severed; muscles and bone are visible through the gore.
      - This corpulent zombie is naked and filled with noxious gases. If struck with a sharp melee weapon, it explodes coating adjacent creatures with blood, bone, and viscera.
      - This zombie has no jaw. Blood and gore cover its chest.
      - A gaping wound pierces this creature’s rib cage, exposing the desiccated organs.
  - name: Battle Tactics
    results:
      - This zombie is much slower than its companions due to a broken leg. It moves at half speed.
      - As it advances, this zombie stumbles and falls. In the next round, it struggles back to its feet.
      - This zombie carries a melee weapon. Every round, it has a 50% chance of accidentally using the weapon.
      - This zombie has a shield strapped to its arm. Thus, its armor class is slightly better than its brethren.
      - This zombie fixes its dead, baleful gaze on one target and focuses on that individual above all others.
      - Freshly dead, this zombie leaves a wide trail of slippery blood and viscera behind it.
      - This zombie tries to grapple opponents instead of beating them to death. If successful, it begins biting.
      - This zombie is fast and easily outpaces its fellows.
      - This zombie has a smashed voice box. It yips and cackles in a similar way to a hunting jackal as it approaches.
      - This zombie moans and groans as it approaches its prey.
  - name: Treasure
    results:
      - This zombie wears a wide bloodstained leather belt which seems worthless at first glance. If the belt is cleaned, however, a complex pattern of stitches emerges, depicting what seems to be a section of dungeon complete with a secret room!
      - A golden hoop earring hangs from one of the zombie’s decomposing ears. The plain band is worth 2 gp.
      - This zombie wears fine, knee-high leather boots that create an audible clacking sound on stone flooring. If cleaned, the boots are worth 3 gp, but moving quietly in them is hard.
      - A woven leather necklace hangs around the zombie’s neck. Perceptive characters spot four thin golden threads hidden within. Each thread is worth 5 gp.
      - This zombie has a finger wedged in its mouth which wears a thin golden ring decorated with beautifully etched leaves and vines (worth 25 gp); foul-smelling saliva covers the band.
      - A slender silver chain encircles one of the zombie’s ankles. Four small charms—representing the four elements—hang from the anklet. It is worth 10 gp.
      - A gore-coated dagger juts from the zombie’s chest. The wickedly sharp silver dagger is wedged between two rib bones. It is worth 90 gp.
      - This zombie wears the slashed and stained remnants of a silk doublet. It is essentially worthless, but a skilled seamstress could harvest enough silk for several hankies and the like.
      - Slipped within its knee-high leather boots, this zombie carries a small, sharp dagger. Its pommel has a clenched fist design.
      - This zombie wears a cloak sporting a deep cowl. Perceptive characters find two platinum coins sewn into the hem.
