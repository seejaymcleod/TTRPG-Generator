filename: ShadowDark_CharacterGenerator.yaml
game: ShadowDark
setting: Fantasy
type: Adventure
tablename: CharacterGenerator
tables:
  - tablename: Name
    results: 
      - "{ShadowDark_NPC|NameBySyllable}"
  - tablename: NameByAncestry
    results:
      - "{ShadowDark_NPC|NPC Names by Ancestry}" 
  - tablename: Ancestry
    results:
      - "{ShadowDark_NPC|Ancestry}"
  - tablename: Strength
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
  - tablename: Dexterity
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
  - tablename: Constitution
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
  - tablename: Intelligence
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
  - tablename: Wisdom
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
  - tablename: Charisma
    results:
      - "[{3d6},{useReferenceTable{AbilityModifiers}{thisResult[0]}}]"
referenceTables:
  - tablename: AbilityModifiers
    entries:
      - key: "2-3"
        value: "-4"
      - key: "4-5"
        value: "-3"
      - key: "6-7"
        value: "-2"
      - key: "8-9"
        value: "-1"
      - key: "10-11"
        value: "+0"
      - key: "12-13"
        value: "+1"
      - key: "14-15"
        value: "+2"
      - key: "16-17"
        value: "+3"
      - key: "18-19"
        value: "+4"
      - key: "20"
        value: "+5"