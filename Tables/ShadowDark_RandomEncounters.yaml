filename: ShadowDark_RandomEncounters.yaml
game: ShadowDark
setting: Fantasy
type: Adventure
tablename: Random Encounters
inputField: [Charisma Modifier, number]
tables:
  - tablename: Distance
    results: 
      - [Close, 1]
      - [Near, 3]
      - [Far, 2]
  - tablename: Activity
    results: 
      - [Hunting, 6]
      - [Eating, 9]
      - [Building/nesting, 11]
      - [Socializing/playing, 6]
      - [Guarding, 2]
      - [Sleeping, 1]
  - tablename: Reactions
    description: Should be improved by CHA mod. 
    results:
      - "{useReferenceTable{ReactionReference}{2d6+{Charisma Modifier}}}"      
referenceTables:
  - tablename: ReactionReference
    entries: 
      - key: "<=6"
        value: "Hostile"  
      - key: "7-8"
        value: "Suspicious"  
      - key: "9"
        value: "Neutral"    
      - key: "10-11"
        value: "Curious"    
      - key: ">=12"
        value: "Friendly"