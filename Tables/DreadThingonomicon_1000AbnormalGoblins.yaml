filename: DreadThingonomicon_1000AbnormalGoblins.yaml
game: DreadThingonomicon
setting: Fantasy
type: Bestiary
tablename: 1000AbnormalGoblins
tables: 
  - name: Physical Description
    results:
      - One of the goblin’s ears has been chewed off; only a bloody stump remains.
      - Clad in a mish-mash of gaudily-colored clothes, this goblin looks like a court jester or a motley fool.
      - This goblin wears a bone necklace of many finger and toe bones. They clack as the creature moves about.
      - Wearing leather armor, this goblin is festooned with belts and buckles. Many small pouches—all tightly cinched shut—hang from the belts.
      - Clad in a black robe, hacked off to fit and cinched at the waist with an oversized belt, this goblin has the air of the macabre about it. The cloak has a cowl in which holes have been cut for the creature’s oversized ears.
      - Rotting teeth fill this pathetically thin goblin’s mouth.
      - Oozing lesions cover this goblin’s face.
      - Half of this goblin’s hair has been burnt away; streaks of puckered scars cover its face.
      - This goblin wears a red patch over its left eye. Investigation reveals the eyepatch was colored with blood; the eye beneath has been gouged out.
      - Naked but for a filthy loincloth, crude tattoos cover this goblin’s scrawny body. The tattoos—an elf’s severed head, a big axe, and so on—are basic and poorly done.
  - name: Combat Behavior
    results:
      - This goblin hurls rocks at archer-types and spellcasters. Every time she hits, she screeches “Boom!” in Goblin.
      - An utter coward, this goblin screams and runs away as soon as anyone tries to attack him.
      - Terrified of injury, this goblin retreats if injured.
      - Drunk, this goblin is practically fearless. It charges into combat screaming in a high-pitched voice.
      - This goblin suffers from delusions of grandeur. At the start of combat, it hangs back and shouts commands to its comrades (which they ignore).
      - This goblin is convinced of its battle prowess. Before battle, it challenges the toughest-looking enemy to single combat. Honorable—for a goblin—it doesn’t cheat (that much) and fights to the death.
      - Obsessed with fire, this goblin loves to fight with blazing weapons. If given the chance, it coats its weapons in oil before setting them aflame and charging. Scorch marks cover the goblin’s hands and forearms.
      - Charging into battle, the goblin drops its weapon and tries to tackle its opponent to the ground. If successful, it whips out a dagger and starts stabbing.
      - More cunning than its fellows, this goblin tries to sneak around the back to engage weaker targets.
      - Obsessed with shiny treasure, this goblin stops fighting to loot downed opponents.
  - name: Treasure
    results:
      - This goblin carries a small pouch crammed full of smoked meat. Beyond all expectations, the meat is smoked correctly, tasty, and safe.
      - A leather necklace hangs around the goblin’s neck. From it hangs an iron holy symbol of a well-known good-aligned god. A small black stone—an onyx—set in the symbol is worth 5 gp.
      - This goblin hides its greatest treasure in its left boot—a tarnished gold piece stolen long ago from the chieftain. Only exhaustive searching reveals this hidden treasure.
      - Three vials of oil, already set with small makeshift wicks of ripped cloth, fill this goblin’s pouch.
      - The goblin’s belt has an ornate but tarnished iron belt buckle depicting a dragon’s maw. It is worth 1 gp.
      - An impressive collection of smooth, shiny pebbles fills this heavy pouch. The stones are worthless, but hidden among them is a small chunk of quartz worth 4 gp.
      - Carried in its pack, this goblin owns a short, 20-foot-long strip of dirty silk rope. The rope is in good condition.
      - This goblin has a wolf-skin hat. Sized for a small creature, it is warm but filthy. If clean, it is worth 5 sp.
      - The goblin’s pouch holds a battered small iron box containing a small quantity of pungent but soiled snuff.
      - Jet black fur edges this goblin’s dirty scarlet cloak. The cloak once belonged to a goblin hero. It is a status symbol among the goblins. If given the chance, a goblin tries to buy—or steal—the cloak.