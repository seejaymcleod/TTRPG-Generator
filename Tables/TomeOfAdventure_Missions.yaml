                - Duel
                - Execution or imprisonment
                - Exploration/mapping expedition
                - Furtive, stealthy raid
                - Military assault
                - Murder or attempted murder
                - Natural disaster
                - Swindle
                - Theft
                - Trailblazing attempt into new area
                - Treason and aftermath              
