filename: TomeOfAdventure_Missions.yaml
game: TomeOfAdventure
setting: Fantasy
type: Places, Adventure
tablename: Missions
tables:
  - tablename: MissionsByType
    customDisplay: "[{selectedResult, Types}]"
    subTables:
      - tablename: Individuals
        subTables: 
            - tablename: Individual_Missions
              results: 
                - "Bribe or negotiate with"
                - "Bring message to location of"
                - "Capture or arrest"
                - "Conceal/smuggle"
                - "Deliver/transport"
                - "Discover identity of"
                - "Distract, decoy, or"
                - "deceive"
                - "Entrap or sting"
                - "Extort from"
                - "Find missing"
                - "Get help from"
                - "Guard/protect"
                - "Incriminate or frame"
                - "Kidnap"
                - "Kill/assassinate"
                - "Rescue"
                - "Sabotage efforts of"
                - "Spy upon"
                - "Steal item from"
                - "Waylay"
            - tablename: Individual_Mission_Subjects
              results: 
                - Adventurer(s)
                - Agent or diplomat
                - Cleric or religious leader
                - Criminal/outlaw
                - Intelligent monster
                - Local noble
                - Magic-user
                - Messenger
                - Saboteur
                - Secret agent or spy
                - "[PatronsOrTargets, 10]"
      - tablename: Items
        subTables: 
            - tablename: Item_Missions
              results: 
                - Attack to obtain
                - Conceal
                - Defend
                - Deliver or transport
                - Destroy
                - Fake existence of
                - Find or locate
                - Guard or protect
                - Hide
                - Hijack
                - Prevent delivery of
                - Prevent sabotage of
                - Raid to obtain
                - Retake or repossess
                - Sabotage
                - Salvage from
                - dangerous place
                - Smuggle
                - Steal from within
                - location
                - Steal while in transit
                - Swap fake imitation              
            - tablename: Item_Mission_Subjects
              results: 
                - Body or corpse
                - Cargo
                - Cattle or livestock
                - Clue
                - Evidence of crime
                - Evidence of innocence
                - Gold or jewelry
                - Magic item
                - Map
                - Message or letter
                - Monster
                - Mysterious sealed container
                - Ownership documents
                - Religious item
                - Ship
                - Statue or idol (portable)
                - Symbol of authority
                - Unusual animal (familiar, mascot, pet, prize cow, etc.)
                - Vehicles with cargo
                - Weapon (siege engine, famous sword, etc)    
      - tablename: Locations
        subTables: 
            - tablename: Location_Missions
              results:
                - [Assault, 2]
                - Break siege of
                - Capture and hold
                - [Defend from attack, 2]
                - Destroy
                - Escape from
                - Explore
                - Find or locate
                - Get supplies to
                - Infiltrate and control
                - Infiltrate and spy upon
                - Liberate
                - Locate intruder/spy
                - [Loot, 2]
                - Protect from infiltration
                - Reinforce
                - [Rescue hostages from, 2]
                - Retake
                - Secretly return something to
                - [Stage raid upon, 2]         
            - tablename: Location_Mission_Subjects
              results: 
                - Archaeological dig
                - Caravan
                - Castle
                - Caves
                - Cottage
                - Dungeon
                - Encampment
                - Extra-planar area
                - Flying Structure
                - Flying Vehicle
                - Forest
                - Fort
                - Fortified building or
                - manor
                - Grove
                - Oasis
                - Prison
                - Ruins
                - Ship
                - Stockade
                - Swamp
                - Tavern
                - Temple
                - Village
                - Warehouse
                - Wharfs or Docks       
      - tablename: Events
        subTables: 
            - tablename: Event_Missions
              results:
                - Destroy results of
                - Escape from
                - Solve bizarre mystery arising from
                - [Expose someone involved in, 2]
                - Hide evidence of what really happened in a recent
                - [Infiltrate group involved in, 2]
                - Investigate events of a recent
                - Investigate events of an ancient
                - Lead or coordinate
                - Plan and execute
                - [Prevent, 2]
                - [Protect someone involved in, 2]
                - Sabotage
                - [Survive or overcome, 2]
                - Take leadership in              
            - tablename: Event_Mission_Subjects
              results: 
                - Archaeological dig
                - Arena or gladiatorial battle
                - Arrest or trial
                - Assassination
                - Cattle drive through a dangerous area
                - Coronation or transfer of power
                - Coup d’etat or rebellion
